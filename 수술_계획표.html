<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwqoF3IxJhbevcF_LBifphp4UNgAaEBuWXl3pTcQ1Em2DmGJ7i02VhGAJAvyCzvzSULeA/exec';
const STORE_KEY = 'cheonan-ortho-surgery-plan-v1';
const GENDER = ['남','여'];
const ANESTHESIA = ['전신마취','척추마취','경막외마취','신경차단','국소마취','수면마취'];
const URGENCY = ['예정','응급'];
const DURATION = ['30분','1시간','1시간 30분','2시간','2시간 30분','3시간','3시간 이상'];
const NPO = ['확인','미확인'];
const ALLERGY = ['없음','있음'];
const ANTICOAG = ['복용 안 함','복용 중','중단 완료'];
const INFECTION = ['없음','MRSA','VRE','B형간염','C형간염','기타'];
const CARM = ['필요','불필요'];
const POSITION = ['앙와위','측와위','복와위','비치체어','견인대 사용','해당없음'];
const STATUS = ['예정','진행 중','완료','취소'];
const SIDE = ['좌','우','양측','해당없음'];
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];
const SURGERY_SUGGESTIONS = ['ACL · 전방십자인대재건술','ATFL · 발목인대재건술','BPHA · 고관절반치환술','CTR · 수근관감압술','HTO · 근위경골절골술','Meniscectomy · 반월상연골절제술','Meniscus Repair · 반월상연골봉합술','Meniscus Root Repair · 후근봉합술','PEN · 경막외신경성형술','PFNA · 대퇴부근위부골절수술','RCT · 회전근개봉합술','TKRA · 무릎 인공관절수술','Trigger Finger · 방아쇠수지수술','ORIF · 발목골절수술','ORIF · 손목골절수술','ORIF · 어깨골절수술','MUA · 오십견 마취하 도수조작술','VP · 척추체성형술','SUTURE 창상봉합술','E & B 절제생검','INGROWING NAIL 내향성 발톱','CORN REMOVAL 티눈제거','CRIF Foot','CRIF Hand'];
const DIAGNOSIS_SUGGESTIONS = ['ACL tear','Chronic ankle instability','Femoral neck fracture','Carpal tunnel syndrome','Medial knee osteoarthritis (varus)','Meniscus tear','Meniscus root tear','Lumbar disc herniation','Lumbar spinal stenosis','Intertrochanteric fracture','Rotator cuff tear','Knee osteoarthritis','Trigger finger','Ankle fracture','Distal radius fracture','Proximal humerus fracture','Adhesive capsulitis (frozen shoulder)','Vertebral compression fracture','Laceration','Soft tissue mass','Ingrown toenail','Corn (clavus)','Foot fracture','Hand fracture'];
const TABLE_HEADERS = ['시간','집도의','차트번호','환자명','성별/나이','마취종류','수술명','부위','진단명','응급/예정','예상시간','병실','금식','알레르기','항응고제','감염','임플란트/재료','C-arm','체위','상태','비고'];

function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function uid(){ return 'sx-'+Date.now()+'-'+Math.random().toString(16).slice(2,8); }
function timeToMinutes(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }

function defaultFormData(dateStr, doctor){
  return { date: dateStr, time:'09:00', doctor: doctor||'', chartNo:'', name:'', gender:GENDER[0], age:'',
    anesthesia:ANESTHESIA[0], surgeryName:'', side:SIDE[3], diagnosis:'', urgency:URGENCY[0], duration:DURATION[0],
    room:'', npo:NPO[0], allergy:ALLERGY[0], anticoag:ANTICOAG[0], infection:INFECTION[0], implant:'',
    cArm:CARM[1], position:POSITION[0], status:STATUS[0], note:'' };
}

const state = {
  view: 'month',
  monthYear: new Date().getFullYear(),
  monthMonth: new Date().getMonth(),
  selectedDate: toISO(new Date()),
  surgeries: [],
  doctors: ['김진일'],
  editingId: null,
  formData: null,
  syncStatus: 'idle'
};

function loadLocal(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.surgeries = data.surgeries || [];
      state.doctors = (data.doctors && data.doctors.length) ? data.doctors : ['김진일'];
    }
  } catch(e){}
}
function saveLocal(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors })); } catch(e){}
}
function setSyncLabel(status){
  state.syncStatus = status;
  const el = document.getElementById('syncLabel');
  if (el) el.textContent = status==='syncing' ? '동기화 중...' : (status==='error' ? '동기화 실패' : (status==='synced' ? '구글시트 동기화됨' : ''));
}
function pullFromSheet(){
  if (!SHEET_URL) return;
  setSyncLabel('syncing');
  fetch(SHEET_URL + '?action=get&key=surgeryPlanData')
    .then(r => r.json())
    .then(res => {
      if (res && res.value) {
        const data = JSON.parse(res.value);
        state.surgeries = data.surgeries || [];
        state.doctors = (data.doctors && data.doctors.length) ? data.doctors : ['김진일'];
        renderAll();
      }
      setSyncLabel('synced');
    })
    .catch(() => setSyncLabel('error'));
}
function pushToSheet(){
  if (!SHEET_URL) return;
  setSyncLabel('syncing');
  fetch(SHEET_URL, { method:'POST', body: JSON.stringify({ action:'set', key:'surgeryPlanData', value: JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors }) }) })
    .then(() => setSyncLabel('synced'))
    .catch(() => setSyncLabel('error'));
}
function persist(){ saveLocal(); pushToSheet(); }

function rowStyleFor(s){
  if (s.status === '취소') return 'background:#F1F2F4;border-bottom:1px solid #E3E7ED;color:#8A8F98;';
  if (s.urgency === '응급') return 'background:#FDECEE;border-bottom:1px solid #F6C9CE;';
  if ((s.infection && s.infection !== '없음') || s.allergy === '있음' || s.anticoag === '복용 중') return 'background:#FFF3E0;border-bottom:1px solid #FBDDA8;';
  if (s.npo === '미확인') return 'background:#FFFBE0;border-bottom:1px solid #F5E39C;';
  return 'background:#FFFFFF;border-bottom:1px solid #E3E7ED;';
}

function renderTopActions(){
  const el = document.getElementById('topRightActions');
  if (state.view === 'month') {
    el.innerHTML = '<button id="monthReportBtn" style="border:1px solid #E3E7ED;background:#FFFFFF;color:#1F2430;padding:10px 16px;border-radius:10px;font-size:0.92rem;font-weight:700;cursor:pointer;">리포트 내보내기</button>';
    document.getElementById('monthReportBtn').onclick = openMonthReport;
  } else {
    el.innerHTML =
      '<button id="backToMonthBtn" style="border:1px solid #E3E7ED;background:#FFFFFF;color:#1F2430;padding:10px 16px;border-radius:10px;font-size:0.92rem;font-weight:700;cursor:pointer;">← 월별보기</button>'+
      '<button id="addSurgeryBtn" style="border:1px solid #3B6FA8;background:#3B6FA8;color:#fff;padding:10px 16px;border-radius:10px;font-size:0.92rem;font-weight:700;cursor:pointer;">＋ 수술 추가</button>'+
      '<span id="syncLabel" style="font-size:0.78rem;color:#6B7280;font-weight:700;"></span>'+
      '<button id="printDayBtn" style="border:1px solid #E3E7ED;background:#FFFFFF;color:#1F2430;padding:10px 16px;border-radius:10px;font-size:0.92rem;font-weight:700;cursor:pointer;">인쇄 / PDF</button>';
    document.getElementById('backToMonthBtn').onclick = () => { state.view = 'month'; renderAll(); };
    document.getElementById('addSurgeryBtn').onclick = openAddForm;
    document.getElementById('printDayBtn').onclick = () => window.print();
    setSyncLabel(state.syncStatus);
  }
}

function renderMonth(){
  document.getElementById('monthView').style.display = state.view==='month' ? 'block' : 'none';
  if (state.view !== 'month') return;
  document.getElementById('monthLabel').textContent = state.monthYear + '년 ' + (state.monthMonth+1) + '월';

  const weekRow = document.getElementById('weekDaysRow');
  weekRow.innerHTML = WEEKDAY_LABELS.map((l,i) => '<div style="text-align:center;font-size:0.85rem;font-weight:800;color:'+(i===0?'#E0384A':(i===6?'#3B6FA8':'#6B7280'))+';padding:6px 0;">'+l+'</div>').join('');

  const firstOfMonth = new Date(state.monthYear, state.monthMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const gridStart = new Date(state.monthYear, state.monthMonth, 1 - startOffset);
  const today = toISO(new Date());
  const byDate = {};
  state.surgeries.forEach(r => { (byDate[r.date] = byDate[r.date]||[]).push(r); });

  let monthTotalCount = 0, monthCancelledCount = 0;
  const daysInMonth = new Date(state.monthYear, state.monthMonth+1, 0).getDate();
  for (let day=1; day<=daysInMonth; day++){
    const dateStr = state.monthYear+'-'+pad2(state.monthMonth+1)+'-'+pad2(day);
    const recs = byDate[dateStr] || [];
    monthTotalCount += recs.filter(r=>r.status!=='취소').length;
    monthCancelledCount += recs.filter(r=>r.status==='취소').length;
  }
  document.getElementById('monthCountBadge').textContent = '이달 수술 ' + monthTotalCount + '건 (취소 ' + monthCancelledCount + '건 제외)';

  const grid = document.getElementById('monthGrid');
  let html = '';
  for (let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const dateStr = toISO(d);
    const inMonth = d.getMonth() === state.monthMonth;
    const recs = byDate[dateStr] || [];
    const active = recs.filter(r=>r.status!=='취소');
    const cancelled = recs.filter(r=>r.status==='취소');
    const hasEmergency = active.some(r=>r.urgency==='응급');
    const isToday = dateStr === today;
    html += '<div class="monthCell" data-date="'+dateStr+'" style="min-height:86px;border-radius:10px;padding:8px;background:'+(isToday?'#E8EFF6':(inMonth?'#FFFFFF':'#F7F8FA'))+';border:'+(isToday?'1px solid #3B6FA8':'1px solid #EDEFF2')+';cursor:pointer;opacity:'+(inMonth?1:0.5)+';">'
      + '<div style="font-size:0.9rem;font-weight:'+(isToday?800:700)+';color:'+(isToday?'#3B6FA8':'#1F2430')+';">'+d.getDate()+'</div>'
      + (active.length>0 ? '<div style="margin-top:4px;background:#E8EFF6;color:#3B6FA8;border-radius:6px;padding:2px 6px;font-size:0.72rem;font-weight:800;display:inline-block;">'+active.length+'건</div>' : '')
      + (cancelled.length>0 ? '<div style="margin-top:3px;color:#8A8F98;font-size:0.68rem;font-weight:700;">취소 '+cancelled.length+'</div>' : '')
      + (hasEmergency ? '<div style="margin-top:3px;color:#E0384A;font-size:0.68rem;font-weight:800;">응급 있음</div>' : '')
      + '</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.monthCell').forEach(cell => {
    cell.onclick = () => { state.selectedDate = cell.getAttribute('data-date'); state.view = 'day'; renderAll(); };
  });
}

function renderDay(){
  document.getElementById('dayView').style.display = state.view==='day' ? 'block' : 'none';
  if (state.view !== 'day') return;
  const selDate = fromISO(state.selectedDate);
  document.getElementById('selectedDateLabel').textContent = selDate.getFullYear()+'년 '+(selDate.getMonth()+1)+'월 '+selDate.getDate()+'일 ('+WEEKDAY_LABELS[selDate.getDay()]+')';

  const recs = state.surgeries.filter(r => r.date === state.selectedDate).slice().sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
  const active = recs.filter(r=>r.status!=='취소');
  const cancelled = recs.filter(r=>r.status==='취소');
  document.getElementById('dayCountLabel').textContent = '수술 '+active.length+'건 (취소 제외) · 취소 '+cancelled.length+'건';

  document.getElementById('tableHeadRow').innerHTML = TABLE_HEADERS.map(h => '<th style="text-align:center;padding:9px 10px;font-weight:800;color:#6B7280;white-space:nowrap;border-bottom:1px solid #E3E7ED;">'+h+'</th>').join('') + '<th data-noprint="true" style="padding:9px 10px;border-bottom:1px solid #E3E7ED;"></th>';

  const tbody = document.getElementById('dayTableBody');
  if (recs.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('dayEmptyMsg').style.display = 'block';
  } else {
    document.getElementById('dayEmptyMsg').style.display = 'none';
    tbody.innerHTML = recs.map(r => {
      const cells = [r.time, r.doctor, r.chartNo, r.name, (r.gender||'')+' / '+(r.age||''), r.anesthesia, r.surgeryName, r.side, r.diagnosis, r.urgency, r.duration, r.room, r.npo, r.allergy, r.anticoag, r.infection, r.implant, r.cArm, r.position, r.status, r.note];
      const boldCols = [0,3,9,19];
      const tds = cells.map((c,i) => '<td style="padding:9px 10px;white-space:nowrap;'+(boldCols.includes(i)?'font-weight:800;':'')+'">'+esc(c)+'</td>').join('');
      return '<tr style="'+rowStyleFor(r)+'">'+tds+
        '<td data-noprint="true" style="padding:9px 10px;white-space:nowrap;">'+
        '<button class="editBtn" data-id="'+r.id+'" style="border:none;background:transparent;color:#3B6FA8;font-weight:700;cursor:pointer;margin-right:6px;">수정</button>'+
        '<button class="deleteBtn" data-id="'+r.id+'" style="border:none;background:transparent;color:#E0384A;font-weight:700;cursor:pointer;">삭제</button>'+
        '</td></tr>';
    }).join('');
    tbody.querySelectorAll('.editBtn').forEach(b => b.onclick = () => openEditForm(b.getAttribute('data-id')));
    tbody.querySelectorAll('.deleteBtn').forEach(b => b.onclick = () => deleteRecord(b.getAttribute('data-id')));
  }
}

const FORM_FIELDS = [
  {key:'date', label:'수술일자', kind:'date'},
  {key:'time', label:'수술시간', kind:'time'},
  {key:'doctor', label:'집도의', kind:'text', list:'doctorList'},
  {key:'chartNo', label:'차트번호', kind:'text'},
  {key:'name', label:'환자 이름', kind:'text'},
  {key:'gender', label:'성별', kind:'select', options:GENDER},
  {key:'age', label:'나이', kind:'number'},
  {key:'anesthesia', label:'마취종류', kind:'select', options:ANESTHESIA},
  {key:'surgeryName', label:'수술명', kind:'text', list:'surgeryList'},
  {key:'side', label:'수술부위', kind:'select', options:SIDE},
  {key:'diagnosis', label:'진단명', kind:'text', list:'diagnosisList'},
  {key:'urgency', label:'응급/예정', kind:'select', options:URGENCY},
  {key:'duration', label:'예상소요시간', kind:'select', options:DURATION},
  {key:'room', label:'입원병실', kind:'text'},
  {key:'npo', label:'금식(NPO)', kind:'select', options:NPO},
  {key:'allergy', label:'알레르기', kind:'select', options:ALLERGY},
  {key:'anticoag', label:'항응고제', kind:'select', options:ANTICOAG},
  {key:'infection', label:'감염여부', kind:'select', options:INFECTION},
  {key:'implant', label:'임플란트/재료', kind:'text'},
  {key:'cArm', label:'C-arm', kind:'select', options:CARM},
  {key:'position', label:'체위', kind:'select', options:POSITION},
  {key:'status', label:'진행상태', kind:'select', options:STATUS},
  {key:'note', label:'비고', kind:'text'}
];

function renderForm(){
  const modal = document.getElementById('formModal');
  if (!state.formData) { modal.style.display = 'none'; return; }
  modal.style.display = 'flex';
  document.getElementById('formTitle').textContent = state.editingId ? '수술 일정 수정' : '수술 일정 추가';
  document.getElementById('deleteFormBtn').style.display = state.editingId ? 'block' : 'none';

  const grid = document.getElementById('formFieldsGrid');
  grid.innerHTML = FORM_FIELDS.map(f => {
    const val = state.formData[f.key] || '';
    let input;
    if (f.kind === 'select') {
      input = '<select data-key="'+f.key+'" style="width:100%;padding:9px 10px;font-size:0.95rem;border-radius:9px;border:1px solid #E3E7ED;background:#FFFFFF;">' +
        f.options.map(o => '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('') + '</select>';
    } else {
      const type = f.kind === 'number' ? 'number' : (f.kind === 'date' ? 'date' : (f.kind === 'time' ? 'time' : 'text'));
      input = '<input type="'+type+'" data-key="'+f.key+'" value="'+esc(val)+'"'+(f.list?' list="'+f.list+'"':'')+' style="width:100%;padding:9px 10px;font-size:0.95rem;border-radius:9px;border:1px solid #E3E7ED;box-sizing:border-box;"/>';
    }
    return '<div style="display:flex;flex-direction:column;gap:6px;"><label style="font-size:0.82rem;font-weight:700;color:#6B7280;">'+f.label+'</label>'+input+'</div>';
  }).join('');
  grid.querySelectorAll('[data-key]').forEach(el => {
    el.onchange = (e) => { state.formData[el.getAttribute('data-key')] = e.target.value; };
  });
}

function refreshDatalists(){
  document.getElementById('doctorList').innerHTML = state.doctors.map(d => '<option value="'+esc(d)+'"></option>').join('');
  document.getElementById('surgeryList').innerHTML = SURGERY_SUGGESTIONS.map(s => '<option value="'+esc(s)+'"></option>').join('');
  document.getElementById('diagnosisList').innerHTML = DIAGNOSIS_SUGGESTIONS.map(s => '<option value="'+esc(s)+'"></option>').join('');
}

function openAddForm(){
  state.editingId = null;
  state.formData = defaultFormData(state.selectedDate, state.doctors[0]);
  renderForm();
}
function openEditForm(id){
  const rec = state.surgeries.find(x => x.id === id);
  if (!rec) return;
  state.editingId = id;
  state.formData = Object.assign({}, rec);
  renderForm();
}
function closeForm(){ state.editingId = null; state.formData = null; renderForm(); }
function saveForm(){
  const fd = state.formData;
  if (!fd) return;
  if (state.editingId) {
    state.surgeries = state.surgeries.map(x => x.id === state.editingId ? Object.assign({}, fd, {id: state.editingId}) : x);
  } else {
    state.surgeries.push(Object.assign({}, fd, {id: uid()}));
  }
  if (fd.doctor && state.doctors.indexOf(fd.doctor) === -1) state.doctors.push(fd.doctor);
  persist();
  state.editingId = null; state.formData = null;
  renderAll();
}
function deleteFromForm(){
  if (!confirm('이 수술 일정을 삭제할까요?')) return;
  state.surgeries = state.surgeries.filter(x => x.id !== state.editingId);
  persist();
  state.editingId = null; state.formData = null;
  renderAll();
}
function deleteRecord(id){
  if (!confirm('이 수술 일정을 삭제할까요?')) return;
  state.surgeries = state.surgeries.filter(x => x.id !== id);
  persist();
  renderAll();
}

function openMonthReport(){
  const modal = document.getElementById('monthReportModal');
  modal.style.display = 'flex';
  document.getElementById('reportTitle').textContent = (state.monthYear+'년 '+(state.monthMonth+1)+'월 수술현황 리포트');
  const byDate = {};
  state.surgeries.forEach(r => { (byDate[r.date] = byDate[r.date]||[]).push(r); });
  let total = 0, cancelledTotal = 0;
  const daysInMonth = new Date(state.monthYear, state.monthMonth+1, 0).getDate();
  const rows = [];
  for (let day=1; day<=daysInMonth; day++){
    const dateStr = state.monthYear+'-'+pad2(state.monthMonth+1)+'-'+pad2(day);
    const recs = byDate[dateStr] || [];
    const active = recs.filter(r=>r.status!=='취소');
    const cancelled = recs.filter(r=>r.status==='취소');
    total += active.length; cancelledTotal += cancelled.length;
    if (recs.length > 0) {
      rows.push({ label: (state.monthMonth+1)+'월 '+day+'일 ('+WEEKDAY_LABELS[new Date(state.monthYear,state.monthMonth,day).getDay()]+')', count: active.length, cancelledCount: cancelled.length });
    }
  }
  document.getElementById('reportTotal').textContent = total;
  document.getElementById('reportCancelled').textContent = cancelledTotal;
  const rowsEl = document.getElementById('reportRows');
  if (rows.length === 0) {
    rowsEl.innerHTML = '<div style="padding:20px 2px;color:#6B7280;font-size:0.9rem;">이 달에 등록된 수술이 없습니다.</div>';
  } else {
    rowsEl.innerHTML = rows.map(r => '<div style="display:flex;justify-content:space-between;padding:7px 2px;font-size:0.9rem;border-bottom:1px dashed #E3E7ED;"><span>'+r.label+'</span><span>'+r.count+'건'+(r.cancelledCount>0?' (취소 '+r.cancelledCount+')':'')+'</span></div>').join('');
  }
}
function closeMonthReport(){ document.getElementById('monthReportModal').style.display = 'none'; }

function renderAll(){
  renderTopActions();
  renderMonth();
  renderDay();
  renderForm();
  refreshDatalists();
}

document.getElementById('prevMonthBtn').onclick = () => { state.monthMonth--; if (state.monthMonth<0){state.monthMonth=11; state.monthYear--;} renderAll(); };
document.getElementById('nextMonthBtn').onclick = () => { state.monthMonth++; if (state.monthMonth>11){state.monthMonth=0; state.monthYear++;} renderAll(); };
document.getElementById('todayMonthBtn').onclick = () => { const d=new Date(); state.monthYear=d.getFullYear(); state.monthMonth=d.getMonth(); renderAll(); };
document.getElementById('prevDayBtn').onclick = () => { const d=fromISO(state.selectedDate); d.setDate(d.getDate()-1); state.selectedDate=toISO(d); renderAll(); };
document.getElementById('nextDayBtn').onclick = () => { const d=fromISO(state.selectedDate); d.setDate(d.getDate()+1); state.selectedDate=toISO(d); renderAll(); };
document.getElementById('todayDayBtn').onclick = () => { state.selectedDate = toISO(new Date()); renderAll(); };
document.getElementById('closeFormBtn').onclick = closeForm;
document.getElementById('saveFormBtn').onclick = saveForm;
document.getElementById('deleteFormBtn').onclick = deleteFromForm;
document.getElementById('closeReportBtn').onclick = closeMonthReport;
document.getElementById('printReportBtn').onclick = () => { document.body.setAttribute('data-print-mode','month-report'); window.print(); };
window.addEventListener('afterprint', () => document.body.setAttribute('data-print-mode','day-plan'));

loadLocal();
renderAll();
pullFromSheet();
</script>
</body>
</html>
