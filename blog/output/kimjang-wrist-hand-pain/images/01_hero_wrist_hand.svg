<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="WenQuanYi Zen Hei, Noto Sans KR, sans-serif">
<title>손목과 손가락의 불편감을 표현한 일반 일러스트</title>
<rect width="1200" height="675" fill="#F5F3EE"/>
<circle cx="880" cy="330" r="250" fill="#E4E8E6"/>
<g transform="translate(880 340)" fill="#EADFD2" stroke="#5B6670" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
<rect x="-70" y="120" width="140" height="190" rx="30"/>
<rect x="-85" y="-20" width="170" height="165" rx="48"/>
<rect x="-85" y="-170" width="36" height="170" rx="18"/>
<rect x="-42" y="-205" width="36" height="205" rx="18"/>
<rect x="1" y="-195" width="36" height="195" rx="18"/>
<rect x="44" y="-150" width="36" height="150" rx="18"/>
<rect x="-150" y="-10" width="36" height="120" rx="18" transform="rotate(35 -132 100)"/>
</g>
<g fill="none" stroke="#1F5C82" stroke-width="5" stroke-linecap="round">
<path d="M740 470 q15 -14 30 0 t30 0"/><path d="M960 470 q15 -14 30 0 t30 0"/>
<path d="M728 380 q-14 15 0 30 t0 30" opacity=".6"/>
</g>
<text x="90" y="290" font-size="30" fill="#1F5C82">천안본정형외과 건강 정보</text>
<text x="90" y="360" font-size="56" font-weight="bold" fill="#26292C">손목과 손가락이</text>
<text x="90" y="430" font-size="56" font-weight="bold" fill="#26292C">계속 불편하다면</text>
<text x="90" y="490" font-size="28" fill="#6B747C">증상에 따라 진료를 고려해 보세요</text>
</svg>
