<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1260" viewBox="0 0 1080 1260" font-family="WenQuanYi Zen Hei, Noto Sans KR, sans-serif">
<title>병원 방문을 고려할 신호 체크리스트</title>
<rect width="1080" height="1260" fill="#F5F3EF"/>
<rect x="50" y="50" width="980" height="1160" rx="36" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="3"/>
<text x="100" y="140" font-size="26" fill="#5F7F86">천안본정형외과 건강 정보</text>
<text x="100" y="212" font-size="52" font-weight="bold" fill="#3D4651">진료를 고려해 볼 신호</text>
<line x1="100" y1="250" x2="980" y2="250" stroke="#D9D2C5" stroke-width="3"/>
<g font-size="32" fill="#3D4651">
<g id="r"></g>
<rect x="100" y="300" width="44" height="44" rx="10" fill="none" stroke="#5F7F86" stroke-width="4"/><text x="175" y="335">밤에 손이 저려 자다가 깬다</text>
<rect x="100" y="410" width="44" height="44" rx="10" fill="none" stroke="#5F7F86" stroke-width="4"/><text x="175" y="445">엄지 아래가 납작해지거나 쥘 힘이 약해졌다</text>
<rect x="100" y="520" width="44" height="44" rx="10" fill="none" stroke="#5F7F86" stroke-width="4"/><text x="175" y="555">손가락이 걸리거나 잘 펴지지 않는다</text>
<rect x="100" y="630" width="44" height="44" rx="10" fill="none" stroke="#5F7F86" stroke-width="4"/><text x="175" y="665">엄지 쪽 손목이 쥘 때 더 아프다</text>
<rect x="100" y="740" width="44" height="44" rx="10" fill="none" stroke="#5F7F86" stroke-width="4"/><text x="175" y="775">쉬어도 계속되거나 반복된다</text>
<rect x="100" y="850" width="44" height="44" rx="10" fill="none" stroke="#5F7F86" stroke-width="4"/><text x="175" y="885">당뇨, 갑상선 질환, 류마티스관절염이 있다</text>
</g>
<rect x="100" y="970" width="880" height="130" rx="20" fill="#E4E8E6"/>
<text x="140" y="1030" font-size="30" fill="#3D4651">해당 항목이 있다면 진료 상담을 받아 보세요.</text>
<text x="140" y="1075" font-size="24" fill="#6B747C">이 목록만으로 진단할 수 없습니다.</text>
<text x="100" y="1165" font-size="22" fill="#6B747C">정확한 진단은 진료를 통해 가능합니다.</text>
</svg>
