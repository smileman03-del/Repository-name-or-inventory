<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="WenQuanYi Zen Hei, Noto Sans KR, sans-serif">
<title>손목 신경과 힘줄 위치 단순 모식도</title>
<rect width="1200" height="800" fill="#F5F3EF"/>
<text x="60" y="80" font-size="38" font-weight="bold" fill="#3D4651">손목 안쪽, 신경과 힘줄이 지나가는 길</text>
<text x="60" y="122" font-size="22" fill="#6B747C">이해를 돕기 위해 크게 단순화한 모식도입니다</text>
<g stroke-linecap="round" stroke-linejoin="round">
<path d="M330 170 H560 V330 H330 Z" fill="#EADFD2" stroke="#5B6670" stroke-width="4"/>
<path d="M300 330 H590 V470 H300 Z" fill="#EADFD2" stroke="#5B6670" stroke-width="4" transform="translate(0 0)"/>
<rect x="290" y="470" width="310" height="260" rx="40" fill="#EADFD2" stroke="#5B6670" stroke-width="4"/>
<rect x="290" y="372" width="310" height="34" fill="#C9C3B6" opacity=".9"/>
<g stroke="#8A8F94" stroke-width="9" fill="none">
<path d="M370 175 V730"/><path d="M405 175 V730"/><path d="M440 175 V730"/><path d="M475 175 V730"/>
</g>
<path d="M520 175 V730" stroke="#5F7F86" stroke-width="16" fill="none"/>
<path d="M310 190 q-30 60 -10 160" stroke="#B59A7A" stroke-width="9" fill="none"/>
</g>
<g font-size="26" fill="#3D4651">
<line x1="520" y1="250" x2="700" y2="250" stroke="#5F7F86" stroke-width="3"/><circle cx="520" cy="250" r="6" fill="#5F7F86"/>
<text x="715" y="258">정중신경</text>
<line x1="475" y1="320" x2="700" y2="360" stroke="#8A8F94" stroke-width="3"/><circle cx="475" cy="320" r="6" fill="#8A8F94"/>
<text x="715" y="368">손가락을 굽히는 힘줄</text>
<line x1="590" y1="389" x2="700" y2="470" stroke="#9A9486" stroke-width="3"/>
<text x="715" y="478">손목 인대 띠 (통로)</text>
<line x1="305" y1="260" x2="220" y2="260" stroke="#B59A7A" stroke-width="3"/>
<text x="60" y="268" >엄지 쪽 힘줄</text>
</g>
<text x="60" y="765" font-size="20" fill="#6B747C">실제 구조와 위치는 개인마다 다를 수 있으며 진단 기준이 아닙니다.</text>
</svg>
