<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>조인성의 그림그리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FFFDF6; --ink:#3A3A3A; --card:#FFFFFF; --shadow: 0 8px 0 rgba(0,0,0,0.08); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Baloo 2', sans-serif;
    background: radial-gradient(circle at 15% 10%, #FFE9B8 0%, transparent 40%), radial-gradient(circle at 90% 85%, #C9F2D8 0%, transparent 45%), var(--cream);
    min-height:100vh; color:var(--ink);
    display:flex; justify-content:center; padding:14px 10px 40px;
  }
  .app{ width:100%; max-width:560px; }
  header{ text-align:center; margin-bottom:10px; }
  header h1{ font-size:1.4rem; font-weight:800; margin:4px 0 2px; color:#E8703A; }
  header p{ margin:0; font-size:0.85rem; color:#7a7a7a; font-weight:500; }

  .topnav{ display:flex; gap:8px; margin-bottom:10px; }
  .topnav button{
    flex:1; border:none; border-radius:16px; padding:10px; font-family:inherit; font-weight:800;
    font-size:0.95rem; background:#fff; box-shadow:var(--shadow); color:#999; cursor:pointer;
  }
  .topnav button.active{ background:#5B8DEF; color:#fff; transform:translateY(2px); box-shadow:0 4px 0 rgba(0,0,0,0.1); }

  .view{ display:none; }
  .view.active{ display:block; }

  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tab-btn{
    flex:1; border:none; border-radius:16px; padding:8px 4px; font-family:inherit; font-weight:700;
    font-size:0.8rem; background:var(--card); box-shadow:var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; color:#999;
  }
  .tab-btn span.emoji{ font-size:1.3rem; }
  .tab-btn.active{ color:#fff; transform:translateY(2px); box-shadow:0 4px 0 rgba(0,0,0,0.1); }
  .tab-btn[data-cat="dino"].active{ background:#5EA36A; }
  .tab-btn[data-cat="sea"].active{ background:#4DA6E0; }
  .tab-btn[data-cat="land"].active{ background:#D08A3E; }
  .tab-btn[data-cat="bug"].active{ background:#D97BB0; }

  .species-row{ display:flex; gap:8px; margin-bottom:10px; overflow-x:auto; padding-bottom:2px; }
  .species-chip{
    flex:0 0 auto; border:none; border-radius:14px; padding:7px 11px; font-family:inherit; font-weight:700;
    font-size:0.78rem; background:#fff; box-shadow:0 3px 0 rgba(0,0,0,0.08); color:#888; cursor:pointer;
    white-space:nowrap; display:flex; align-items:center; gap:4px;
  }
  .species-chip.active{ background:#FFDE9E; color:#8a5a1a; box-shadow:0 3px 0 rgba(0,0,0,0.12); }

  .canvas-outer{ background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:flex; justify-content:center; }
  .canvas-wrap{ position:relative; overflow:hidden; border-radius:14px; background:#fcfcfa; touch-action:none; }
  .canvas-wrap .layer{ position:absolute; top:0; left:0; display:block; }
  #drawCanvas{ z-index:1; }
  #tmplImg2{ opacity:.6; object-fit:contain; pointer-events:none; mix-blend-mode:multiply; z-index:2; }
  #drawCanvas{ cursor:crosshair; touch-action:none; }

  .toolbar{ margin-top:12px; background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:12px; }
  .row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .row:last-child{ margin-bottom:0; }
  .pen-btn{
    border:none; border-radius:12px; background:#f2f2f2; cursor:pointer; padding:8px;
    display:flex; align-items:center; justify-content:center; width:50px; height:44px;
  }
  .pen-btn.active{ background:#FFDE9E; }
  .pen-btn .dot{ background:#333; border-radius:50%; }
  .eraser-btn{ border:none; border-radius:12px; background:#f2f2f2; cursor:pointer; padding:8px 14px; font-family:inherit; font-weight:700; font-size:0.85rem; }
  .eraser-btn.active{ background:#FFB3B3; }
  .palette{ display:grid; grid-template-columns:repeat(8, 1fr); gap:7px; flex:1; }
  .swatch{
    width:100%; aspect-ratio:1/1; border-radius:50%; border:2px solid #fff; cursor:pointer; padding:0;
    box-shadow:0 0 0 2px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.5);
  }
  .swatch.selected{ box-shadow:0 0 0 2px #fff, 0 0 0 5px var(--sel-color, #333); transform:scale(1.1); }
  .actions{ display:flex; gap:8px; }
  .action-btn{
    flex:1; border:none; border-radius:14px; padding:11px 6px; font-family:inherit; font-weight:700;
    font-size:0.82rem; color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.15);
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .action-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.15); }
  #undoBtn{ background:#8C93A6; }
  #clearBtn{ background:#E0704F; }
  #sendBtn{ background:#4DA0A0; }
  .hint{ text-align:center; font-size:0.78rem; color:#a3a3a3; margin-top:8px; }
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#333; color:#fff; padding:12px 22px; border-radius:20px; font-weight:700; font-size:0.9rem;
    transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* board */
  .board-filter{ display:flex; gap:6px; margin-bottom:10px; }
  .board-filter button{
    flex:1; border:none; border-radius:14px; padding:8px 4px; font-family:inherit; font-weight:700;
    font-size:0.78rem; background:#fff; box-shadow:0 3px 0 rgba(0,0,0,0.08); color:#888; cursor:pointer;
  }
  .board-filter button.active{ background:#FFDE9E; color:#8a5a1a; }
  .board-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
  }
  .board-card{
    background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .board-card img{ width:100%; aspect-ratio:1/1; object-fit:contain; border-radius:10px; background:#fafafa; }
  .board-card span{ font-size:0.72rem; font-weight:700; color:#777; }
  .board-empty{ text-align:center; color:#aaa; font-size:0.9rem; padding:40px 10px; }

  .walk-overlay{
    position:fixed; inset:0; display:none; z-index:100; flex-direction:column;
  }
  .walk-overlay.show{ display:flex; }
  .walk-scene{ flex:1; position:relative; overflow:hidden; }
  .walk-scene.scene-dino{ background:linear-gradient(180deg,#BEE3C4 0%, #8FCB94 55%, #6FAF74 100%); }
  .walk-scene.scene-sea{ background:linear-gradient(180deg,#BEE7FA 0%, #6FC3E8 60%, #3E9FCB 100%); }
  .walk-scene.scene-land{ background:linear-gradient(180deg,#FFE9B0 0%, #F7CE7E 55%, #E0AE55 100%); }
  .walk-scene.scene-bug{ background:linear-gradient(180deg,#DDF3D0 0%, #B8E89E 60%, #93CE75 100%); }
  .walk-deco{ position:absolute; inset:0; pointer-events:none; opacity:.55; }
  .walk-actor{ position:absolute; width:110px; height:110px; will-change:left,top,transform; }
  .walk-actor img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.15)); }
  .walk-bar{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:rgba(0,0,0,.55); }
  .walk-bar button{
    border:none; border-radius:12px; padding:9px 16px; font-family:inherit; font-weight:700; font-size:0.85rem;
    background:#fff; color:#333; cursor:pointer;
  }
  .walk-bar .timer{ color:#fff; font-weight:700; font-size:0.85rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🖍️ 조인성의 그림그리기</h1>
    <p>손으로 직접 그리듯 색칠하고, 완성하면 게시판으로 보내보세요!</p>
  </header>

  <div class="topnav">
    <button id="navDraw" class="active">✏️ 그리기</button>
    <button id="navBoard">🖼️ 게시판</button>
  </div>

  <!-- ===================== 그리기 화면 ===================== -->
  <div class="view active" id="viewDraw">
    <div class="tabs">
      <button class="tab-btn active" data-cat="dino"><span class="emoji">🦖</span>공룡</button>
      <button class="tab-btn" data-cat="sea"><span class="emoji">🐋</span>바다동물</button>
      <button class="tab-btn" data-cat="land"><span class="emoji">🦁</span>육상동물</button>
      <button class="tab-btn" data-cat="bug"><span class="emoji">🦋</span>곤충</button>
    </div>
    <div class="species-row" id="speciesRow"></div>

    <div class="canvas-outer">
      <div class="canvas-wrap" id="canvasWrap">
        <img class="layer" id="tmplImg2" src="">
        <canvas class="layer" id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="toolbar">
      <div class="row">
        <button class="pen-btn" data-w="4"><div class="dot" style="width:5px;height:5px;"></div></button>
        <button class="pen-btn active" data-w="10"><div class="dot" style="width:11px;height:11px;"></div></button>
        <button class="pen-btn" data-w="20"><div class="dot" style="width:18px;height:18px;"></div></button>
        <button class="eraser-btn" id="eraserBtn">🧽 지우개</button>
      </div>
      <div class="row">
        <div class="palette" id="palette"></div>
      </div>
      <div class="row actions">
        <button class="action-btn" id="undoBtn">↩️ 되돌리기</button>
        <button class="action-btn" id="clearBtn">🔄 전체지우기</button>
        <button class="action-btn" id="sendBtn">🖼️ 게시판으로</button>
      </div>
    </div>
    <p class="hint">연한 선을 따라 손가락이나 펜으로 자유롭게 그려보세요, 인성아!</p>
  </div>

  <!-- ===================== 게시판 화면 ===================== -->
  <div class="view" id="viewBoard">
    <div class="board-filter" id="boardFilter">
      <button class="active" data-f="all">전체</button>
      <button data-f="dino">🦖 공룡</button>
      <button data-f="sea">🐋 바다</button>
      <button data-f="land">🦁 육상</button>
      <button data-f="bug">🦋 곤충</button>
    </div>
    <div class="board-grid" id="boardGrid"></div>
    <div class="board-empty" id="boardEmpty">아직 게시판에 보낸 그림이 없어요.<br>그림을 완성하고 "게시판으로" 버튼을 눌러보세요!</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===================== 걷기 애니메이션 오버레이 ===================== -->
<div class="walk-overlay" id="walkOverlay">
  <div class="walk-bar">
    <span class="timer" id="walkTimer">3:00</span>
    <div>
      <button id="fullscreenBtn">⛶ 전체화면(TV연결용)</button>
      <button id="closeWalkBtn">✕ 닫기</button>
    </div>
  </div>
  <div class="walk-scene" id="walkScene">
    <svg class="walk-deco" id="walkDeco" viewBox="0 0 800 500" preserveAspectRatio="none"></svg>
    <div class="walk-actor" id="walkActor"><img id="walkActorImg" src=""></div>
  </div>
</div>

<!-- ===================== 도안 템플릿 (연한 안내선) ===================== -->
<div style="display:none">
<svg id="hold"></svg>
</div>

  ]}
};

/* ---------- template image element (static, in HTML) ---------- */
const tmplImg = document.getElementById('tmplImg2');

/* ---------- state ---------- */
let currentCat = 'dino';
let currentSpecies = 'trex';
let currentColor = '#FF6B6B';
let currentWidth = 10;
let eraserOn = false;
let strokes = [];
let boardItems = [];
let boardFilterVal = 'all';

/* ---------- species chips ---------- */
function renderSpeciesRow(){
  const row = document.getElementById('speciesRow');
  row.innerHTML = '';
  categories[currentCat].species.forEach(sp => {
    const chip = document.createElement('button');
    chip.className = 'species-chip' + (sp.id===currentSpecies ? ' active':'');
    chip.innerHTML = `<span>${sp.emoji}</span><span>${sp.name}</span>`;
    chip.addEventListener('click', () => { currentSpecies = sp.id; renderSpeciesRow(); showTmpl(); clearStrokes(); });
    row.appendChild(chip);
  });
}
function showTmpl(){
  const key = `${currentCat}-${currentSpecies}`;
  tmplImg.src = TEMPLATE_IMAGES[key] || '';
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    currentSpecies = categories[currentCat].species[0].id;
    renderSpeciesRow(); showTmpl(); clearStrokes();
  });
});

/* ---------- canvas drawing ---------- */
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const outer = document.querySelector('.canvas-outer');
  const available = outer.clientWidth - 20; // minus 10px padding each side
  const size = Math.max(100, Math.floor(available));
  const wrap = document.getElementById('canvasWrap');
  wrap.style.width = size + 'px';
  wrap.style.height = size + 'px';
  tmplImg.style.width = size + 'px';
  tmplImg.style.height = size + 'px';
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=> setTimeout(resizeCanvas, 100));

let drawing = false;
let curStroke = null;

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  drawing = true;
  const p = getPos(e);
  curStroke = { color: eraserOn ? '#ffffff' : currentColor, width: currentWidth, erase: eraserOn, pts:[p] };
});
canvas.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const p = getPos(e);
  curStroke.pts.push(p);
  drawSegment(curStroke, curStroke.pts.length-2);
});
function endStroke(){
  if(!drawing) return;
  drawing = false;
  if(curStroke && curStroke.pts.length>0) strokes.push(curStroke);
  curStroke = null;
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('pointerleave', ()=>{ if(drawing) endStroke(); });

function drawSegment(stroke, i){
  if(i<0) return;
  const a = stroke.pts[i], b = stroke.pts[i+1];
  if(!a||!b) return;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth = stroke.width;
  if(stroke.erase){ ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)'; }
  else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=stroke.color; }
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function redraw(){
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,canvas.width,canvas.height);
  strokes.forEach(s=>{ for(let i=0;i<s.pts.length-1;i++) drawSegment(s,i); });
}
function clearStrokes(){ strokes=[]; redraw(); }

/* pen size buttons */
document.querySelectorAll('.pen-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.pen-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentWidth = parseInt(btn.dataset.w);
  });
});
document.getElementById('eraserBtn').addEventListener('click', function(){
  eraserOn = !eraserOn;
  this.classList.toggle('active', eraserOn);
});

/* palette */
const COLORS = ['#FF6B6B','#FFA94D','#FFD43B','#A9E34B','#51CF66','#38D9A9','#22B8CF','#4DABF7','#748FFC','#9775FA','#F783AC','#A9784B','#E8C39E','#ADB5BD','#495057','#000000'];
const palette = document.getElementById('palette');
COLORS.forEach((c,i)=>{
  const b = document.createElement('button');
  b.className='swatch'; b.style.background=c; b.style.setProperty('--sel-color',c);
  if(i===0) b.classList.add('selected');
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
    b.classList.add('selected');
    currentColor = c;
    if(eraserOn){ eraserOn=false; document.getElementById('eraserBtn').classList.remove('active'); }
  });
  palette.appendChild(b);
});

document.getElementById('undoBtn').addEventListener('click', ()=>{ strokes.pop(); redraw(); });
document.getElementById('clearBtn').addEventListener('click', clearStrokes);

/* toast */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* send to board: composite guide + drawing */
document.getElementById('sendBtn').addEventListener('click', ()=>{
  const off = document.createElement('canvas');
  off.width = 400; off.height = 400;
  const octx = off.getContext('2d');
  octx.fillStyle = '#ffffff'; octx.fillRect(0,0,400,400);
  octx.drawImage(canvas, 0, 0, 400, 400);
  octx.globalAlpha = 0.6;
  octx.globalCompositeOperation = 'multiply';
  octx.drawImage(tmplImg,0,0,400,400);
  octx.globalAlpha = 1;
  octx.globalCompositeOperation = 'source-over';
  const dataUrl = off.toDataURL('image/png');
  const sp = categories[currentCat].species.find(s=>s.id===currentSpecies);
  boardItems.unshift({ id: Date.now(), cat: currentCat, name: sp.name, emoji: sp.emoji, dataUrl });
  showToast('🖼️ 게시판으로 보냈어요!');
  renderBoard();
});

/* ---------- board / gallery ---------- */
document.getElementById('navDraw').addEventListener('click', ()=> switchView('draw'));
document.getElementById('navBoard').addEventListener('click', ()=> switchView('board'));
function switchView(v){
  document.getElementById('navDraw').classList.toggle('active', v==='draw');
  document.getElementById('navBoard').classList.toggle('active', v==='board');
  document.getElementById('viewDraw').classList.toggle('active', v==='draw');
  document.getElementById('viewBoard').classList.toggle('active', v==='board');
  if(v==='board') renderBoard();
  if(v==='draw') setTimeout(resizeCanvas, 30);
}
document.querySelectorAll('#boardFilter button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#boardFilter button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    boardFilterVal = b.dataset.f;
    renderBoard();
  });
});
function renderBoard(){
  const grid = document.getElementById('boardGrid');
  const empty = document.getElementById('boardEmpty');
  grid.innerHTML = '';
  const items = boardFilterVal==='all' ? boardItems : boardItems.filter(i=>i.cat===boardFilterVal);
  empty.style.display = items.length ? 'none' : 'block';
  items.forEach(item=>{
    const card = document.createElement('div');
    card.className='board-card';
    card.innerHTML = `<img src="${item.dataUrl}"><span>${item.emoji} ${item.name}</span>`;
    card.addEventListener('click', ()=> openWalk(item));
    grid.appendChild(card);
  });
}

/* ---------- walk animation ---------- */
const walkOverlay = document.getElementById('walkOverlay');
const walkScene = document.getElementById('walkScene');
const walkActor = document.getElementById('walkActor');
const walkActorImg = document.getElementById('walkActorImg');
const walkTimer = document.getElementById('walkTimer');
const walkDeco = document.getElementById('walkDeco');
let walkRAF = null;
let walkStart = 0;
const WALK_DURATION = 180000; // 3분

const SCENES = {
  dino:{cls:'scene-dino', deco:`<circle cx="80" cy="80" r="45" fill="#fff" opacity=".7"/><circle cx="700" cy="60" r="30" fill="#fff" opacity=".6"/><circle cx="620" cy="110" r="40" fill="#fff" opacity=".5"/>`},
  sea:{cls:'scene-sea', deco:`<circle cx="100" cy="380" r="10" fill="#fff"/><circle cx="150" cy="330" r="6" fill="#fff"/><circle cx="600" cy="400" r="12" fill="#fff"/><circle cx="680" cy="340" r="7" fill="#fff"/><circle cx="400" cy="420" r="9" fill="#fff"/>`},
  land:{cls:'scene-land', deco:`<circle cx="680" cy="70" r="50" fill="#FFF3C4"/>`},
  bug:{cls:'scene-bug', deco:`<circle cx="90" cy="70" r="40" fill="#fff" opacity=".7"/><circle cx="650" cy="90" r="30" fill="#fff" opacity=".6"/>`}
};

function openWalk(item){
  walkOverlay.classList.add('show');
  walkScene.className = 'walk-scene ' + SCENES[item.cat].cls;
  walkDeco.innerHTML = SCENES[item.cat].deco;
  walkActorImg.src = item.dataUrl;
  startWalk();
}
document.getElementById('closeWalkBtn').addEventListener('click', closeWalk);
function closeWalk(){
  walkOverlay.classList.remove('show');
  if(walkRAF) cancelAnimationFrame(walkRAF);
  if(document.fullscreenElement) document.exitFullscreen();
}
document.getElementById('fullscreenBtn').addEventListener('click', ()=>{
  if(!document.fullscreenElement) walkOverlay.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

function startWalk(){
  walkStart = performance.now();
  if(walkRAF) cancelAnimationFrame(walkRAF);
  tick();
}
function tick(){
  const now = performance.now();
  const elapsed = now - walkStart;
  const remain = Math.max(0, WALK_DURATION - elapsed);
  const mm = Math.floor(remain/60000);
  const ss = Math.floor((remain%60000)/1000);
  walkTimer.textContent = `${mm}:${ss.toString().padStart(2,'0')}`;

  const sceneW = walkScene.clientWidth || 400;
  const sceneH = walkScene.clientHeight || 400;
  const actorW = 110;
  const margin = 10;
  const usable = Math.max(50, sceneW - actorW - margin*2);
  const period = 6000; // 6초에 한 번 왕복 반쪽
  const t = (elapsed % (period*2)) / period; // 0~2
  let progress, dir;
  if(t < 1){ progress = t; dir = 1; } else { progress = 2 - t; dir = -1; }
  const x = margin + usable * progress;
  const bob = Math.abs(Math.sin(elapsed/260)) * 12;
  const baseY = sceneH - actorW - 20;
  walkActor.style.left = x + 'px';
  walkActor.style.top = (baseY - bob) + 'px';
  walkActor.style.transform = `scaleX(${dir})`;

  if(elapsed < WALK_DURATION){
    walkRAF = requestAnimationFrame(tick);
  } else {
    walkTimer.textContent = '0:00';
  }
}

/* ---------- init ---------- */
renderSpeciesRow();
showTmpl();
resizeCanvas();
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas, 100);
setTimeout(resizeCanvas, 400);
</script>
