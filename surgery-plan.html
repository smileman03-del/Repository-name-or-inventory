<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>본정형외과 수술계획표</title>
<style>
:root {
  --primary: #1E40AF;
  --primary-light: #3B82F6;
  --primary-dark: #1e3a8a;
  --bg: #F3F4F6;
  --card: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.10);
  --radius: 12px;
  --border: #E5E7EB;
  --text: #1F2937;
  --text-muted: #6B7280;
  --danger: #EF4444;
  --warning: #F59E0B;
  --success: #10B981;
  --orange: #F97316;
  --yellow-bg: #FEFCE8;
  --orange-bg: #FFF7ED;
  --red-bg: #FEF2F2;
  --gray-bg: #F9FAFB;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
button { cursor: pointer; font-family: inherit; font-size: 13px; border: none; border-radius: 8px; transition: all 0.15s; }
input, select, textarea { font-family: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; outline: none; width: 100%; transition: border 0.15s; background: #fff; }
input:focus, select:focus, textarea:focus { border-color: var(--primary-light); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

/* ─── TOP BAR ─── */
#topbar {
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 54px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
#topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
#topbar h1 span { opacity: 0.7; font-size: 13px; font-weight: 400; margin-left: 8px; }
#syncLabel {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  cursor: pointer;
  user-select: none;
}
#syncLabel:hover { background: rgba(255,255,255,0.25); }

/* ─── MAIN ─── */
#main { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

/* ─── CALENDAR VIEW ─── */
#calView { display: block; }
#dayView  { display: none; }

.view-header {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.view-header .left { display: flex; align-items: center; gap: 8px; flex: 1; }
.view-header .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.nav-btn {
  width: 32px; height: 32px;
  background: var(--bg);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text);
}
.nav-btn:hover { background: var(--border); }

#calMonth { font-size: 18px; font-weight: 700; }
#todayBtn { padding: 5px 14px; background: var(--bg); color: var(--text); border-radius: 8px; font-weight: 600; }
#todayBtn:hover { background: var(--border); }

.month-stats { font-size: 13px; color: var(--text-muted); }
.month-stats b { color: var(--primary); }

.btn-blue { background: var(--primary); color: #fff; padding: 7px 16px; border-radius: 8px; font-weight: 600; }
.btn-blue:hover { background: var(--primary-dark); }
.btn-outline { background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 8px; font-weight: 500; border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: #FEF2F2; color: var(--danger); border: 1px solid #FECACA; }
.btn-danger:hover { background: #FECACA; }

/* ─── CALENDAR GRID ─── */
.cal-wrap {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.cal-head {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--primary);
  color: #fff;
}
.cal-head div { text-align: center; padding: 10px 4px; font-size: 12px; font-weight: 600; }
.cal-head div:first-child { color: #FCA5A5; }
.cal-head div:last-child { color: #93C5FD; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-top: 1px solid var(--border);
}
.cal-cell {
  min-height: 100px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px;
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
}
.cal-cell:hover { background: #EFF6FF; }
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell.other-month .cal-date { color: #D1D5DB; }
.cal-cell.today .cal-date {
  background: var(--primary);
  color: #fff;
  border-radius: 50%;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
}
.cal-cell.sunday .cal-date { color: #EF4444; }
.cal-cell.saturday .cal-date { color: #3B82F6; }
.cal-date { font-size: 13px; font-weight: 600; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }

.cal-badges { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-badge {
  font-size: 11px; padding: 2px 6px; border-radius: 10px;
  font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.cal-badge.all   { background: #DBEAFE; color: var(--primary); }
.cal-badge.emerg { background: #FEE2E2; color: var(--danger); }
.cal-badge.cancel{ background: #F3F4F6; color: #9CA3AF; text-decoration: line-through; }

/* ─── DAY VIEW ─── */
.day-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--card);
  padding: 14px 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.day-header .left { display: flex; align-items: center; gap: 8px; flex: 1; }
.day-header .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-title { font-size: 17px; font-weight: 700; }
.day-sub { font-size: 13px; color: var(--text-muted); }

/* ─── TABLE ─── */
.table-wrap {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow-x: auto;
  margin-bottom: 14px;
}
table { width: 100%; border-collapse: collapse; min-width: 1200px; }
thead tr { background: #F8FAFF; border-bottom: 2px solid var(--border); }
th { padding: 10px 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; text-align: center; white-space: nowrap; }
td { padding: 8px 8px; font-size: 12px; text-align: center; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #F0F7FF; }

/* Row colors */
tr.row-emerg  td { background: #FEF2F2 !important; }
tr.row-orange td { background: #FFF7ED !important; }
tr.row-yellow td { background: #FEFCE8 !important; }
tr.row-cancel td { background: #F9FAFB !important; opacity: 0.7; }
tr.row-emerg:hover  td { background: #FEE2E2 !important; }
tr.row-orange:hover td { background: #FFEDD5 !important; }
tr.row-yellow:hover td { background: #FEF9C3 !important; }
tr.row-cancel:hover td { background: #F3F4F6 !important; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge.emerg  { background: #FEE2E2; color: #DC2626; }
.badge.plan   { background: #DBEAFE; color: #1D4ED8; }
.badge.done   { background: #D1FAE5; color: #065F46; }
.badge.cancel { background: #F3F4F6; color: #9CA3AF; }
.badge.prog   { background: #FEF9C3; color: #92400E; }
.badge.infect { background: #FEE2E2; color: #DC2626; }
.badge.ok     { background: #D1FAE5; color: #065F46; }
.badge.chk    { background: #FEF9C3; color: #92400E; }

.row-num { color: var(--text-muted); font-size: 11px; }
.action-btns { display: flex; align-items: center; justify-content: center; gap: 4px; }
.action-btns button { padding: 3px 8px; font-size: 11px; }

/* ─── LEGEND ─── */
.legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  background: var(--card);
  padding: 10px 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--text-muted);
}
.legend .label { font-weight: 600; color: var(--text); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }

/* ─── EMPTY STATE ─── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; margin-bottom: 8px; }
.empty-state small { font-size: 13px; }

/* ─── MODAL ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1000;
  align-items: flex-start;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 780px;
  margin: auto;
  animation: modalIn 0.2s ease;
}
@keyframes modalIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 17px; font-weight: 700; }
.modal-close { background: none; font-size: 20px; color: var(--text-muted); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
.modal-close:hover { background: var(--bg); }
.modal-body { padding: 20px 24px; max-height: calc(90vh - 130px); overflow-y: auto; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid .half { grid-column: span 2; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
.form-group label .req { color: var(--danger); }
.form-section { font-size: 11px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; padding: 8px 0 4px; border-bottom: 1px solid #EFF6FF; margin-bottom: 8px; grid-column: 1 / -1; }

/* ─── PRINT ─── */
@media print {
  #topbar, .view-header, .day-header, .legend, #calView { display: none !important; }
  #dayView { display: block !important; }
  body { background: #fff; }
  .table-wrap { box-shadow: none; }
  .action-btns { display: none !important; }
  table { min-width: unset; font-size: 10px; }
  th, td { padding: 5px 4px; }
}

/* ─── TOAST ─── */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #1F2937;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 9999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s;
  max-width: 320px;
}
#toast.show { transform: translateY(0); opacity: 1; }

@media (max-width: 768px) {
  .form-grid { grid-template-columns: repeat(2, 1fr); }
  .form-grid .full { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .half { grid-column: 1; }
}
</style>
</head>

<div id="main">
  <!-- ═══ CALENDAR VIEW ═══ -->
  <div id="calView">
    <div class="view-header">
      <div class="left">
        <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div id="calMonth">2026년 10월</div>
        <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
        <button id="todayBtn" onclick="goToday()">오늘</button>
        <div class="month-stats"><b id="monthCount">0</b>건 (<span id="monthCancel">0</span>건 취소 제외)</div>
      </div>
      <div class="right">
        <button class="btn-outline btn-sm" onclick="exportMonth()">📄 리포트 내보내기</button>
      </div>
    </div>
    <div class="cal-wrap">
      <div class="cal-head">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- ═══ DAY VIEW ═══ -->
  <div id="dayView">
    <div class="day-header">
      <div class="left">
        <button class="btn-outline btn-sm" onclick="showCalView()">← 월별보기</button>
        <div>
          <div class="day-title" id="dayTitle">2026년 10월 01일 (목)</div>
          <div class="day-sub" id="daySub">수술 0건</div>
        </div>
      </div>
      <div class="right">
        <button class="btn-blue btn-sm" onclick="openAddModal()">+ 수술 추가</button>
        <button class="btn-outline btn-sm" onclick="syncNow()">🔄 구글시트 동기화</button>
        <button class="btn-outline btn-sm" onclick="window.print()">🖨️ 인쇄/PDF</button>
      </div>
    </div>

    <div class="legend">
      <span class="label">색 표시:</span>
      <div class="legend-item"><div class="legend-dot" style="background:#FECACA"></div>응급</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FED7AA"></div>감염/알레르기/항응고제 복용 중</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FEF08A"></div>금식 미확인</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E5E7EB"></div>취소</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>번호</th>
            <th>시간</th>
            <th>집도의</th>
            <th>차트번호</th>
            <th>환자명</th>
            <th>성별</th>
            <th>나이</th>
            <th>마취</th>
            <th>수술명</th>
            <th>부위</th>
            <th>진단명</th>
            <th>응급/예정</th>
            <th>예상시간</th>
            <th>병실</th>
            <th>금식</th>
            <th>알레르기</th>
            <th>항응고제</th>
            <th>감염</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="dayTableBody"></tbody>
      </table>
    </div>

    <div id="dayEmpty" class="empty-state" style="display:none">
      <div class="icon">📋</div>
      <p>등록된 수술이 없습니다.</p>
      <small>+ 수술 추가 버튼으로 새 수술을 등록하세요.</small>
    </div>
  </div>
</div>

<!-- ═══ ADD/EDIT MODAL ═══ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfBg(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">수술 추가</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="surgForm" onsubmit="saveSurgery(event)">
        <div class="form-grid">
          <div class="form-section">기본 정보</div>

          <div class="form-group">
            <label>수술일자 <span class="req">*</span></label>
            <input type="date" id="f_date" required>
          </div>
          <div class="form-group">
            <label>수술시간 <span class="req">*</span></label>
            <input type="time" id="f_time" required>
          </div>
          <div class="form-group">
            <label>집도의 <span class="req">*</span></label>
            <select id="f_doctor" required></select>
          </div>

          <div class="form-section">환자 정보</div>

          <div class="form-group">
            <label>차트번호 <span class="req">*</span></label>
            <input type="text" id="f_chartNo" placeholder="예: 2024-00001" required>
          </div>
          <div class="form-group">
            <label>환자명 <span class="req">*</span></label>
            <input type="text" id="f_name" placeholder="이름 입력" required>
          </div>
          <div class="form-group">
            <label>나이</label>
            <input type="number" id="f_age" placeholder="세" min="0" max="150">
          </div>
          <div class="form-group">
            <label>성별</label>
            <select id="f_gender">
              <option value="">선택</option>
              <option value="남">남</option>
              <option value="여">여</option>
            </select>
          </div>
          <div class="form-group">
            <label>입원병실</label>
            <input type="text" id="f_room" placeholder="예: 302호">
          </div>

          <div class="form-section">수술 정보</div>

          <div class="form-group half">
            <label>수술명 <span class="req">*</span></label>
            <select id="f_surgeryName" required></select>
          </div>
          <div class="form-group">
            <label>응급/예정</label>
            <select id="f_urgency">
              <option value="예정">예정</option>
              <option value="응급">응급</option>
            </select>
          </div>
          <div class="form-group half">
            <label>진단명</label>
            <select id="f_diagnosis"></select>
          </div>
          <div class="form-group">
            <label>수술부위</label>
            <select id="f_side">
              <option value="">선택</option>
              <option value="좌">좌</option>
              <option value="우">우</option>
              <option value="양측">양측</option>
              <option value="해당없음">해당없음</option>
            </select>
          </div>
          <div class="form-group">
            <label>마취종류</label>
            <select id="f_anesthesia">
              <option value="">선택</option>
              <option value="전신마취">전신마취</option>
              <option value="척추마취">척추마취</option>
              <option value="국소마취">국소마취</option>
              <option value="신경차단마취">신경차단마취</option>
              <option value="수면마취">수면마취</option>
            </select>
          </div>
          <div class="form-group">
            <label>예상소요시간</label>
            <input type="text" id="f_duration" placeholder="예: 2시간">
          </div>
          <div class="form-group">
            <label>체위</label>
            <select id="f_position">
              <option value="">선택</option>
              <option value="앙와위">앙와위</option>
              <option value="복와위">복와위</option>
              <option value="측와위">측와위</option>
              <option value="반좌위">반좌위</option>
              <option value="쇄석위">쇄석위</option>
            </select>
          </div>

          <div class="form-section">주의사항</div>

          <div class="form-group">
            <label>금식(NPO)</label>
            <select id="f_npo">
              <option value="확인">확인</option>

              <option value="MRSA">MRSA</option>
              <option value="VRE">VRE</option>

          <div class="form-group">

            <select id="f_status">
              <option value="예정">예정</option>
              <option value="진행중">진행중</option>
              <option value="완료">완료</option>
              <option value="취소">취소</option>

          <div class="form-group full">

      <button class="btn-outline" onclick="closeModal()">취소</button>
      <button class="btn-blue" onclick="document.getElementById('surgForm').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))">저장</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// =============================================
// ★ 구글 Apps Script 배포 URL — 새로 배포 후 교체하세요 ★
// =============================================
const SHEET_URL = '★새로운_APPS_SCRIPT_URL_입력★';

// =============================================
// STATE
// =============================================
const state = {
  surgeries: [],
  doctors: ['김진일'],
  curYear: new Date().getFullYear(),
  curMonth: new Date().getMonth(),
  curDate: null,   // YYYY-MM-DD
  editId: null,
  syncStatus: 'init',
};

const SURGERY_NAMES = [
  '무릎인공관절전치환술','고관절인공관절전치환술','척추유합술','추간판절제술',
  '회전근개봉합술','상완골골절내고정술','요골골절내고정술','경골골절내고정술',
  '비골골절내고정술','대퇴골골절내고정술','족관절골절내고정술','족지골교정술',
  '수근관증후군수술','방아쇠수지수술','슬관절경검사','고관절경검사','건봉합술',
  '사지절단술','족관절경검사','연부조직종양절제술','골종양절제술',
  '관절경적반월상연골절제술','관절경적반월상연골봉합술','기타'
];

const DIAGNOSES = [
  '퇴행성 무릎관절염','퇴행성 고관절염','요추 추간판 탈출증','경추 추간판 탈출증',
  '척추관 협착증','회전근개 파열','견관절 충돌증후군','상완골 골절','요골 원위부 골절',
  '경골 골절','비골 골절','대퇴골 골절','족관절 골절','족지 변형','수근관 증후군',
  '방아쇠 수지','반월상 연골 파열','십자인대 파열','연부조직 종양','골종양','기타'
];

// =============================================
// STORAGE
// =============================================
const LS_KEY = 'surgeryPlanData_v2';

function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors }));
  } catch(e) {}
}

function loadLocal() {
  try {
    const d = localStorage.getItem(LS_KEY);
    if (!d) return false;
    const parsed = JSON.parse(d);
    if (parsed.surgeries) state.surgeries = parsed.surgeries;
    if (parsed.doctors && parsed.doctors.length) state.doctors = parsed.doctors;
    return true;
  } catch(e) { return false; }
}

// =============================================
// SYNC
// =============================================
function setSyncLabel(status) {
  state.syncStatus = status;
  const el = document.getElementById('syncLabel');
  if (!el) return;
  if (status === 'syncing') {
    el.textContent = '⏳ 동기화 중...';
    el.style.color = '#FDE68A';
  } else if (status === 'error') {
    el.textContent = '⚠ 동기화 실패 (로컬 저장됨)';
    el.style.color = '#FCA5A5';
  } else if (status === 'nourl') {
    el.textContent = '🔗 URL 미설정 (로컬 저장됨)';
    el.style.color = '#FDE68A';
  } else {
    el.textContent = '✓ 구글시트 동기화됨';
    el.style.color = '#6EE7B7';
  }
}

function isUrlSet() {
  return SHEET_URL && !SHEET_URL.includes('★');
}

function pullFromSheet() {
  if (!isUrlSet()) { setSyncLabel('nourl'); return Promise.resolve(); }
  setSyncLabel('syncing');
  return fetch(SHEET_URL + '?action=get', { mode: 'cors' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(res => {
      if (!res.success) throw new Error(res.error || '알 수 없는 오류');
      if (res.surgeries && res.surgeries.length > 0) state.surgeries = res.surgeries;
      if (res.doctors && res.doctors.length > 0) state.doctors = res.doctors;
      saveLocal();
      renderAll();
      setSyncLabel('synced');
    })
    .catch(err => {
      console.error('pullFromSheet 오류:', err);
      setSyncLabel('error');
    });
}

function pushToSheet() {
  if (!isUrlSet()) { setSyncLabel('nourl'); return; }
  setSyncLabel('syncing');
  const payload = JSON.stringify({
    action: 'set',
    key: 'surgeryPlanData',
    value: JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors })
  });
  fetch(SHEET_URL, { method: 'POST', body: payload })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(res => {
      if (!res.success) throw new Error(res.error || '알 수 없는 오류');
      setSyncLabel('synced');
      console.log('동기화 완료:', res.count, '건');
    })
    .catch(err => {
      console.error('pushToSheet 오류:', err);
      setSyncLabel('error');
    });
}

function persist() {
  saveLocal();
  pushToSheet();
}

function syncNow() {
  pullFromSheet();
}

// =============================================
// RENDER ALL
// =============================================
function renderAll() {
  renderCalendar();
  if (state.curDate) renderDayTable(state.curDate);
}

// =============================================
// CALENDAR
// =============================================
function changeMonth(delta) {
  state.curMonth += delta;
  if (state.curMonth > 11) { state.curMonth = 0; state.curYear++; }
  if (state.curMonth < 0)  { state.curMonth = 11; state.curYear--; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  state.curYear = now.getFullYear();
  state.curMonth = now.getMonth();
  renderCalendar();
}

function renderCalendar() {
  const y = state.curYear, m = state.curMonth;
  document.getElementById('calMonth').textContent = `${y}년 ${m + 1}월`;

  const todayStr = toDateStr(new Date());
  const first = new Date(y, m, 1);
  const last  = new Date(y, m + 1, 0);
  const startDay = first.getDay();

  // Build map date → surgeries
  const map = {};
  state.surgeries.forEach(s => {
    if (!map[s.date]) map[s.date] = [];
    map[s.date].push(s);
  });

  // Month stats
  const monthSurgs = state.surgeries.filter(s => {
    if (!s.date) return false;
    const [sy, sm] = s.date.split('-').map(Number);
    return sy === y && (sm - 1) === m;
  });
  const notCanceled = monthSurgs.filter(s => s.status !== '취소');
  const canceledCnt = monthSurgs.length - notCanceled.length;
  document.getElementById('monthCount').textContent = notCanceled.length;
  document.getElementById('monthCancel').textContent = canceledCnt;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Prev month padding
  for (let i = 0; i < startDay; i++) {
    const d = new Date(y, m, -(startDay - 1 - i));
    const cell = makeCellEl(d, true, todayStr, map);
    grid.appendChild(cell);
  }
  // Current month
  for (let d = 1; d <= last.getDate(); d++) {
    const dt = new Date(y, m, d);
    const cell = makeCellEl(dt, false, todayStr, map);
    grid.appendChild(cell);
  }
  // Next month padding
  const totalCells = startDay + last.getDate();
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    const dt = new Date(y, m + 1, i);
    const cell = makeCellEl(dt, true, todayStr, map);
    grid.appendChild(cell);
  }
}

function makeCellEl(dt, otherMonth, todayStr, map) {
  const dStr = toDateStr(dt);
  const dow = dt.getDay();
  const cell = document.createElement('div');
  cell.className = 'cal-cell' +
    (otherMonth ? ' other-month' : '') +
    (dStr === todayStr ? ' today' : '') +
    (dow === 0 ? ' sunday' : '') +
    (dow === 6 ? ' saturday' : '');

  const dateEl = document.createElement('div');
  dateEl.className = 'cal-date';
  dateEl.textContent = dt.getDate();
  cell.appendChild(dateEl);

  if (!otherMonth) {
    const surgs = map[dStr] || [];
    if (surgs.length > 0) {
      const badges = document.createElement('div');
      badges.className = 'cal-badges';
      const canceled = surgs.filter(s => s.status === '취소').length;
      const active = surgs.length - canceled;
      const emerg = surgs.filter(s => s.urgency === '응급' && s.status !== '취소').length;

      if (active > 0) {
        const b = document.createElement('div');
        b.className = 'cal-badge all';
        b.textContent = `전체 ${active}건`;
        badges.appendChild(b);
      }
      if (emerg > 0) {
        const b = document.createElement('div');
        b.className = 'cal-badge emerg';
        b.textContent = `응급 ${emerg}건`;
        badges.appendChild(b);
      }
      if (canceled > 0) {
        const b = document.createElement('div');
        b.className = 'cal-badge cancel';
        b.textContent = `취소 ${canceled}건`;
        badges.appendChild(b);
      }
      cell.appendChild(badges);
    }
    cell.addEventListener('click', () => openDayView(dStr));
  }
  return cell;
}

// =============================================
// DAY VIEW
// =============================================
function showCalView() {
  document.getElementById('calView').style.display = 'block';
  document.getElementById('dayView').style.display = 'none';
}

function openDayView(dateStr) {
  state.curDate = dateStr;
  document.getElementById('calView').style.display = 'none';
  document.getElementById('dayView').style.display = 'block';
  renderDayTable(dateStr);
}

function renderDayTable(dateStr) {
  if (!dateStr) return;
  const dt = new Date(dateStr + 'T00:00:00');
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  document.getElementById('dayTitle').textContent =
    `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})`;

  const surgs = state.surgeries
    .filter(s => s.date === dateStr)
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  document.getElementById('daySub').textContent = `수술 ${surgs.filter(s => s.status !== '취소').length}건` +
    (surgs.filter(s => s.status === '취소').length ? ` (취소 ${surgs.filter(s => s.status === '취소').length}건 포함)` : '');

  const tbody = document.getElementById('dayTableBody');
  tbody.innerHTML = '';

  if (surgs.length === 0) {
    document.getElementById('dayEmpty').style.display = '';
    return;
  }
  document.getElementById('dayEmpty').style.display = 'none';

  surgs.forEach((s, idx) => {
    const tr = document.createElement('tr');

    // Row color
    if (s.status === '취소') tr.className = 'row-cancel';
    else if (s.urgency === '응급') tr.className = 'row-emerg';
    else if (s.infection !== '없음' || s.allergy || s.anticoag === '복용 중') tr.className = 'row-orange';
    else if (s.npo === '미확인') tr.className = 'row-yellow';

    const statusBadge = {
      '예정':'plan','완료':'done','취소':'cancel','진행중':'prog'
    }[s.status] || 'plan';

    const infectBadge = s.infection && s.infection !== '없음'
      ? `<span class="badge infect">${esc(s.infection)}</span>` : '<span style="color:#D1D5DB">-</span>';

    const allergyCell = s.allergy
      ? `<span class="badge infect">${esc(s.allergy)}</span>` : '<span style="color:#D1D5DB">-</span>';

    const anticoagCell = s.anticoag === '복용 중'
      ? `<span class="badge chk">복용 중</span>` : `<span style="color:#D1D5DB">${esc(s.anticoag||'-')}</span>`;

    const npoBadge = s.npo === '미확인'
      ? `<span class="badge chk">미확인</span>` : `<span class="badge ok">확인</span>`;

    tr.innerHTML = `
      <td class="row-num">${idx + 1}</td>
      <td><b>${esc(s.time||'-')}</b></td>
      <td>${esc(s.doctor||'-')}</td>
      <td style="font-family:monospace">${esc(s.chartNo||'-')}</td>
      <td><b>${esc(s.name||'-')}</b></td>
      <td>${esc(s.gender||'-')}</td>
      <td>${esc(s.age||'-')}</td>
      <td>${esc(s.anesthesia||'-')}</td>
      <td style="max-width:140px;white-space:normal;text-align:left">${esc(s.surgeryName||'-')}</td>
      <td>${esc(s.side||'-')}</td>
      <td style="max-width:120px;white-space:normal;text-align:left;color:var(--text-muted)">${esc(s.diagnosis||'-')}</td>
      <td>${s.urgency === '응급'
        ? '<span class="badge emerg">응급</span>'
        : '<span class="badge plan">예정</span>'}</td>
      <td>${esc(s.duration||'-')}</td>
      <td>${esc(s.room||'-')}</td>
      <td>${npoBadge}</td>
      <td>${allergyCell}</td>
      <td>${anticoagCell}</td>
      <td>${infectBadge}</td>
      <td>
        <div class="action-btns">
          <span class="badge ${statusBadge}">${esc(s.status||'예정')}</span>
          <button class="btn-outline btn-sm" onclick="openEditModal('${s.id}')">수정</button>
          <button class="btn-danger btn-sm" onclick="deleteSurgery('${s.id}')">삭제</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// =============================================
// MODAL
// =============================================
function populateDoctorSelect() {
  const sel = document.getElementById('f_doctor');
  sel.innerHTML = '';
  state.doctors.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
}

function populateSurgerySelect() {
  const sel = document.getElementById('f_surgeryName');
  sel.innerHTML = '<option value="">수술명 선택</option>';
  SURGERY_NAMES.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });

  const dSel = document.getElementById('f_diagnosis');
  dSel.innerHTML = '<option value="">진단명 선택</option>';
  DIAGNOSES.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    dSel.appendChild(opt);
  });
}

function openAddModal() {
  state.editId = null;
  document.getElementById('modalTitle').textContent = '수술 추가';
  populateDoctorSelect();
  populateSurgerySelect();
  document.getElementById('surgForm').reset();
  if (state.curDate) document.getElementById('f_date').value = state.curDate;
  document.getElementById('f_npo').value = '확인';
  document.getElementById('f_anticoag').value = '없음';
  document.getElementById('f_infection').value = '없음';
  document.getElementById('f_cArm').value = '불필요';
  document.getElementById('f_status').value = '예정';
  document.getElementById('f_urgency').value = '예정';
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal(id) {
  const s = state.surgeries.find(x => x.id === id);
  if (!s) return;
  state.editId = id;
  document.getElementById('modalTitle').textContent = '수술 수정';
  populateDoctorSelect();
  populateSurgerySelect();

  const fields = ['date','time','doctor','chartNo','name','gender','age','anesthesia',
    'surgeryName','side','diagnosis','urgency','duration','room','npo','allergy',
    'anticoag','infection','implant','cArm','position','status','note'];
  fields.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (el) el.value = s[f] || '';
  });
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function closeModalIfBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveSurgery(e) {
  e.preventDefault();
  const fields = ['date','time','doctor','chartNo','name','gender','age','anesthesia',
    'surgeryName','side','diagnosis','urgency','duration','room','npo','allergy',
    'anticoag','infection','implant','cArm','position','status','note'];

  const obj = {};
  fields.forEach(f => {
    const el = document.getElementById('f_' + f);
    obj[f] = el ? el.value.trim() : '';
  });

  if (state.editId) {
    const idx = state.surgeries.findIndex(x => x.id === state.editId);
    if (idx !== -1) {
      state.surgeries[idx] = { ...state.surgeries[idx], ...obj };
      toast('수술 정보가 수정되었습니다.');
    }
  } else {
    obj.id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    state.surgeries.push(obj);
    toast('수술이 추가되었습니다.');
  }

  closeModal();
  persist();
  renderAll();
}

// =============================================
// DELETE
// =============================================
function deleteSurgery(id) {
  const s = state.surgeries.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`[${s.name}] 수술을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
  state.surgeries = state.surgeries.filter(x => x.id !== id);
  persist();
  renderAll();
  toast('수술이 삭제되었습니다.');
}

// =============================================
// EXPORT / REPORT
// =============================================
function exportMonth() {
  const y = state.curYear, m = state.curMonth;
  const monthSurgs = state.surgeries
    .filter(s => {
      if (!s.date) return false;
      const [sy, sm] = s.date.split('-').map(Number);
      return sy === y && (sm - 1) === m;
    })
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  if (monthSurgs.length === 0) { alert('이 달에 수술 데이터가 없습니다.'); return; }

  const header = ['수술일자','수술시간','집도의','차트번호','환자명','성별','나이',
    '마취종류','수술명','수술부위','진단명','응급/예정','예상소요시간','입원병실',
    '금식','알레르기','항응고제','감염여부','임플란트/재료','C-arm','체위','진행상태','비고'];
  const keys = ['date','time','doctor','chartNo','name','gender','age','anesthesia',
    'surgeryName','side','diagnosis','urgency','duration','room','npo','allergy',
    'anticoag','infection','implant','cArm','position','status','note'];

  const csv = [header.join(','), ...monthSurgs.map(s =>
    keys.map(k => '"' + (s[k] || '').replace(/"/g, '""') + '"').join(',')
  )].join('\n');

  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `수술계획표_${y}년${m+1}월.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`${y}년 ${m+1}월 수술 리포트(${monthSurgs.length}건)를 내보냈습니다.`);
}

// =============================================
// UTILS
// =============================================
function toDateStr(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// =============================================
// INIT
// =============================================
function init() {
  // Load localStorage
  const hasLocal = loadLocal();

  // Render calendar immediately
  renderCalendar();

  // Try sync with Google Sheets
  if (isUrlSet()) {
    pullFromSheet();
  } else {
    setSyncLabel('nourl');
    if (!hasLocal) {
      toast('SHEET_URL을 설정하면 구글시트와 동기화됩니다.');
    }
  }

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'n' && e.ctrlKey) { e.preventDefault(); openAddModal(); }
  });
}

init();
</script>
