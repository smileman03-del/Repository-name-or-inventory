<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천안본정형외과 수술계획표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#F3F5F8;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Segoe UI',sans-serif;color:#1F2430;}
  a{color:#3B6FA8;}
  a:hover{color:#2C577F;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  @page{size:A4 landscape;margin:12mm;}h
  @media print{
    [data-noprint="true"]{display:none !important;}
    body[data-print-mode="month-report"] .app-shell{display:none !important;}
    body[data-print-mode="day-plan"] .month-report-modal{display:none !important;}
    .month-report-modal, .day-plan-print-wrap{position:static !important;box-shadow:none !important;background:#fff !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const GENDER = ['남','여'];
const ANESTHESIA = ['전신마취','척추마취','경막외마취','신경차단','국소마취','수면마취'];
const URGENCY = ['예정','응급'];
const DURATION = ['30분','1시간','1시간 30분','2시간','2시간 30분','3시간','3시간 이상'];
const NPO = ['확인','미확인'];
const ALLERGY = ['없음','있음'];
const ANTICOAG = ['복용 안 함','복용 중','중단 완료'];
const INFECTION = ['없음','MRSA','VRE','B형간염','C형간염','기타'];
const CARM = ['필요','불필요'];
const POSITION = ['앙와위','측와위','복와위','비치체어','견인대 사용','해당없음'];
const STATUS = ['예정','진행 중','완료','취소'];
const SIDE = ['좌','우','양측','해당없음'];
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];
const SURGERY_SUGGESTIONS_DEFAULT = ['ACL · 전방십자인대재건술','ATFL · 발목인대재건술','BPHA · 고관절반치환술','CTR · 수근관감압술','HTO · 근위경골절골술','Meniscectomy · 반월상연골절제술','Meniscus Repair · 반월상연골봉합술','Meniscus Root Repair · 후근봉합술','PEN · 경막외신경성형술','PFNA · 대퇴부근위부골절수술','RCT · 회전근개봉합술','TKRA · 무릎 인공관절수술','Trigger Finger · 방아쇠수지수술','ORIF · 발목골절수술','ORIF · 손목골절수술','ORIF · 어깨골절수술','MUA · 오십견 마취하 도수조작술','VP · 척추체성형술','SUTURE 창상봉합술','E & B 절제생검','INGROWING NAIL 내향성 발톱','CORN REMOVAL 티눈제거','CRIF Foot','CRIF Hand'];
const DIAGNOSIS_SUGGESTIONS = ['ACL tear','Chronic ankle instability','Femoral neck fracture','Carpal tunnel syndrome','Medial knee osteoarthritis (varus)','Meniscus tear','Meniscus root tear','Lumbar disc herniation','Lumbar spinal stenosis','Intertrochanteric fracture','Rotator cuff tear','Knee osteoarthritis','Trigger finger','Ankle fracture','Distal radius fracture','Proximal humerus fracture','Adhesive capsulitis (frozen shoulder)','Vertebral compression fracture','Laceration','Soft tissue mass','Ingrown toenail','Corn (clavus)','Foot fracture','Hand fracture'];
const TABLE_HEADERS = ['시간','집도의','차트번호','환자명','성별/나이','마취종류','수술명','부위','진단명','응급/예정','예상시간','병실','금식','알레르기','항응고제','감염','임플란트/재료','C-arm','체위','상태','비고'];

const STORE_KEY = 'cheonan-ortho-surgery-plan-v1';
const LAST_BACKUP_KEY = 'cheonan-ortho-last-backup-v1';
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzg6dXukkzlP3Mr38p4OZZqS0UFeGUGYPzJFHnHli01ct9-_chDgADVxen02rlDpp7LbQ/exec';
const STORAGE_LIMIT_CHARS = 50000;
const AUTO_BACKUP_THRESHOLD = 0.7;
const AUTO_BACKUP_MIN_INTERVAL_MS = 6 * 60 * 60 * 1000;

function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function uid(){ return 'sx-'+Date.now()+'-'+Math.random().toString(16).slice(2,8); }
function timeToMinutes(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatBackupTime(iso){
  try { const d = new Date(iso); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  catch(e){ return iso; }
}
function defaultFormData(dateStr, doctors){
  return {
    date: dateStr, time: '09:00', doctor: doctors[0] || '', chartNo: '', name: '',
    gender: GENDER[0], age: '', anesthesia: ANESTHESIA[0], surgeryName: '', side: SIDE[3],
    diagnosis: '', urgency: URGENCY[0], duration: DURATION[0], room: '', npo: NPO[0],
    allergy: ALLERGY[0], anticoag: ANTICOAG[0], infection: INFECTION[0], implant: '',
    cArm: CARM[1], position: POSITION[0], status: STATUS[0], note: ''
  };
}

const state = {
  view: 'month',
  monthYear: new Date().getFullYear(),
  monthMonth: new Date().getMonth(),
  selectedDate: toISO(new Date()),
  surgeries: [],
  doctors: ['김진일'],
  surgeryList: SURGERY_SUGGESTIONS_DEFAULT.slice(),
  formOpen: false,
  editingId: null,
  formData: null,
  monthReportOpen: false,
  syncStatus: 'idle',
  backupsOpen: false,
  backups: [],
  backupsLoading: false,
  backupStatus: 'idle',
  lastBackupAt: null,
  surgeryListOpen: false,
  newSurgeryName: ''
};

function dataSize(){ return JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors, surgeryList: state.surgeryList }).length; }

function persist(){
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors, surgeryList: state.surgeryList })); } catch(e){}
  pushToSheet();
  maybeAutoBackup();
}

function pushToSheet(){
  if (!SHEET_URL) return;
  state.syncStatus = 'syncing'; renderChrome();
  fetch(SHEET_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'set', key: 'surgeryPlanData', value: JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors, surgeryList: state.surgeryList }) })
  }).then(() => { state.syncStatus = 'synced'; renderChrome(); })
    .catch(() => { state.syncStatus = 'error'; renderChrome(); });
}

function pullFromSheet(){
  if (!SHEET_URL) return;
  state.syncStatus = 'syncing'; renderChrome();
  fetch(SHEET_URL + '?action=get&key=surgeryPlanData')
    .then(r => r.json())
    .then(res => {
      if (res && res.value) {
        const data = JSON.parse(res.value);
        state.surgeries = data.surgeries || [];
        state.doctors = (data.doctors && data.doctors.length) ? data.doctors : ['김진일'];
        state.surgeryList = (data.surgeryList && data.surgeryList.length) ? data.surgeryList : SURGERY_SUGGESTIONS_DEFAULT.slice();
      }
      state.syncStatus = 'synced';
      render();
    })
    .catch(() => { state.syncStatus = 'error'; renderChrome(); });
}

function maybeAutoBackup(){
  const usage = dataSize() / STORAGE_LIMIT_CHARS;
  if (usage < AUTO_BACKUP_THRESHOLD) return;
  const last = state.lastBackupAt ? new Date(state.lastBackupAt).getTime() : 0;
  if (Date.now() - last < AUTO_BACKUP_MIN_INTERVAL_MS) return;
  doBackup();
}

function doBackup(){
  if (!SHEET_URL) return;
  state.backupStatus = 'backing-up'; renderChrome();
  fetch(SHEET_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'backup', value: JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors, surgeryList: state.surgeryList }) })
  }).then(r => r.json())
    .then(() => {
      const now = new Date().toISOString();
      try { window.localStorage.setItem(LAST_BACKUP_KEY, now); } catch(e){}
      state.backupStatus = 'done'; state.lastBackupAt = now;
      renderChrome();
      if (state.backupsOpen) loadBackups();
    })
    .catch(() => { state.backupStatus = 'error'; renderChrome(); });
}

function loadBackups(){
  if (!SHEET_URL) return;
  state.backupsLoading = true; renderModals();
  fetch(SHEET_URL + '?action=listBackups')
    .then(r => r.json())
    .then(res => { state.backups = (res && res.backups) || []; state.backupsLoading = false; renderModals(); })
    .catch(() => { state.backupsLoading = false; renderModals(); });
}

function restoreBackup(key){
  if (!window.confirm('이 백업으로 복원할까요? 현재 데이터는 덮어씌워집니다.')) return;
  fetch(SHEET_URL + '?action=get&key=' + encodeURIComponent('backup:' + key))
    .then(r => r.json())
    .then(res => {
      if (!res || !res.value) { window.alert('백업 데이터를 불러오지 못했습니다.'); return; }
      const data = JSON.parse(res.value);
      state.surgeries = data.surgeries || [];
      state.doctors = (data.doctors && data.doctors.length) ? data.doctors : ['김진일'];
      state.surgeryList = (data.surgeryList && data.surgeryList.length) ? data.surgeryList : SURGERY_SUGGESTIONS_DEFAULT.slice();
      try { window.localStorage.setItem(STORE_KEY, JSON.stringify({ surgeries: state.surgeries, doctors: state.doctors, surgeryList: state.surgeryList })); } catch(e){}
      state.backupsOpen = false;
      pushToSheet();
      render();
      window.alert('복원되었습니다.');
    })
    .catch(() => window.alert('복원 중 오류가 발생했습니다.'));
}

function rowStyleFor(s){
  if (s.status === '취소') return 'background:#F1F2F4;border-bottom:1px solid #E3E7ED;color:#8A8F98;';
  if (s.urgency === '응급') return 'background:#FDECEE;border-bottom:1px solid #F6C9CE;';
  if ((s.infection && s.infection !== '없음') || s.allergy === '있음' || s.anticoag === '복용 중') return 'background:#FFF3E0;border-bottom:1px solid #FBDDA8;';
  if (s.npo === '미확인') return 'background:#FFFBE0;border-bottom:1px solid #F5E39C;';
  return 'background:#FFFFFF;border-bottom:1px solid #E3E7ED;';
}

function byDateMap(){
  const m = {};
  state.surgeries.forEach(rec => { (m[rec.date] = m[rec.date] || []).push(rec); });
  return m;
}

// ---------- RENDER ----------
function render(){ renderChrome(); renderBody(); renderModals(); attachGlobalHandlers(); }

  const usageSize = dataSize();
  const usageRatio = Math.min(usageSize / STORAGE_LIMIT_CHARS, 1);
  const usagePercent = Math.round(usageRatio * 100);
  const usageColor = usageRatio >= 0.9 ? '#E0384A' : (usageRatio >= 0.7 ? '#E08A2B' : '#3B6FA8');
  const usageBg = usageRatio >= 0.9 ? '#FDECEE' : (usageRatio >= 0.7 ? '#FFF3E0' : '#E8EFF6');
  const syncLabel = state.syncStatus === 'syncing' ? '동기화 중...' : (state.syncStatus === 'error' ? '동기화 실패' : (state.syncStatus === 'synced' ? '구글시트 동기화됨' : ''));

  const headerHtml = `

function bindHeaderHandlers(){
  const q = id => document.getElementById(id);
  if (q('btnUsage')) q('btnUsage').onclick = () => { state.backupsOpen = true; renderModals(); loadBackups(); };
  if (q('btnStats')) q('btnStats').onclick = () => openStatsModal();
  if (q('btnBackToMonth')) q('btnBackToMonth').onclick = () => { state.view = 'month'; render(); };
  if (q('btnAddSurgery')) q('btnAddSurgery').onclick = () => { openAddForm(); };
  if (q('btnPrintDay')) q('btnPrintDay').onclick = () => { document.body.setAttribute('data-print-mode','day-plan'); window.print(); };
}

function openAddForm(){
  state.formOpen = true; state.editingId = null; state.formData = defaultFormData(state.selectedDate, state.doctors);
  renderModals();
}
function openEditForm(id){
  const rec = state.surgeries.find(x => x.id === id);
  if (!rec) return;
  state.formOpen = true; state.editingId = id; state.formData = Object.assign({}, rec);
  renderModals();
}
function closeForm(){ state.formOpen = false; state.editingId = null; state.formData = null; renderModals(); }

function saveForm(){
  const fd = state.formData;
  if (!fd) return;
  if (state.editingId) {
    state.surgeries = state.surgeries.map(x => x.id === state.editingId ? Object.assign({}, fd, { id: state.editingId }) : x);
  } else {
    state.surgeries.push(Object.assign({}, fd, { id: uid() }));
  }
  if (fd.doctor && state.doctors.indexOf(fd.doctor) === -1) state.doctors.push(fd.doctor);
  state.formOpen = false; state.editingId = null; state.formData = null;
  persist();
  render();
}
function deleteFromForm(){
  if (!window.confirm('이 수술 일정을 삭제할까요?')) return;
  state.surgeries = state.surgeries.filter(x => x.id !== state.editingId);
  state.formOpen = false; state.editingId = null; state.formData = null;
  persist();
  render();
}
function deleteRecord(id){
  if (!window.confirm('이 수술 일정을 삭제할까요?')) return;
  state.surgeries = state.surgeries.filter(x => x.id !== id);
  persist();
  render();
}

function openRecord(id){
  const r = state.surgeries.find(x => x.id === id);
  if (!r) return;
  // 마취방법 매핑: 수술계획표 값 → 수술기록지 select 값
  const anesMap = {
    '전신마취':'전신마취', '척추마취':'척추마취',
    '경막외마취':'부위/신경차단', '신경차단':'부위/신경차단',
    '국소마취':'국소마취', '수면마취':'전신마취'
  };
  // 수술구분 매핑: 예정→정규, 응급→응급
  const categoryMap = { '예정':'정규', '응급':'응급' };
  // 체위 매핑
  const positionMap = {
    '앙와위':'앙와위(Supine)',
    '측와위':'측와위-좌(Lateral Lt)',
    '복와위':'복와위(Prone)',
    '비치체어':'변형앙와위(Beach chair)',
    '견인대 사용':'사지견인위(Traction)'
  };
  const params = new URLSearchParams();
  if (r.chartNo)     params.set('p_no', r.chartNo);
  if (r.name)        params.set('p_name', r.name);
  if (r.gender)      params.set('p_sex', r.gender);
  if (r.doctor)      { params.set('p_doctor', r.doctor); params.set('s_surgeon', r.doctor); }
  if (r.date)        params.set('s_date', r.date);
  if (r.time)        params.set('s_start', r.time);
  if (r.surgeryName) params.set('s_name', r.surgeryName);
  if (r.diagnosis)   params.set('s_diagnosis', r.diagnosis);
  if (r.side)        params.set('s_side', r.side);
  if (r.room)        params.set('s_room', r.room);
  if (r.anesthesia)  params.set('s_anes', anesMap[r.anesthesia] || r.anesthesia);
  if (r.urgency)     params.set('s_category', categoryMap[r.urgency] || r.urgency);
  if (r.position)    params.set('n_position', positionMap[r.position] || r.position);
  window.open('surgery-record.html?' + params.toString(), '_blank');
}

function renderBody(){
  const container = document.getElementById('bodySlot');
  if (!container) return;
  if (state.view === 'month') container.innerHTML = renderMonthView();
  else container.innerHTML = renderDayView();
  attachBodyHandlers();
}

function renderMonthView(){
  const monthLabel = state.monthYear + '년 ' + (state.monthMonth+1) + '월';
  const map = byDateMap();
  const firstOfMonth = new Date(state.monthYear, state.monthMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const gridStart = new Date(state.monthYear, state.monthMonth, 1 - startOffset);
  const today = toISO(new Date());
  let monthTotalCount = 0, monthCancelledCount = 0;

  const weekDaysHtml = WEEKDAY_LABELS.map((label,i) => `<div style="text-align:center;font-size:1rem;font-weight:800;color:${i===0?'#E0384A':(i===6?'#3B6FA8':'#6B7280')};padding:8px 0;">${label}</div>`).join('');

  let cellsHtml = '';
  for (let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const dateStr = toISO(d);
    const inMonth = d.getMonth() === state.monthMonth;
    const recs = map[dateStr] || [];
    const active = recs.filter(r => r.status !== '취소');
    const cancelled = recs.filter(r => r.status === '취소');
    const hasEmergency = active.some(r => r.urgency === '응급');
    const isToday = dateStr === today;
    if (inMonth) { monthTotalCount += active.length; monthCancelledCount += cancelled.length; }
    cellsHtml += `
      <div class="dayCell" data-date="${dateStr}" style="min-height:100px;border-radius:10px;padding:10px;background:${isToday?'#E8EFF6':(inMonth?'#FFFFFF':'#F7F8FA')};border:${isToday?'1px solid #3B6FA8':'1px solid #EDEFF2'};cursor:pointer;opacity:${inMonth?1:0.5};">
        <div style="font-size:1.05rem;font-weight:${isToday?800:700};color:${isToday?'#3B6FA8':'#1F2430'};">${d.getDate()}</div>
        ${active.length>0?`<div style="margin-top:5px;background:#E8EFF6;color:#3B6FA8;border-radius:6px;padding:3px 8px;font-size:0.88rem;font-weight:800;display:inline-block;">${active.length}건</div>`:''}
        ${cancelled.length>0?`<div style="margin-top:4px;color:#8A8F98;font-size:0.82rem;font-weight:700;">취소 ${cancelled.length}</div>`:''}

      <td style="padding:12px 14px;white-space:nowrap;font-size:1rem;font-weight:800;">${esc(r.urgency)}</td>
      <td style="padding:12px 14px;white-space:nowrap;font-size:1rem;">${esc(r.duration)}</td>
      <td style="padding:12px 14px;white-space:nowrap;font-size:1rem;">${esc(r.room)}</td>

    </div>`;
}

function attachBodyHandlers(){
  const q = id => document.getElementById(id);
  if (state.view === 'month') {
    if (q('btnPrevMonth')) q('btnPrevMonth').onclick = () => { let m=state.monthMonth-1,y=state.monthYear; if(m<0){m=11;y--;} state.monthMonth=m; state.monthYear=y; renderBody(); };
    if (q('btnNextMonth')) q('btnNextMonth').onclick = () => { let m=state.monthMonth+1,y=state.monthYear; if(m>11){m=0;y++;} state.monthMonth=m; state.monthYear=y; renderBody(); };
    if (q('btnTodayMonth')) q('btnTodayMonth').onclick = () => { const d=new Date(); state.monthYear=d.getFullYear(); state.monthMonth=d.getMonth(); renderBody(); };
    document.querySelectorAll('.dayCell').forEach(el => {
      el.onclick = () => { state.selectedDate = el.getAttribute('data-date'); state.view = 'day'; render(); };
    });
  } else {
    if (q('btnPrevDay')) q('btnPrevDay').onclick = () => { const d=fromISO(state.selectedDate); d.setDate(d.getDate()-1); state.selectedDate=toISO(d); renderBody(); };
    if (q('btnNextDay')) q('btnNextDay').onclick = () => { const d=fromISO(state.selectedDate); d.setDate(d.getDate()+1); state.selectedDate=toISO(d); renderBody(); };
    if (q('btnTodayDay')) q('btnTodayDay').onclick = () => { state.selectedDate = toISO(new Date()); renderBody(); };
    document.querySelectorAll('.btnEditRow').forEach(el => { el.onclick = () => openEditForm(el.getAttribute('data-id')); });
    document.querySelectorAll('.btnDeleteRow').forEach(el => { el.onclick = () => deleteRecord(el.getAttribute('data-id')); });
    document.querySelectorAll('.btnOpenRecord').forEach(el => { el.onclick = () => openRecord(el.getAttribute('data-id')); });
  }
}

  html += `<datalist id="doctorList">${state.doctors.map(d=>`<option value="${esc(d)}"></option>`).join('')}</datalist>
  <datalist id="surgeryList">${state.surgeryList.map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>
  <datalist id="diagnosisList">${DIAGNOSIS_SUGGESTIONS.map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>`;

  container.innerHTML = html;
  attachModalHandlers();
}

function attachModalHandlers(){
  const q = id => document.getElementById(id);
  document.querySelectorAll('.formField').forEach(el => {
    el.onchange = (e) => { state.formData[el.getAttribute('data-key')] = e.target.value; };
  });
  if (q('btnOpenSurgeryList')) q('btnOpenSurgeryList').onclick = () => { state.surgeryListOpen = true; state.newSurgeryName=''; renderModals(); };
  if (q('btnSaveForm')) q('btnSaveForm').onclick = saveForm;
  if (q('btnCloseForm')) q('btnCloseForm').onclick = closeForm;
  if (q('btnDeleteFromForm')) q('btnDeleteFromForm').onclick = deleteFromForm;

  if (q('newSurgeryNameInput')) q('newSurgeryNameInput').oninput = (e) => { state.newSurgeryName = e.target.value; };
  if (q('btnAddSurgeryItem')) q('btnAddSurgeryItem').onclick = () => {
    const name = (state.newSurgeryName || '').trim();
    if (!name || state.surgeryList.indexOf(name) !== -1) { state.newSurgeryName=''; renderModals(); return; }
    state.surgeryList.push(name);
    state.newSurgeryName = '';
    persist();
    renderModals();
  };
  document.querySelectorAll('.btnRemoveSurgeryItem').forEach(el => {
    el.onclick = () => { state.surgeryList = state.surgeryList.filter(x => x !== el.getAttribute('data-name')); persist(); renderModals(); };
  });
  if (q('btnCloseSurgeryList')) q('btnCloseSurgeryList').onclick = () => { state.surgeryListOpen = false; renderModals(); };

  if (q('btnManualBackup')) q('btnManualBackup').onclick = doBackup;
  document.querySelectorAll('.btnRestoreBackup').forEach(el => { el.onclick = () => restoreBackup(el.getAttribute('data-key')); });
  if (q('btnCloseBackups')) q('btnCloseBackups').onclick = () => { state.backupsOpen = false; renderModals(); };

}

function attachGlobalHandlers(){}

document.getElementById('app').innerHTML = `
  <div class="app-shell" style="max-width:1200px;margin:0 auto;padding:20px 20px 60px;">
    <div id="headerSlot"></div>
    <div id="bodySlot"></div>
  </div>
  <div id="modalSlot"></div>`;

(function init(){
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.surgeries = data.surgeries || [];
      state.doctors = (data.doctors && data.doctors.length) ? data.doctors : ['김진일'];
      state.surgeryList = (data.surgeryList && data.surgeryList.length) ? data.surgeryList : SURGERY_SUGGESTIONS_DEFAULT.slice();
    }
  } catch(e){}
  try {
    const lastBackupAt = window.localStorage.getItem(LAST_BACKUP_KEY);
    if (lastBackupAt) state.lastBackupAt = lastBackupAt;
  } catch(e){}
  render();
  pullFromSheet();
})();

/* ============================
   📊 수술 통계 모달
   ============================ */
function openStatsModal() {
  const existing = document.getElementById('statsModalOverlay');
  if (existing) existing.remove();

  // 데이터 집계
  const all = state.surgeries || [];
  const byMonth = {}, byType = {}, byStatus = {}, byAnesthesia = {}, byDoctor = {}, byDow = {};
  const dowLabels = ['일','월','화','수','목','금','토'];

  all.forEach(s => {
    const m = (s.date || '').substring(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
    const t = (s.surgeryName || '미상').replace(/·.*/, '').trim();
    byType[t] = (byType[t] || 0) + 1;
    const st = s.status || '미상';
    byStatus[st] = (byStatus[st] || 0) + 1;
    const an = s.anesthesia || '미상';
    byAnesthesia[an] = (byAnesthesia[an] || 0) + 1;
    const dr = s.doctor || '미상';
    byDoctor[dr] = (byDoctor[dr] || 0) + 1;
    if (s.date) {
      const dw = dowLabels[new Date(s.date).getDay()];
      byDow[dw] = (byDow[dw] || 0) + 1;
    }
  });

  const total = all.length;
  const completed = byStatus['완료'] || 0;
  const scheduled = byStatus['예정'] || 0;
  const cancelled = byStatus['취소'] || 0;

  function barChart(data, color) {
    const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
    const max = Math.max(...entries.map(e => e[1]), 1);
    if (entries.length === 0) return '<p style="color:#94a3b8;font-size:13px;">데이터 없음</p>';
    return entries.map(([k, v]) => `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="width:130px;font-size:13px;color:#374151;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${k}">${k}</div>
        <div style="flex:1;background:#e2e8f0;border-radius:4px;height:26px;overflow:hidden;">
          <div style="width:${Math.round(v/max*100)}%;background:${color};height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;box-sizing:border-box;min-width:32px;transition:width 0.4s;">
            <span style="color:white;font-size:12px;font-weight:700;">${v}건</span>
          </div>
        </div>
      </div>`).join('');
  }

  function statBox(label, value, color, emoji) {
    return `<div style="background:#fff;border-radius:12px;padding:18px 12px;text-align:center;border:2px solid ${color}25;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
      <div style="font-size:26px;margin-bottom:4px;">${emoji}</div>
      <div style="font-size:28px;font-weight:800;color:${color};">${value}</div>
      <div style="font-size:12px;color:#94a3b8;margin-top:4px;font-weight:600;">${label}</div>
    </div>`;
  }

  function card(title, content) {
    return `<div style="background:#f8fafc;border-radius:12px;padding:20px;border:1px solid #e2e8f0;">
      <h3 style="margin:0 0 16px 0;font-size:14px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;">${title}</h3>
      ${content}
    </div>`;
  }

  const monthSorted = Object.entries(byMonth).sort((a, b) => a[0].localeCompare(b[0]));
  const dowOrder = ['월','화','수','목','금','토','일'];
  const dowMax = Math.max(...dowOrder.map(d => byDow[d] || 0), 1);
  const dowBars = dowOrder.map(d => {
    const v = byDow[d] || 0;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span style="font-size:11px;font-weight:700;color:#6366f1;">${v > 0 ? v+'건' : ''}</span>
      <div style="width:100%;background:${v > 0 ? '#6366f1' : '#e2e8f0'};border-radius:4px 4px 0 0;height:${Math.max(v/dowMax*64, v > 0 ? 8 : 3)}px;"></div>
      <span style="font-size:13px;color:#374151;font-weight:700;">${d}</span>
    </div>`;
  }).join('');

  const overlay = document.createElement('div');
  overlay.id = 'statsModalOverlay';
  overlay.setAttribute('data-noprint', 'true');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(31,36,48,0.48);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  overlay.innerHTML = `
    <div style="background:#fff;border-radius:18px;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;padding:32px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.25);">
      <button onclick="document.getElementById('statsModalOverlay').remove()"
        style="position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#64748b;">✕</button>
      <h2 style="margin:0 0 24px 0;font-size:22px;font-weight:800;color:#1e293b;">📊 수술 통계</h2>
      <div style="display:grid;gap:18px;">

        <!-- 요약 카드 4개 -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
          ${statBox('총 수술', total+'건', '#6366f1', '🏥')}
          ${statBox('완료', completed+'건', '#22c55e', '✅')}
          ${statBox('예정', scheduled+'건', '#f59e0b', '📅')}
          ${statBox('취소', cancelled+'건', '#ef4444', '❌')}
        </div>

        <!-- 월별 현황 -->
        ${card('📅 월별 수술 현황', barChart(Object.fromEntries(monthSorted), '#6366f1'))}

        <!-- 수술 종류 & 마취 방법 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          ${card('🔪 수술 종류별', barChart(byType, '#8b5cf6'))}
          ${card('💉 마취 방법별', barChart(byAnesthesia, '#06b6d4'))}
        </div>

        <!-- 요일별 분포 -->
        ${card('📆 요일별 수술 분포', `<div style="display:flex;align-items:flex-end;gap:8px;height:88px;">${dowBars}</div>`)}

        <!-- 담당의별 -->
        ${card('👨‍⚕️ 담당의별 수술', barChart(byDoctor, '#10b981'))}

        <div style="text-align:center;color:#94a3b8;font-size:12px;padding-top:4px;">
          * 로컬 저장 데이터 기준 | ${new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'})} 기준
        </div>

        <!-- PDF 내보내기 버튼 -->
        <div style="text-align:center;padding-top:8px;">
          <button onclick="printStatsAsPDF({total:${total},completed:${completed},scheduled:${scheduled},cancelled:${cancelled},byMonth:${JSON.stringify(Object.fromEntries(monthSorted))},byType:${JSON.stringify(byType)},byAnesthesia:${JSON.stringify(byAnesthesia)},byDow:${JSON.stringify(byDow)},byDoctor:${JSON.stringify(byDoctor)}})"
            style="background:#6366f1;color:#fff;border:none;border-radius:10px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:0.5px;box-shadow:0 4px 12px rgba(99,102,241,0.3);">
            📄 PDF로 내보내기
          </button>
        </div>

      </div>
    </div>`;

  document.body.appendChild(overlay);
}

function printStatsAsPDF(d) {
  const today = new Date();
  const dateStr = today.toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
  const defaultName = `천안본정형외과_수술통계_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;

  // 파일명 입력 다이얼로그
  const dlg = document.createElement('div');
  dlg.id = 'pdfFilenameDlg';
  dlg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:400;';
  dlg.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:30px 32px;width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <h3 style="margin:0 0 6px 0;font-size:18px;font-weight:800;color:#1e293b;">📄 PDF 저장</h3>
      <p style="margin:0 0 18px 0;font-size:13px;color:#64748b;">저장할 파일 이름을 입력하세요 <span style="color:#94a3b8;">(.pdf 자동 추가)</span></p>
      <input id="pdfFilenameInput" type="text" value="${defaultName}"
        style="width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;box-sizing:border-box;transition:border-color .15s;"
        onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'">
      <p style="margin:8px 0 0 2px;font-size:12px;color:#94a3b8;">💡 브라우저 인쇄창에서 "PDF로 저장"을 선택하면 입력한 파일명으로 저장됩니다.</p>
      <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
        <button onclick="document.getElementById('pdfFilenameDlg').remove()"
          style="padding:10px 22px;border:2px solid #e2e8f0;background:#fff;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:#64748b;">취소</button>
        <button id="pdfConfirmBtn"
          style="padding:10px 28px;background:#6366f1;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;box-shadow:0 4px 12px rgba(99,102,241,0.3);">📄 저장</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  setTimeout(() => { const inp = document.getElementById('pdfFilenameInput'); if(inp){inp.focus();inp.select();} }, 50);

  // Enter 키로 확인
  dlg.querySelector('#pdfFilenameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('pdfConfirmBtn').click();
    if (e.key === 'Escape') dlg.remove();
  });

  document.getElementById('pdfConfirmBtn').onclick = () => {
    const filename = (document.getElementById('pdfFilenameInput').value.trim() || defaultName);
    dlg.remove();
    _doPrintStatsPDF(d, filename, dateStr);
  };
}

function _doPrintStatsPDF(d, filename, dateStr) {
  const dowNames = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토',sun:'일'};

  function tableRows(obj) {
    return Object.entries(obj).map(([k,v]) =>
      `<tr><td style="padding:6px 12px;border-bottom:1px solid #e2e8f0;">${k||'미기재'}</td><td style="padding:6px 12px;border-bottom:1px solid #e2e8f0;text-align:right;font-weight:700;">${v}건</td></tr>`
    ).join('');
  }
  function section(title, content) {
    return `<div style="margin-bottom:22px;">
      <h3 style="font-size:14px;font-weight:800;color:#1e293b;margin:0 0 8px 0;padding-bottom:6px;border-bottom:2px solid #6366f1;">${title}</h3>
      ${content}
    </div>`;
  }

  // 브라우저는 페이지 타이틀을 PDF 파일명으로 사용
  const originalTitle = document.title;
  document.title = filename;

  const printDiv = document.createElement('div');
  printDiv.id = 'statsPrintArea';
  printDiv.innerHTML = `
    <div style="font-family:'Noto Sans KR',sans-serif;max-width:780px;margin:0 auto;padding:28px 32px;color:#1e293b;">
      <div style="text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:3px solid #6366f1;">
        <div style="font-size:22px;font-weight:900;color:#6366f1;margin-bottom:4px;">📊 수술 통계 보고서</div>
        <div style="font-size:12px;color:#64748b;">천안본정형외과 | ${dateStr} 기준</div>
      </div>

      ${section('📋 요약', `
        <table style="width:100%;border-collapse:collapse;">
          <tr>
            <td style="padding:8px 12px;background:#f0f0ff;border-radius:8px;text-align:center;width:25%;"><div style="font-size:11px;color:#6366f1;font-weight:700;">총 수술</div><div style="font-size:22px;font-weight:900;color:#1e293b;">${d.total}건</div></td>
            <td style="width:3%;"></td>
            <td style="padding:8px 12px;background:#f0fdf4;border-radius:8px;text-align:center;width:25%;"><div style="font-size:11px;color:#22c55e;font-weight:700;">완료</div><div style="font-size:22px;font-weight:900;color:#1e293b;">${d.completed}건</div></td>
            <td style="width:3%;"></td>
            <td style="padding:8px 12px;background:#fffbeb;border-radius:8px;text-align:center;width:25%;"><div style="font-size:11px;color:#f59e0b;font-weight:700;">예정</div><div style="font-size:22px;font-weight:900;color:#1e293b;">${d.scheduled}건</div></td>
            <td style="width:3%;"></td>
            <td style="padding:8px 12px;background:#fef2f2;border-radius:8px;text-align:center;width:25%;"><div style="font-size:11px;color:#ef4444;font-weight:700;">취소</div><div style="font-size:22px;font-weight:900;color:#1e293b;">${d.cancelled}건</div></td>
          </tr>
        </table>`)}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div>
          ${section('📅 월별 수술 현황', `<table style="width:100%;border-collapse:collapse;font-size:13px;">${tableRows(d.byMonth)}</table>`)}
          ${section('👨‍⚕️ 담당의별 수술', `<table style="width:100%;border-collapse:collapse;font-size:13px;">${tableRows(d.byDoctor)}</table>`)}
        </div>
        <div>
          ${section('🔪 수술 종류별', `<table style="width:100%;border-collapse:collapse;font-size:13px;">${tableRows(d.byType)}</table>`)}
          ${section('💉 마취 방법별', `<table style="width:100%;border-collapse:collapse;font-size:13px;">${tableRows(d.byAnesthesia)}</table>`)}
          ${section('📆 요일별 분포', `<table style="width:100%;border-collapse:collapse;font-size:13px;">${Object.entries(d.byDow).map(([k,v])=>`<tr><td style="padding:6px 12px;border-bottom:1px solid #e2e8f0;">${dowNames[k]||k}요일</td><td style="padding:6px 12px;border-bottom:1px solid #e2e8f0;text-align:right;font-weight:700;">${v}건</td></tr>`).join('')}</table>`)}
        </div>
      </div>

      <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:20px;padding-top:12px;border-top:1px solid #e2e8f0;">
        천안본정형외과 수술계획 시스템 | 로컬 저장 데이터 기준
      </div>
    </div>`;

  const styleEl = document.createElement('style');
  styleEl.id = 'statsPrintStyle';
  styleEl.textContent = `@media print { body > *:not(#statsPrintArea) { display:none !important; } #statsPrintArea { display:block !important; } }`;

  document.head.appendChild(styleEl);
  document.body.appendChild(printDiv);
  window.print();

  function cleanup() {
    document.title = originalTitle;
    const s = document.getElementById('statsPrintStyle');
    const p = document.getElementById('statsPrintArea');
    if (s) s.remove();
    if (p) p.remove();
    window.removeEventListener('afterprint', cleanup);
  }
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 3000);
}
</script>
