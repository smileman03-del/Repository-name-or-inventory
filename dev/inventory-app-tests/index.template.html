<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E4A46">
<title>소모품 재고관리</title>
<style>
/* =====================================================================
   디자인: "임상 장부" — 병원 재고 장부·검사 결과지에서 가져온 차분한 종이 질감,
   신호색은 재고부족 빨강 하나만 강하게. 숫자가 주인공(굵은 표 맞춤 숫자 + 적정재고 게이지).
   외부 폰트·이미지를 쓰지 않는다(개인정보·오프라인). 시스템 한글 폰트(Pretendard가 설치돼 있으면 우선 사용).
   ===================================================================== */
:root{
  --paper:#F2F0EA; --paper-2:#E6E3D8; --surface:#FFFFFF; --surface-2:#F7F5F0; --line:#D9D5CA; --line-2:#E8E4DA;
  --ink:#15211F; --ink-2:#46524F; --ink-3:#5A6663;
  --pine:#0E4A46; --pine-2:#0A3935; --pine-3:#14665F; --on-pine:#EAF5F2; --on-pine-2:rgba(240,248,246,.92);
  --mint:#D3E8E2; --mint-2:#E6F2EE;
  --red:#C2392B; --red-ink:#9E2A1E; --red-bg:#FBE8E4;
  --amber:#85500A; --amber-bg:#FBEFD8;
  --green:#1F6A3E; --green-bg:#E0F0E6;
  --rule:rgba(21,33,31,.035);
  --shadow-1:0 1px 0 rgba(21,33,31,.04), 0 10px 22px -14px rgba(21,33,31,.35);
  --shadow-sheet:0 -18px 48px -16px rgba(21,33,31,.45);
  --r:18px; --r-sm:12px; --nav-h:66px; --maxw:560px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0C1211; --paper-2:#18231F; --surface:#141D1B; --surface-2:#192321; --line:#283735; --line-2:#1E2C29;
    --ink:#E6EEEB; --ink-2:#A6B3AF; --ink-3:#7B8985;
    --pine:#0F5A54; --pine-2:#0B433F; --pine-3:#2A9A8E; --on-pine:#EAF5F2; --on-pine-2:rgba(240,248,246,.92);
    --mint:#1B3A36; --mint-2:#162F2C;
    --red:#FF8576; --red-ink:#FFB0A5; --red-bg:#3A1E1A;
    --amber:#F2B25E; --amber-bg:#35270F;
    --green:#74D6A0; --green-bg:#17301F;
    --rule:rgba(255,255,255,.03);
    --shadow-1:0 1px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.85);
    --shadow-sheet:0 -18px 48px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); color:var(--ink); font-size:15px; line-height:1.45;
  background:
    radial-gradient(900px 420px at 50% -140px, rgba(20,102,95,.16), transparent 70%),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px),
    var(--paper);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere; min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button,input,select,textarea{-webkit-appearance:none;appearance:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--pine-3);outline-offset:2px;border-radius:10px}

/* ---------- 상단 바 ---------- */
header.app-header{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
}
.brand,.dept-scroll{max-width:var(--maxw);margin-left:auto;margin-right:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.brand-left{display:flex;align-items:center;gap:11px;min-width:0}
.logo-badge{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--pine-3),var(--pine-2)); color:var(--on-pine);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 6px 14px -8px rgba(14,74,70,.9);
}
.logo-badge .ic{width:22px;height:22px;stroke-width:2.6}
.brand-sub{font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-date{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px}
.sync-pill{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:100px;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);flex:none}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.sync-pill.ok .sync-dot{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.sync-pill.bad{border-color:var(--red);color:var(--red-ink)} .sync-pill.bad .sync-dot{background:var(--red)}
.sync-pill.busy .sync-dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.dept-scroll,.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dept-scroll::-webkit-scrollbar,.chips::-webkit-scrollbar,.cat-filter::-webkit-scrollbar{display:none}
.dept-chip{
  position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:8px 15px;border-radius:100px;font-weight:700;font-size:14.5px;line-height:1.2;transition:background .15s,color .15s,border-color .15s,transform .1s;
}
.dept-chip:active{transform:scale(.96)}
.dept-chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dept-chip[data-low]:not([data-low="0"])::after{
  content:attr(data-low); display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; margin-left:7px;
  border-radius:9px; background:var(--red); color:#fff; font-size:11px; font-weight:800; vertical-align:1px;
}
.dept-chip.active[data-low]:not([data-low="0"])::after{background:var(--red);color:#fff}

/* ---------- 본문 ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 112px)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.section-title{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;margin:22px 4px 9px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title .muted{text-transform:none;letter-spacing:0;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-1);margin-bottom:12px}
.empty-state{text-align:center;color:var(--ink-3);padding:38px 12px;font-size:14px;line-height:1.7}
.empty-state .glyph{font-size:30px;margin-bottom:6px;filter:grayscale(.2)}

/* ---------- 히어로(오늘의 재고) ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;color:var(--on-pine);margin-bottom:14px;
  background:radial-gradient(420px 220px at 100% -10%, rgba(255,255,255,.14), transparent 60%), linear-gradient(160deg,var(--pine-3) -20%, var(--pine) 45%, var(--pine-2) 120%);
  box-shadow:0 20px 40px -22px rgba(10,57,53,.9), inset 0 0 0 1px rgba(255,255,255,.1);
}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
.hero-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:relative}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--on-pine-2)}
.hero-date{font-size:12px;color:var(--on-pine-2);font-weight:600}
.hero-body{display:flex;align-items:center;gap:18px;position:relative}
.ring-wrap{position:relative;width:118px;height:118px;flex:none}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .track{stroke:rgba(255,255,255,.16)}
.ring-wrap .arc{stroke:#fff;transition:stroke-dasharray .9s cubic-bezier(.2,.7,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .num{font-size:31px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ring-center .lbl{font-size:11px;color:var(--on-pine-2);margin-top:5px;font-weight:700}
.ring-stats{flex:1;min-width:0;display:grid;gap:9px}
.ring-stat-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px dashed rgba(255,255,255,.2)}
.ring-stat-line:last-child{border-bottom:0;padding-bottom:0}
.ring-stat-line .k{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--on-pine-2)}
.ring-stat-line .v{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.swatch{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.55)}
.sw-ok{background:#8FE3B5} .sw-low{background:#FF9A8B}
.ring-stat-line.low .v{color:#FFC2B8}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative}
.hero-cta{
  flex:1 1 200px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 14px;
  background:#fff;color:var(--pine-2);font-weight:800;font-size:15px;box-shadow:0 8px 18px -10px rgba(0,0,0,.6);transition:transform .1s;
}
.hero-cta:active{transform:scale(.98)}
.hero-cta .ic:last-child{margin-left:auto}
.hero-ok{flex:1 1 200px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--on-pine);padding:12px 4px}
.hero-chip{display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--on-pine);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}

/* ---------- 검색·필터 ---------- */
.filters{display:flex;gap:8px;margin-bottom:9px}
.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 13px;color:var(--ink-3);min-width:0}
.search:focus-within{border-color:var(--pine-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--pine-3) 22%,transparent)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none}
.toggle{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-weight:800;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.toggle.on{background:var(--red);border-color:var(--red);color:#fff}
.cat-filter{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:11px;padding-bottom:2px}
.cat-chip{flex:0 0 auto;border:1px solid transparent;background:var(--paper-2);color:var(--ink-2);padding:6px 13px;border-radius:100px;font-weight:700;font-size:13.5px}
.cat-chip.active{background:var(--mint);color:var(--pine-2);border-color:var(--pine-3)}
@media (prefers-color-scheme:dark){.cat-chip.active{color:var(--on-pine)}}

/* ---------- 품목 목록 ---------- */
.list{display:grid;gap:9px}
.item-row{
  --c:var(--green);
  position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:13px 14px 13px 18px;box-shadow:var(--shadow-1);overflow:hidden;
  animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 28ms);
}
.item-row.low{--c:var(--red)}
.item-row .rail{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.item-main{flex:1;min-width:0}
.item-name{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.3}
.item-sub{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.tag{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);padding:1px 8px;border-radius:7px;font-size:12px;font-weight:700}
.memo{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;color:var(--amber);font-weight:600}
.memo .ic{width:14px;height:14px}
.item-stock{flex:none;text-align:right;min-width:92px}
.item-stock .n{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.item-row.low .item-stock .n{color:var(--red)}
.item-stock .n .par{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.item-stock .p{font-size:11.5px;color:var(--ink-3);font-weight:700;margin-top:3px}
.gauge{height:6px;border-radius:6px;background:var(--line-2);margin:8px 0 7px auto;overflow:hidden;width:92px}
.gauge i{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.badge{display:inline-block;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:800}
.badge.low{background:var(--red-bg);color:var(--red-ink)}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.st-none{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.st-partial{background:var(--amber-bg);color:var(--amber)}
.badge.st-done{background:var(--green-bg);color:var(--green)}
.badge.warn{background:var(--red-bg);color:var(--red-ink)}

/* ---------- 버튼 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:15px;padding:14px 16px;font-weight:800;font-size:15.5px;letter-spacing:-.01em;
  transition:transform .1s, filter .15s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--pine);color:var(--on-pine);box-shadow:0 12px 22px -14px rgba(10,57,53,.95), inset 0 0 0 1px rgba(255,255,255,.1)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--mint-2);color:var(--pine-2);border:1px solid var(--mint)}
@media (prefers-color-scheme:dark){.btn-secondary{color:var(--on-pine)}}
.btn-ghost{background:transparent;color:var(--pine-3);border:1px solid var(--line)}
.btn-row{display:flex;gap:9px}
.btn-row .btn{flex:1}
.pill-count{display:inline-block;background:rgba(255,255,255,.2);padding:1px 9px;border-radius:100px;font-size:13px;font-weight:800}
.pill-count.dim{background:rgba(255,255,255,.12);font-weight:600;opacity:.85}
.fab-note{font-size:12.5px;color:var(--ink-3);text-align:center;margin:10px 6px 0;line-height:1.6}
.savebar{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:15;padding:10px 16px 12px;
  background:linear-gradient(to top, color-mix(in srgb,var(--paper) 96%,transparent) 62%, transparent);pointer-events:none;
}
.savebar .btn{max-width:calc(var(--maxw) - 32px);margin:0 auto;pointer-events:auto;box-shadow:0 18px 30px -14px rgba(10,57,53,.95)}

/* ---------- 스테퍼·체크박스 ---------- */
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:transform .08s,background .15s}
.stepper button:active{transform:scale(.9);background:var(--mint-2)}
.stepper input{width:58px;height:38px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:800;font-size:17px;padding:0 2px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;border-color:var(--pine-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--pine-3) 22%,transparent)}
.reqChk{position:relative;flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s}
.reqChk:checked{background:var(--pine);border-color:var(--pine)}
.reqChk:checked::after{content:"";position:absolute;left:7px;top:2.5px;width:6px;height:12px;border:solid var(--on-pine);border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}

/* ---------- 실사 / 청구 / 입고 행 ---------- */
.audit-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;margin-bottom:12px;border-radius:var(--r);
  background:var(--mint-2);border:1px solid var(--mint);position:relative;overflow:hidden;
}
.audit-banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pine-3)}
.audit-banner.overdue{background:var(--red-bg);border-color:var(--red)} .audit-banner.overdue::before{background:var(--red)}
.audit-banner .t1{font-size:12px;color:var(--ink-3);font-weight:700}
.audit-banner .t2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.audit-banner.overdue .t2{color:var(--red-ink)}
.audit-banner > div:last-child{text-align:right}
.audit-row,.req-item,.rcv-row{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow-1);
  animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 28ms);transition:border-color .15s, background .15s;
}
.audit-row.changed{border-color:var(--pine-3);background:var(--mint-2)}
.audit-row .info,.req-item .info,.rcv-row .info{flex:1;min-width:0}
.name{font-weight:800;font-size:15.5px;letter-spacing:-.02em;line-height:1.3}
.spec{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.old,.shortage,.rcv-meta{font-size:12.5px;margin-top:3px;font-weight:600;color:var(--ink-2)}
.shortage{color:var(--red-ink)}
.delta{min-width:34px;text-align:center;font-weight:800;font-size:13px;border-radius:8px;padding:2px 0}
.delta.up{color:var(--green);background:var(--green-bg)} .delta.down{color:var(--red-ink);background:var(--red-bg)}
.delta:empty{display:none}
.dept-grid{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.dept-card{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:6px;min-height:104px;
  animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 40ms);
}
.dept-card:active{transform:scale(.98)}
.dept-card .dc-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.dept-card .dc-meta{font-size:12.5px;color:var(--ink-3);line-height:1.5;flex:1}
.dc-badge{align-self:flex-start;font-size:12px;font-weight:800;padding:2px 9px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.dc-badge.over{background:var(--red-bg);color:var(--red-ink);border-color:transparent}
.dc-badge.soon{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.dc-badge.fine{background:var(--green-bg);color:var(--green);border-color:transparent}

.history-item{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-1);
}
.history-item:active{background:var(--mint-2)}
.history-item .row1{display:flex;justify-content:space-between;font-weight:800;font-size:14.5px}
.history-item .row2{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12.5px;color:var(--ink-3)}

/* 입고 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
.seg-btn{border:0;background:transparent;border-radius:12px;padding:11px;font-weight:800;font-size:14.5px;color:var(--ink-2);transition:background .15s,color .15s}
.seg-btn.on{background:var(--pine);color:var(--on-pine);box-shadow:0 8px 16px -10px rgba(10,57,53,.95), inset 0 0 0 1px rgba(255,255,255,.1)}
.pending-card{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow-1);position:relative;overflow:hidden;
}
.pending-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
.pending-card:active{background:var(--mint-2)}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-title{font-weight:800;font-size:16px;letter-spacing:-.02em}
.pc-date{font-size:12.5px;color:var(--ink-3);font-weight:600}
.pc-meta{display:flex;justify-content:space-between;align-items:center;margin:7px 0 9px;font-size:13px;color:var(--ink-2);font-weight:600}
.pc-bar{height:7px;border-radius:7px;background:var(--line-2);overflow:hidden}
.pc-bar i{display:block;height:100%;border-radius:7px;background:var(--pine-3)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:800;color:var(--pine-3);padding:6px 2px;margin-bottom:8px}
.rcv-row.done{opacity:.62}
.rcv-row .rcv-meta b{color:var(--pine-3)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px}
.field:focus{outline:none;border-color:var(--pine-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--pine-3) 22%,transparent)}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}

/* ---------- 품목관리 ---------- */
.manage-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-1);animation:rise .4s both;animation-delay:calc(var(--i,0) * 28ms)}
.manage-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger{color:var(--red-ink);background:var(--red-bg);border-color:transparent}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.par-field{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.par-field input{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-weight:800;font-size:17px}
.par-field input:focus{outline:none;border-color:var(--pine-3)}

/* ---------- 하단 메뉴 ---------- */
nav.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--maxw);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--surface) 90%, transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
  border-top:1px solid var(--line);
}
.nav-btn{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;color:var(--ink-3);font-size:11px;font-weight:800;letter-spacing:-.02em;border-radius:14px;transition:color .15s}
.nav-btn .ic{width:23px;height:23px;transition:transform .2s}
.nav-btn.active{color:var(--pine-3)}
@media (prefers-color-scheme:light){.nav-btn.active{color:var(--pine)}}
.nav-btn.active .ic{transform:translateY(-1px) scale(1.08)}
.nav-btn.active::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--pine-3)}
.nav-btn[data-badge]:not([data-badge="0"])::after{content:attr(data-badge);position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}

/* ---------- 토스트 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);transform:translate(-50%,16px);z-index:60;max-width:min(92%,480px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;text-align:center;line-height:1.45;opacity:0;pointer-events:none;
  transition:opacity .22s, transform .22s cubic-bezier(.2,.7,.2,1);box-shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 바텀시트(모달) ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,16,15,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s both;
}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.modal-sheet{
  width:100%;max-width:var(--maxw);max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-sheet);animation:sheet .32s cubic-bezier(.2,.7,.2,1) both;
}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.modal-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.modal-close{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.field-label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-3);margin:14px 2px 6px;letter-spacing:.02em}
.doc-id{font-size:12px;color:var(--ink-3);margin:2px 0 12px;font-variant-numeric:tabular-nums}
.modal-sheet .item-row{box-shadow:none;border-radius:0;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:11px 4px 11px 14px}
.modal-sheet .item-row .rail{width:3px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 10px;margin:10px 0 14px}
.doc .item-row:last-child{border-bottom:0}
.rcv-chip{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:7px}
.print-only{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 인쇄: 청구서만 깔끔한 결재 문서로 ---------- */
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#000!important;min-height:0}
  body{background-image:none!important}
  header.app-header,nav.bottom-nav,main,.toast,.savebar,.no-print,.grab,.modal-close{display:none!important}
  .modal-backdrop{position:static!important;display:block!important;background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;animation:none!important}
  .modal-sheet{position:static!important;max-width:none!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border-radius:0!important;padding:0!important;background:#fff!important;animation:none!important}
  .modal-title,.doc-id,.muted.doc-meta{display:none!important}
  .print-only{display:block!important}
  .print-head{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .ph-title{font-size:22pt;font-weight:800;letter-spacing:.2em}
  .ph-org{font-size:12pt;margin-top:2px}
  .ph-meta{font-size:10pt;margin-top:6px;color:#333}
  .doc{border:0;border-radius:0;padding:0;margin:0;background:none}
  .item-row{animation:none!important;break-inside:avoid;border:0!important;border-bottom:1px solid #999!important;box-shadow:none!important;background:none!important;border-radius:0!important;padding:8px 0!important}
  .item-row .rail,.gauge{display:none!important}
  .item-name{font-size:11.5pt}.item-sub,.tag{color:#222!important;background:none!important;border:0!important;padding:0 6px 0 0!important}
  .item-stock .n{font-size:15pt;color:#000!important}.item-stock .p{color:#222!important}
  .rcv-chip{background:none!important;color:#000!important;padding:0!important}
  .print-sign{display:grid!important;grid-template-columns:repeat(3,1fr);gap:0;margin-top:26px;border:1px solid #000}
  .print-sign div{padding:6px 10px 40px;border-right:1px solid #000;font-size:10pt}.print-sign div:last-child{border-right:0}
}
</style>
</head>

<script>
// ===== 설정 (필요하면 이 부분만 고치세요) =====
// 화면 제목과 청구서(인쇄)에 표시할 병원 이름. 비워 두면 표시하지 않습니다. 예: const ORG_NAME = "○○병원";
const ORG_NAME = "";
// 정기 재고파악(실사) 주기(일). 14 = 2주마다
const AUDIT_INTERVAL_DAYS = 14;

// ⚠️ 아래 SCRIPT_URL을 구글 Apps Script 배포 후 발급받은 웹앱 URL로 교체하세요.
// README.md의 "Apps Script 배포" 단계를 참고하세요.
const SCRIPT_URL = "SCRIPT_URL_HERE";
// 실제 URL(http로 시작)이 들어 있을 때만 연결을 시도한다.
// "SCRIPT_URL_HERE" 문구와 비교하지 않는 이유: 메모장 '모두 바꾸기'로 URL을 넣으면 비교 문구까지 같이 바뀌어 항상 '미설정'으로 판단되기 때문이다.
function isConfigured(){ return /^https?:\/\//i.test(SCRIPT_URL); }

const $ = id => document.getElementById(id);
const ic = (n, c) => `<svg class="ic ${c||''}" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`;

let STATE = {
  screen: 'dashboard', dept: '전체', cat: '전체', search: '', lowOnly: false,
  items: [], audits: {}, requests: [], receipts: [],
  loaded: false, // false | true | 'error'
  auditDept: null, auditDraft: {},
  reqDept: '전체', reqSel: {}, reqQty: {},
  rcvMode: 'request', rcvReq: null, rcvDraft: {}, rcvMemo: ''
};

// 대분류(부서) 목록은 시트에 입력된 품목에서 자동으로 만든다 (처음 나온 순서 그대로)
function depts(){
  const out = [];
  STATE.items.forEach(i=>{ if(i.dept && !out.includes(i.dept)) out.push(i.dept); });
  return out;
}

// ---------- Apps Script API ----------
async function apiGet(action){
  const res = await fetch(`${SCRIPT_URL}?action=${encodeURIComponent(action)}`);
  const data = await res.json();
  if(!data.success) throw apiError(data.error || 'API 오류');
  return data.data;
}
async function apiPost(payload){
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!data.success) throw apiError(data.error || 'API 오류');
  return data.data;
}
// 서버가 "이유"를 알려준 오류(예: 시트에서 찾을 수 없는 품목)와, 연결 자체가 안 되는 오류를 구분한다
function apiError(msg){ const e = new Error(msg); e.isApi = true; return e; }
function errMsg(e, fallback){ return (e && e.isApi) ? e.message : fallback; }

function applyData(data){
  STATE.items = (data.items||[]).map(i=>({
    id: Number(i.id), dept: String(i.dept||''), cat: String(i.cat||''), name: String(i.name||''),
    spec: i.spec || '', par: Number(i.par)||0, stock: Number(i.stock)||0, memo: i.memo || ''
  }));
  STATE.audits = Object.assign({}, data.audits || {});
  STATE.requests = (data.requests||[]).map(r=>({ id: r.id, date: r.date, dept: r.dept, status: r.status || 'none', items: (r.items||[]).map(i=>Object.assign({received:0}, i)) }));
  STATE.receipts = data.receipts || [];
}
async function loadAll(){
  if(!isConfigured()){
    STATE.loaded = 'error';
    setConnected('bad', '연결 안 됨');
    render();
    return;
  }
  setConnected('busy', '동기화 중…');
  try{
    applyData(await apiGet('getAll'));
    STATE.loaded = true;
    setConnected('ok', '연결됨');
  }catch(e){
    console.error('load error', e);
    STATE.loaded = 'error';
    setConnected('bad', '연결 실패');
    toast('구글시트 연결 실패 — URL과 배포 설정을 확인해주세요');
  }
  render();
}
// 화면은 그대로 두고 서버의 최신 상태(청구서 입고 현황 등)만 다시 받아온다
async function reloadQuiet(){
  try{ applyData(await apiGet('getAll')); }catch(e){ console.error('reload error', e); }
}
function setSyncing(b){
  if(b) setConnected('busy', '동기화 중…');
  else if(STATE.loaded===true) setConnected('ok', '연결됨');
}
function setConnected(state, label){
  const pill = $('syncPill'), text = $('syncText');
  if(!pill || !text) return;
  pill.className = 'sync-pill ' + state;
  text.textContent = label;
}

// ---------- 날짜·유틸 ----------
// 날짜는 항상 "내 컴퓨터/폰의 현지 날짜"로 계산한다.
// (toISOString 은 UTC 기준이라 한국처럼 UTC보다 앞선 시간대에서는 하루씩 밀린다)
function ymd(dt){ return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(new Date()); }
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d+'T00:00:00');
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtShort(d){ return fmtDate(d).slice(5); }
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/86400000);
}
function addDays(d, n){
  const dt = new Date(d+'T00:00:00'); dt.setDate(dt.getDate()+n);
  return ymd(dt);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer;
function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2800);
}
const CAT_ORDER = ['의약품', '소모품', '보조기', '문구'];
function catRank(cat){ const idx = CAT_ORDER.indexOf(cat); return idx === -1 ? CAT_ORDER.length : idx; }
function deptRank(dept){ const list = depts(); const idx = list.indexOf(dept); return idx === -1 ? list.length : idx; }
function itemsForDept(dept){
  const list = dept === '전체' ? STATE.items.slice() : STATE.items.filter(i=>i.dept===dept);
  // 부서(전체보기일 때만) → 소분류 순으로 정렬. 같은 소분류 안에서는 원래 순서 유지(안정 정렬).
  return list.sort((a, b)=>{
    if(dept === '전체'){ const d = deptRank(a.dept) - deptRank(b.dept); if(d !== 0) return d; }
    return catRank(a.cat) - catRank(b.cat);
  });
}
function catsForDept(dept){ const set = new Set(itemsForDept(dept).map(i=>i.cat)); return ['전체', ...Array.from(set)]; }
function isLow(item){ return item.stock < item.par; }
function ratio(i){ return i.par > 0 ? Math.max(3, Math.min(100, Math.round(i.stock / i.par * 100))) : 100; }
// 검색: 품목명·규격, 대소문자 구분 없이
function matchSearch(i){
  const q = (STATE.search||'').trim().toLowerCase();
  return !q || String(i.name).toLowerCase().includes(q) || String(i.spec||'').toLowerCase().includes(q);
}
// 입력창 자동완성 목록(새 대분류·소분류도 자유롭게 입력할 수 있다)
function catList(){
  const out = CAT_ORDER.slice();
  STATE.items.forEach(i=>{ if(i.cat && !out.includes(i.cat)) out.push(i.cat); });
  return out;
}
function datalistHtml(id, arr){ return `<datalist id="${id}">${arr.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`; }
function bump(input, delta, min){
  input.value = Math.max(min, (parseInt(input.value, 10) || 0) + delta);
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
const stepperHtml = (cls, id, val, min) =>
  `<div class="stepper"><button type="button" class="stp-minus" data-for="${id}" aria-label="하나 줄이기">${ic('minus')}</button><input type="number" inputmode="numeric" min="${min}" class="mono ${cls}" data-id="${id}" value="${val}"><button type="button" class="stp-plus" data-for="${id}" aria-label="하나 늘리기">${ic('plus')}</button></div>`;
const rowDelay = i => `style="--i:${Math.min(i, 10)}"`;

// ---------- 상단 부서 칩 · 하단 메뉴 ----------
function renderDeptChips(){
  const wrap = $('deptScroll');
  const all = ['전체', ...depts()];
  wrap.innerHTML = all.map(d=>{
    const low = (d==='전체' ? STATE.items : STATE.items.filter(i=>i.dept===d)).filter(isLow).length;
    return `<button class="dept-chip ${d===STATE.dept ? 'active' : ''}" data-dept="${esc(d)}" ${low ? `data-low="${low}"` : ''}>${esc(d)}</button>`;
  }).join('');
  wrap.querySelectorAll('.dept-chip').forEach(el=>{
    el.addEventListener('click', ()=>{ STATE.dept = el.dataset.dept; STATE.cat = '전체'; render(); });
  });
}
function renderNav(){
  const pending = STATE.requests.filter(r=>r.status!=='done').length;
  document.querySelectorAll('.nav-btn').forEach(el=>{
    el.classList.toggle('active', el.dataset.screen === STATE.screen);
    if(el.dataset.screen === 'receive'){ if(pending) el.setAttribute('data-badge', pending); else el.removeAttribute('data-badge'); }
  });
}
function go(screen){
  STATE.screen = screen;
  if(screen === 'audit' && !STATE.auditDept && STATE.dept !== '전체') STATE.auditDept = STATE.dept;
  window.scrollTo(0, 0);
  render();
}
document.querySelectorAll('.nav-btn').forEach(el=> el.addEventListener('click', ()=> go(el.dataset.screen)));

// ---------- 모달(바텀시트) ----------
function openSheet(inner){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal-sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;
  document.body.appendChild(backdrop);
  const close = ()=>{ backdrop.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e=>{ if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
  const x = backdrop.querySelector('#closeModal'); if(x) x.addEventListener('click', close);
  return { backdrop, close };
}
const modalHead = title => `<div class="modal-title"><span>${title}</span><button type="button" class="modal-close" id="closeModal" aria-label="닫기">${ic('x')}</button></div>`;

// ---------- 메인 렌더 ----------
function render(){
  renderDeptChips();
  renderNav();
  const main = $('main');
  if(STATE.loaded===false){ main.innerHTML = `<div class="empty-state"><div class="glyph">⏳</div>구글시트에서 불러오는 중…</div>`; return; }
  if(STATE.loaded==='error'){
    const notSet = !isConfigured();
    main.innerHTML = `
      <div class="panel rise">
        <div class="section-title" style="margin-top:2px;">구글시트 연결 안 됨</div>
        <div class="muted" style="font-size:13.5px;line-height:1.7;margin-bottom:14px;">
          ${notSet
            ? '이 파일 안의 <b>SCRIPT_URL</b> 값이 아직 설정되지 않았어요. Apps Script를 배포한 뒤 발급받은 웹앱 URL로 교체해주세요. (README.md 참고)'
            : '구글시트에 연결할 수 없어요. Apps Script 배포 상태(액세스 권한: 모든 사용자)와 URL을 확인해주세요.'}
        </div>
        <button class="btn btn-primary" id="retryConn">다시 연결 시도</button>
      </div>`;
    $('retryConn').addEventListener('click', loadAll);
    return;
  }
  if(STATE.screen==='dashboard') return renderDashboard(main);
  if(STATE.screen==='audit') return renderAudit(main);
  if(STATE.screen==='request') return renderRequest(main);
  if(STATE.screen==='receive') return renderReceive(main);
  if(STATE.screen==='manage') return renderManage(main);
}

// ================= 재고현황 =================
function visibleItems(){
  return itemsForDept(STATE.dept).filter(i=> STATE.cat==='전체' || i.cat===STATE.cat).filter(matchSearch).filter(i=> !STATE.lowOnly || isLow(i));
}
function dashboardListHtml(){
  const list = visibleItems();
  return list.length===0 ? `<div class="empty-state"><div class="glyph">📦</div>${STATE.items.length===0 ? '등록된 품목이 없어요<br>품목관리에서 추가하거나 구글 시트에 입력해 주세요' : (STATE.lowOnly && !STATE.search && STATE.cat==='전체' ? '재고가 부족한 품목이 없어요 👍' : '조건에 맞는 품목이 없어요')}</div>` :
    list.map((i, idx)=>{ const low = isLow(i); return `
    <div class="item-row ${low?'low':'ok'}" ${rowDelay(idx)}>
      <span class="rail"></span>
      <div class="item-main">
        <div class="item-name">${esc(i.name)}</div>
        <div class="item-sub">
          ${STATE.dept==='전체' ? `<span class="tag">${esc(i.dept)}</span>` : ''}
          <span class="tag">${esc(i.cat)}</span>
          ${i.spec ? `<span>${esc(i.spec)}</span>` : ''}
        </div>
        ${i.memo ? `<div class="memo">${ic('note')}<span>${esc(i.memo)}</span></div>` : ''}
      </div>
      <div class="item-stock">
        <div class="n mono">${i.stock}<span class="par"> / ${i.par}</span></div>
        <div class="gauge" aria-hidden="true"><i style="width:${ratio(i)}%"></i></div>
        <div class="badge ${low?'low':'ok'}">${low?'부족':'정상'}</div>
      </div>
    </div>`; }).join('');
}
function renderDashboard(main){
  const scope = itemsForDept(STATE.dept);
  const lowCount = scope.filter(isLow).length;
  const okCount = scope.length - lowCount;
  const total = scope.length || 1;
  const pct = scope.length ? Math.round((okCount/total)*100) : 0;
  const circumference = 2*Math.PI*46;
  const dash = circumference * pct/100;
  const pendingRcv = STATE.requests.filter(r=>r.status!=='done').length;
  const now = new Date();
  const dateLabel = `${now.getMonth()+1}월 ${now.getDate()}일`;

  main.innerHTML = `
    <section class="hero rise">
      <div class="hero-head"><span class="eyebrow">${STATE.dept==='전체' ? '전체 부서' : esc(STATE.dept)} · 오늘의 재고</span><span class="hero-date">${dateLabel}</span></div>
      <div class="hero-body">
        <div class="ring-wrap">
          <svg viewBox="0 0 118 118" aria-hidden="true">
            <circle class="track" cx="59" cy="59" r="46" fill="none" stroke-width="11"/>
            <circle class="arc" cx="59" cy="59" r="46" fill="none" stroke-width="11" stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"/>
          </svg>
          <div class="ring-center"><div class="num">${pct}%</div><div class="lbl">정상 비율</div></div>
        </div>
        <div class="ring-stats">
          <div class="ring-stat-line"><span class="k"><span class="swatch"></span>전체 품목</span><span class="v">${scope.length}</span></div>
          <div class="ring-stat-line"><span class="k"><span class="swatch sw-ok"></span>정상</span><span class="v">${okCount}</span></div>
          <div class="ring-stat-line low"><span class="k"><span class="swatch sw-low"></span>재고부족</span><span class="v">${lowCount}</span></div>
        </div>
      </div>
      <div class="hero-actions">
        ${lowCount>0 ? `<button class="hero-cta" data-go="request">${ic('file')}부족 ${lowCount}개 청구하러 가기${ic('chev')}</button>` : `<div class="hero-ok">${ic('check')}모든 품목이 적정 재고예요</div>`}
        ${pendingRcv>0 ? `<button class="hero-chip" data-go="receive">${ic('package')}입고 대기 ${pendingRcv}건</button>` : ''}
      </div>
    </section>

    <div class="filters rise" style="animation-delay:.06s">
      <label class="search">${ic('search')}<input type="search" id="searchInput" placeholder="품목명 또는 규격 검색" value="${esc(STATE.search)}" autocomplete="off"></label>
      <button type="button" class="toggle ${STATE.lowOnly?'on':''}" id="lowOnlyBtn" aria-pressed="${STATE.lowOnly}">부족만</button>
    </div>
    <div class="cat-filter" id="catFilter"></div>
    <div class="list" id="itemListCard">${dashboardListHtml()}</div>
  `;
  bindSearch(renderDashboardListOnly);
  $('lowOnlyBtn').addEventListener('click', ()=>{ STATE.lowOnly = !STATE.lowOnly; render(); });
  main.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.go)));
  renderCatFilter();
}
// 검색창: 한글 조합(자모 결합) 중에는 목록을 다시 그리지 않는다 — 안 그러면 자음/모음이 끊겨 보인다
function bindSearch(onChange){
  const inp = $('searchInput');
  inp.addEventListener('input', e=>{
    STATE.search = e.target.value;
    if(e.isComposing) return;
    onChange();
  });
  inp.addEventListener('compositionend', e=>{ STATE.search = e.target.value; onChange(); });
}
function renderDashboardListOnly(){
  const card = $('itemListCard');
  if(card) card.innerHTML = dashboardListHtml();
}
function renderCatFilter(){
  const el = $('catFilter');
  const cats = catsForDept(STATE.dept);
  el.innerHTML = cats.map(c=>`<button class="cat-chip ${c===STATE.cat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  el.querySelectorAll('.cat-chip').forEach(c=> c.addEventListener('click', ()=>{ STATE.cat = c.dataset.cat; render(); }));
}

// ================= 재고파악(실사) =================
function auditStatus(dept){
  const last = STATE.audits[dept];
  if(!last) return { cls:'', badge:'미실시', meta:'실사 기록 없음' };
  const next = addDays(last, AUDIT_INTERVAL_DAYS);
  const left = daysBetween(todayStr(), next);
  const meta = `최근 ${fmtShort(last)} · 다음 ${fmtShort(next)}`;
  if(left < 0) return { cls:'over', badge:`${-left}일 지남`, meta };
  if(left <= 3) return { cls:'soon', badge:left===0 ? '오늘 예정' : `D-${left}`, meta };
  return { cls:'fine', badge:`D-${left}`, meta };
}
function renderAudit(main){
  const dept = STATE.auditDept;
  if(!dept || dept==='전체'){
    const ds = depts();
    main.innerHTML = `
      <div class="section-title rise" style="margin-top:2px;">재고파악 <span class="muted">${AUDIT_INTERVAL_DAYS}일 주기 · 부서 단위로 진행해요</span></div>
      ${ds.length ? `<div class="dept-grid">${ds.map((d, i)=>{ const s = auditStatus(d); return `
        <button class="dept-card" data-d="${esc(d)}" ${rowDelay(i)}>
          <span class="dc-name">${esc(d)}</span>
          <span class="dc-meta">${esc(s.meta)}</span>
          <span class="dc-badge ${s.cls}">${esc(s.badge)}</span>
        </button>`; }).join('')}</div>` :
      `<div class="empty-state"><div class="glyph">🗂️</div>등록된 품목이 없어요. 먼저 품목관리에서 추가하거나 구글 시트에 입력해 주세요.</div>`}`;
    main.querySelectorAll('[data-d]').forEach(b=> b.addEventListener('click', ()=>{ STATE.auditDept = b.dataset.d; STATE.dept = b.dataset.d; STATE.auditDraft={}; render(); }));
    return;
  }
  const last = STATE.audits[dept];
  const next = last ? addDays(last, AUDIT_INTERVAL_DAYS) : null;
  const overdue = next ? daysBetween(next, todayStr()) > 0 : false;
  const list = itemsForDept(dept).filter(i=> STATE.cat==='전체' || i.cat===STATE.cat);

  main.innerHTML = `
    <div class="audit-banner rise ${overdue?'overdue':''}">
      <div>
        <div class="t1">${esc(dept)} · 최근 실사일</div>
        <div class="t2">${last ? fmtDate(last) : '기록 없음'}</div>
      </div>
      <div>
        <div class="t1">다음 실사 예정</div>
        <div class="t2">${next ? fmtDate(next) + (overdue? ' (지남)':'') : '실사 후 안내'}</div>
      </div>
    </div>
    <div class="cat-filter" id="catFilter"></div>
    <div class="section-title" style="margin-top:6px;">실사 수량 입력 <span class="muted">${list.length}개 품목</span></div>
    <div class="list">
      ${list.map((i, idx)=>`
        <div class="audit-row" ${rowDelay(idx)}>
          <div class="info">
            <div class="name">${esc(i.name)}</div>
            <div class="spec">${esc(i.cat)} ${i.spec?('· '+esc(i.spec)):''}</div>
            <div class="old">현재고 ${i.stock} · 적정 ${i.par}</div>
          </div>
          <span class="delta"></span>
          ${stepperHtml('audit-input', i.id, STATE.auditDraft[i.id] !== undefined ? STATE.auditDraft[i.id] : i.stock, 0)}
        </div>`).join('')}
    </div>
    <div class="fab-note">입력한 수량으로 현재 재고가 갱신되고, 다음 실사일이 ${AUDIT_INTERVAL_DAYS}일 후로 설정돼요.</div>
    <button class="btn btn-ghost" id="changeDept" style="margin-top:12px;">다른 부서 선택</button>
    <div class="savebar"><button class="btn btn-primary" id="saveAudit">실사 결과 저장 (${esc(dept)})</button></div>
  `;
  renderCatFilter();
  main.querySelectorAll('.audit-input').forEach(inp=>{
    inp.addEventListener('input', e=>{ STATE.auditDraft[e.target.dataset.id] = e.target.value; refreshAuditSummary(dept); });
  });
  main.querySelectorAll('.stp-minus').forEach(b=> b.addEventListener('click', ()=> bump(main.querySelector(`.audit-input[data-id="${b.dataset.for}"]`), -1, 0)));
  main.querySelectorAll('.stp-plus').forEach(b=> b.addEventListener('click', ()=> bump(main.querySelector(`.audit-input[data-id="${b.dataset.for}"]`), +1, 0)));
  $('saveAudit').addEventListener('click', ()=> submitAudit(dept, list));
  $('changeDept').addEventListener('click', ()=>{ STATE.auditDept=null; render(); });
  refreshAuditSummary(dept);
}
// 바뀐 줄을 강조하고, 저장 버튼에 "몇 건 바뀌었는지" 보여준다
function refreshAuditSummary(dept){
  let changed = 0;
  document.querySelectorAll('.audit-row').forEach(row=>{
    const inp = row.querySelector('.audit-input');
    const it = STATE.items.find(x=>x.id===Number(inp.dataset.id));
    if(!it) return;
    const raw = STATE.auditDraft[inp.dataset.id];
    const val = raw === undefined ? it.stock : Math.max(0, parseInt(raw)||0);
    const diff = val - it.stock;
    row.classList.toggle('changed', diff !== 0);
    const d = row.querySelector('.delta');
    d.textContent = diff===0 ? '' : (diff>0 ? '+'+diff : '−'+Math.abs(diff));
    d.className = 'delta ' + (diff>0 ? 'up' : diff<0 ? 'down' : '');
    if(diff !== 0) changed++;
  });
  const btn = $('saveAudit');
  if(btn) btn.innerHTML = `실사 결과 저장 (${esc(dept)}) <span class="pill-count ${changed?'':'dim'}">${changed ? changed+'건 변경' : '변경 없음'}</span>`;
}
async function submitAudit(dept, list){
  const updates = [];
  list.forEach(i=>{
    const draft = STATE.auditDraft[i.id];
    if(draft === undefined) return;
    const newVal = Math.max(0, parseInt(draft)||0);
    if(newVal !== i.stock) updates.push({ id:i.id, name:i.name, stock:newVal });
  });
  // 수량이 모두 그대로여도 "실사를 했다"는 기록은 남겨야 다음 실사일이 갱신된다
  if(updates.length===0){
    if(!confirm(`변경된 수량이 없어요. 변경 없이 ${dept} 실사 완료로 기록할까요?`)) return;
  }
  setSyncing(true);
  try{
    const result = await apiPost({ action:'auditSubmit', dept, updates });
    updates.forEach(u=>{
      const it = STATE.items.find(x=>x.id===u.id);
      if(it) it.stock = u.stock;
    });
    STATE.audits[dept] = result.date;
    STATE.auditDraft = {};
    toast(`${dept} 실사 완료 · ${result.changed}건 변경 · 다음 실사 ${fmtDate(addDays(result.date,AUDIT_INTERVAL_DAYS))}` + ((result.skipped||[]).length ? ` · 시트에서 못 찾은 ${result.skipped.length}개는 저장되지 않았어요. 새로고침하세요` : ''));
  }catch(e){
    console.error(e);
    toast(errMsg(e, '저장 실패 — 구글시트 연결을 확인해주세요'));
  }
  setSyncing(false);
  render();
}

// ================= 물품청구 =================
const STATUS_LABEL = { none:'입고 전', partial:'일부 입고', done:'입고 완료' };
function renderRequest(main){
  const dept = STATE.reqDept;
  const pool = (dept==='전체' ? STATE.items : itemsForDept(dept)).filter(isLow);
  const pastRequests = [...STATE.requests].reverse();
  pool.forEach(i=>{
    if(STATE.reqQty[i.id] === undefined) STATE.reqQty[i.id] = Math.max(1, i.par - i.stock);
  });

  main.innerHTML = `
    <div class="section-title rise" style="margin-top:2px;">청구 대상 부서</div>
    <div class="chips rise" id="reqDeptScroll" style="margin-bottom:6px;"></div>

    <div class="section-title">부족 품목 <span class="muted">${pool.length}개</span></div>
    <div class="list">
      ${pool.length===0 ? `<div class="empty-state"><div class="glyph">✅</div>재고 부족 품목이 없어요</div>` :
      pool.map((i, idx)=>{
        const checked = STATE.reqSel[i.id] !== false; // default checked
        return `
        <div class="req-item" ${rowDelay(idx)}>
          <input type="checkbox" data-id="${i.id}" class="reqChk" ${checked?'checked':''} aria-label="${esc(i.name)} 선택">
          <div class="info">
            <div class="name">${esc(i.name)}</div>
            <div class="spec">${esc(i.dept)} · ${esc(i.cat)} ${i.spec?('· '+esc(i.spec)):''}</div>
            <div class="shortage">현재 ${i.stock} / 적정 ${i.par}</div>
          </div>
          <div class="stepper">
            <button type="button" class="reqMinus" data-id="${i.id}" aria-label="하나 줄이기">${ic('minus')}</button>
            <input type="number" inputmode="numeric" class="mono reqQty" data-id="${i.id}" value="${STATE.reqQty[i.id]}" min="1">
            <button type="button" class="reqPlus" data-id="${i.id}" aria-label="하나 늘리기">${ic('plus')}</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${pool.length>0 ? `<div class="savebar"><button class="btn btn-primary" id="genRequest">청구서 생성</button></div>` : ''}

    <div class="section-title" style="margin-top:26px;">지난 청구 내역</div>
    ${pastRequests.length===0 ? `<div class="empty-state" style="padding:26px;"><div class="glyph">📄</div>생성된 청구서가 없어요</div>` :
      pastRequests.map(r=>`
      <button class="history-item" data-rid="${esc(r.id)}">
        <div class="row1"><span>${esc(r.dept)} 청구서</span><span>${fmtDate(r.date)}</span></div>
        <div class="row2"><span>${r.items.length}개 품목</span><span class="badge st-${esc(r.status)}">${STATUS_LABEL[r.status] || ''}</span></div>
      </button>`).join('')}
  `;

  const rs = $('reqDeptScroll');
  rs.innerHTML = ['전체', ...depts()].map(d=>`<button class="dept-chip ${d===dept?'active':''}" data-d="${esc(d)}">${esc(d)}</button>`).join('');
  rs.querySelectorAll('[data-d]').forEach(el=> el.addEventListener('click', ()=>{ STATE.reqDept = el.dataset.d; render(); }));

  const refreshCta = ()=>{
    const btn = $('genRequest'); if(!btn) return;
    const n = pool.filter(i=> STATE.reqSel[i.id] !== false).length;
    btn.innerHTML = `청구서 생성 <span class="pill-count ${n?'':'dim'}">${n}개</span>`;
    btn.disabled = n === 0;
  };
  main.querySelectorAll('.reqChk').forEach(el=> el.addEventListener('change', e=>{ STATE.reqSel[e.target.dataset.id] = e.target.checked; refreshCta(); }));
  const qtyInput = id => main.querySelector(`.reqQty[data-id="${id}"]`);
  main.querySelectorAll('.reqMinus').forEach(el=> el.addEventListener('click', ()=> bump(qtyInput(el.dataset.id), -1, 1)));
  main.querySelectorAll('.reqPlus').forEach(el=> el.addEventListener('click', ()=> bump(qtyInput(el.dataset.id), +1, 1)));
  main.querySelectorAll('.reqQty').forEach(el=> el.addEventListener('change', e=>{ const v = Math.max(1, parseInt(e.target.value)||1); STATE.reqQty[e.target.dataset.id] = v; e.target.value = v; }));
  const genBtn = $('genRequest');
  if(genBtn) genBtn.addEventListener('click', ()=> generateRequest(pool));
  main.querySelectorAll('.history-item[data-rid]').forEach(el=>{
    el.addEventListener('click', ()=> showRequestModal(STATE.requests.find(r=>r.id==el.dataset.rid)));
  });
  refreshCta();
}
async function generateRequest(pool){
  const chosen = pool.filter(i=> STATE.reqSel[i.id] !== false);
  if(chosen.length===0){ toast('선택된 품목이 없어요'); return; }
  const items = chosen.map(i=>({ id:i.id, name:i.name, spec:i.spec, dept:i.dept, cat:i.cat, stock:i.stock, par:i.par, qty: STATE.reqQty[i.id] || Math.max(1,i.par-i.stock) }));
  setSyncing(true);
  let req = null;
  try{
    const result = await apiPost({ action:'requestCreate', dept: STATE.reqDept, items });
    req = { id: result.id, date: result.date, dept: STATE.reqDept, status: 'none', items: items.map(i=>Object.assign({received:0}, i)) };
    STATE.requests.push(req);
    STATE.reqSel = {}; STATE.reqQty = {};
    toast('청구서가 생성됐어요');
  }catch(e){
    console.error(e);
    toast(errMsg(e, '생성 실패 — 구글시트 연결을 확인해주세요'));
  }
  setSyncing(false);
  render();
  if(req) showRequestModal(req);
}

      <div class="ph-meta">청구 대상 ${esc(req.dept)} · 청구일 ${fmtDate(req.date)} · 청구번호 ${esc(req.id)}</div>

// ================= 입고 =================
function remainingOf(i){ return Math.max(0, i.qty - (i.received||0)); }
function openReceiveFor(rid){
  STATE.rcvMode = 'request'; STATE.rcvReq = rid; STATE.rcvDraft = {}; STATE.rcvMemo = '';
  const r = STATE.requests.find(x=>x.id===rid);
  if(r) r.items.forEach(i=>{ const rem = remainingOf(i); if(rem>0) STATE.rcvDraft[i.id] = rem; });
  go('receive');
}
function rcvSetMode(mode){ STATE.rcvMode = mode; STATE.rcvReq = null; STATE.rcvDraft = {}; STATE.rcvMemo = ''; render(); }
function renderReceive(main){
  const seg = `
    <div class="seg rise" role="tablist">
      <button class="seg-btn ${STATE.rcvMode==='request'?'on':''}" data-mode="request" role="tab">청구서 기준</button>
      <button class="seg-btn ${STATE.rcvMode==='direct'?'on':''}" data-mode="direct" role="tab">직접 입고</button>
    </div>`;
  const history = receiptHistoryHtml();

    const req = STATE.rcvReq ? STATE.requests.find(r=>r.id===STATE.rcvReq) : null;

      const pending = [...STATE.requests].reverse().filter(r=>r.status!=='done');
      main.innerHTML = seg + `
        <div class="section-title" style="margin-top:6px;">입고 대기 청구서 <span class="muted">${pending.length}건</span></div>
        ${pending.length===0 ? `<div class="empty-state"><div class="glyph">📭</div>입고를 기다리는 청구서가 없어요<br><span style="font-size:12.5px;">청구서 없이 들어온 물품은 "직접 입고"로 기록하세요</span></div>` :
          pending.map(r=>{
            const done = r.items.filter(i=> (i.received||0) >= i.qty).length;

            return `
            <button class="pending-card" data-rid="${esc(r.id)}">
              <div class="pc-top"><span class="pc-title">${esc(r.dept)} 청구서</span><span class="pc-date">${fmtDate(r.date)}</span></div>
              <div class="pc-meta"><span>${r.items.length}개 품목 · 입고 ${done}/${r.items.length}</span><span class="badge st-${esc(r.status)}">${STATUS_LABEL[r.status]}</span></div>
              <div class="pc-bar"><i style="width:${pct}%"></i></div>
            </button>`; }).join('')}
        ${history}`;

      return;
    }
    main.innerHTML = seg + `
      <button class="back" id="rcvBack">${ic('back')}청구서 목록</button>
      <div class="panel rise">
        <div class="pc-top"><span class="pc-title">${esc(req.dept)} 청구서</span><span class="pc-date">${fmtDate(req.date)}</span></div>
        <div class="doc-id" style="margin:4px 0 12px;">청구번호 ${esc(req.id)} · <span class="badge st-${esc(req.status)}">${STATUS_LABEL[req.status]}</span></div>
        <button class="btn btn-secondary" id="rcvAllBtn">${ic('check')}남은 수량 전부 입고로 채우기</button>
      </div>
      <div class="list">
        ${req.items.map((i, idx)=>{ const rem = remainingOf(i); return `
        <div class="rcv-row ${rem===0?'done':''}" ${rowDelay(idx)}>
          <div class="info">
            <div class="name">${esc(i.name)}</div>
            <div class="spec">${esc(i.dept)} · ${esc(i.cat)} ${i.spec?('· '+esc(i.spec)):''}</div>
            <div class="rcv-meta">청구 ${i.qty} · 입고됨 ${i.received||0} · 남음 <b>${rem}</b></div>
          </div>
          ${rem===0 ? `<span class="badge st-done">완료</span>` : ''}
          ${stepperHtml('rcvQty', i.id, STATE.rcvDraft[i.id] || 0, 0)}
        </div>`; }).join('')}
      </div>
      ${memoFieldHtml()}
      <div class="savebar"><button class="btn btn-primary" id="saveReceive">입고 저장</button></div>
      ${history}`;
    $('rcvBack').addEventListener('click', ()=>{ STATE.rcvReq = null; STATE.rcvDraft = {}; render(); });
    $('rcvAllBtn').addEventListener('click', ()=>{
      STATE.rcvDraft = {}; req.items.forEach(i=>{ const rem = remainingOf(i); if(rem>0) STATE.rcvDraft[i.id] = rem; });
      main.querySelectorAll('.rcvQty').forEach(inp=>{ inp.value = STATE.rcvDraft[inp.dataset.id] || 0; });

    return;
  }
  // 직접 입고: 청구서 없이 들어온 물품

    <div class="filters rise"><label class="search">${ic('search')}<input type="search" id="searchInput" placeholder="입고할 품목 검색" value="${esc(STATE.search)}" autocomplete="off"></label></div>
    <div class="section-title" style="margin-top:6px;">${STATE.dept==='전체' ? '전체 부서' : esc(STATE.dept)} <span class="muted">${list.length}개 품목 · 들어온 수량을 입력하세요</span></div>

    ${history}`;
  bindSearch(()=>{ const l = itemsForDept(STATE.dept).filter(matchSearch); $('rcvList').innerHTML = directListHtml(l); bindReceiveInputs($('rcvList')); refreshReceiveCta(); });
  bindReceiveCommon(main); bindReceiveInputs(main);
}

function bindReceiveCommon(main){
  main.querySelectorAll('.seg-btn').forEach(b=> b.addEventListener('click', ()=> rcvSetMode(b.dataset.mode)));
  main.querySelectorAll('.history-item[data-rcid]').forEach(el=> el.addEventListener('click', ()=> showReceiptModal(STATE.receipts.find(r=>r.id===el.dataset.rcid))));
  const memo = $('rcvMemo'); if(memo) memo.addEventListener('input', e=>{ STATE.rcvMemo = e.target.value; });
  const save = $('saveReceive'); if(save) save.addEventListener('click', submitReceive);
  refreshReceiveCta();
}
function bindReceiveInputs(scope){
  scope.querySelectorAll('.rcvQty').forEach(inp=> inp.addEventListener('input', e=>{
    const v = Math.max(0, parseInt(e.target.value)||0);
    if(v>0) STATE.rcvDraft[e.target.dataset.id] = v; else delete STATE.rcvDraft[e.target.dataset.id];
    refreshReceiveCta();
  }));
  scope.querySelectorAll('.stp-minus').forEach(b=> b.addEventListener('click', ()=> bump(scope.querySelector(`.rcvQty[data-id="${b.dataset.for}"]`), -1, 0)));
  scope.querySelectorAll('.stp-plus').forEach(b=> b.addEventListener('click', ()=> bump(scope.querySelector(`.rcvQty[data-id="${b.dataset.for}"]`), +1, 0)));
}
function refreshReceiveCta(){
  const btn = $('saveReceive'); if(!btn) return;
  const n = Object.keys(STATE.rcvDraft).length;
  btn.innerHTML = `${ic('package')}입고 저장 <span class="pill-count ${n?'':'dim'}">${n ? n+'개 품목' : '수량 없음'}</span>`;
  btn.disabled = n === 0;
}
async function submitReceive(){
  const items = Object.keys(STATE.rcvDraft).map(id=>{
    const it = STATE.items.find(x=>x.id===Number(id));
    return { id: Number(id), name: it ? it.name : String(id), qty: STATE.rcvDraft[id] };
  });
  if(!items.length){ toast('입고 수량을 입력해 주세요'); return; }
  const requestId = STATE.rcvMode==='request' ? (STATE.rcvReq || '') : '';
  setSyncing(true);
  try{
    const result = await apiPost({ action:'receiveSubmit', items, requestId, memo: STATE.rcvMemo });
    Object.keys(result.stocks || {}).forEach(id=>{ const it = STATE.items.find(x=>x.id===Number(id)); if(it) it.stock = result.stocks[id]; });
    toast(`입고 완료 · ${result.count}개 품목 · 재고에 반영했어요` + ((result.skipped||[]).length ? ` · 못 찾은 ${result.skipped.length}개는 제외됐어요. 새로고침하세요` : ''));
    STATE.rcvDraft = {}; STATE.rcvMemo = '';
    await reloadQuiet();
    if(STATE.rcvMode==='request'){
      const r = STATE.requests.find(x=>x.id===STATE.rcvReq);
      if(!r || r.status==='done') STATE.rcvReq = null;   // 다 받았으면 목록으로
    }
  }catch(e){
    console.error(e);
    toast(errMsg(e, '입고 저장 실패 — 구글시트 연결을 확인해주세요'));
  }
  setSyncing(false);
  render();
}

            <div class="item-sub"><span class="tag">${esc(i.dept)}</span><span class="tag">${esc(i.cat)}</span>${i.spec?`<span>${esc(i.spec)}</span>`:''}</div>

async function deleteItem(id){
  const it = STATE.items.find(i=>i.id===id);
  if(!it) return;
  if(!confirm(`'${it.name}' 품목을 삭제할까요? 이 작업은 되돌릴 수 없어요.`)) return;
  setSyncing(true);
  try{
    await apiPost({ action:'itemDelete', id });
    STATE.items = STATE.items.filter(i=>i.id!==id);
    toast('삭제됐어요');
  }catch(e){
    console.error(e);
    toast(errMsg(e, '삭제 실패 — 구글시트 연결을 확인해주세요'));
  }
  setSyncing(false);
  render();
}
// 새 품목을 같은 부서·같은 소분류(카테고리) 품목들 바로 아래에 끼워 넣기 위한 함수
function insertItemInOrder(newItem){
  let insertAt = -1;
  for(let idx=0; idx<STATE.items.length; idx++){
    const it = STATE.items[idx];
    if(it.dept === newItem.dept && it.cat === newItem.cat) insertAt = idx;
  }
  if(insertAt === -1){
    for(let idx=0; idx<STATE.items.length; idx++){
      if(STATE.items[idx].dept === newItem.dept) insertAt = idx;
    }
  }
  if(insertAt === -1) STATE.items.push(newItem); else STATE.items.splice(insertAt + 1, 0, newItem);
}
function openBulkCatModal(){
  const dept = STATE.dept === '전체' ? (depts()[0] || '') : STATE.dept;
  const { close } = openSheet(`
    ${modalHead('소분류 일괄 변경')}
    <label class="field-label">대분류 (부서)</label>
    <select id="bDept" class="field">${depts().map(d=>`<option value="${esc(d)}" ${dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <label class="field-label">바꿀 소분류</label>
    <input type="text" id="bCat" class="field" list="catList" value="소모품" placeholder="예: 소모품">${datalistHtml('catList', catList())}
    <label class="field-label">품목명 목록 (한 줄에 하나씩, 또는 쉼표로 구분 · 앞글자가 같으면 자동으로 찾아서 반영돼요)</label>
    <textarea id="bNames" class="field" rows="7" placeholder="예:&#10;M-splint&#10;JS-Tap EB&#10;목발"></textarea>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-ghost" id="cancelBulk">취소</button>
      <button class="btn btn-primary" id="applyBulk">적용</button>
    </div>`);
  $('cancelBulk').addEventListener('click', close);
  $('applyBulk').addEventListener('click', async ()=>{
    const targetDept = $('bDept').value;
    const targetCat = $('bCat').value.trim();
    const raw = $('bNames').value;
    const names = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
    if(names.length===0){ toast('품목명을 입력해주세요'); return; }
    if(!targetCat){ toast('바꿀 소분류를 입력해주세요'); return; }
    const applyBtn = $('applyBulk');
    applyBtn.disabled = true;
    setSyncing(true);
    const notFound = [];
    let changed = 0;
    for(const nm of names){
      const needle = nm.toLowerCase();
      // 완전 일치가 아니라 "앞부분이 같은" 품목까지 모두 찾아서 반영 (띄어쓰기·뒤에 붙은 규격 등 차이 허용)
      const matches = STATE.items.filter(i=> i.dept===targetDept && i.name.trim().toLowerCase().startsWith(needle));
      if(matches.length===0){ notFound.push(nm); continue; }
      for(const match of matches){
        if(match.cat === targetCat){ changed++; continue; } // 이미 해당 소분류면 통과
        try{
          await apiPost({ action:'itemUpdate', id: match.id, cat: targetCat });
          match.cat = targetCat;
          changed++;
        }catch(e2){
          console.error(e2);
          notFound.push(`${match.name} (저장 실패)`);
        }
      }
    }
    setSyncing(false);
    applyBtn.disabled = false;
    close();
    if(notFound.length===0){
      toast(`${changed}개 품목의 소분류를 '${targetCat}'로 변경했어요`);
    }else{
      toast(`${changed}개 변경, ${notFound.length}개는 못 찾았어요: ${notFound.join(', ')}`);
    }
    render();
  });
}
function openItemModal(item){
  const isNew = !item;
  const { close } = openSheet(`
    ${modalHead(isNew?'새 품목 추가':'품목 수정')}
    <label class="field-label">대분류 (부서)</label>
    <input type="text" id="fDept" class="field" list="deptList" value="${esc(item ? item.dept : (STATE.dept==='전체' ? (depts()[0] || '') : STATE.dept))}" placeholder="예: 병동">${datalistHtml('deptList', depts())}
    <label class="field-label">소분류</label>
    <input type="text" id="fCat" class="field" list="catList" value="${esc(item ? item.cat : '소모품')}" placeholder="예: 소모품">${datalistHtml('catList', catList())}
    <label class="field-label">품목명</label>
    <input type="text" id="fName" class="field" value="${item?esc(item.name):''}" placeholder="예: 라텍스 장갑">
    <label class="field-label">규격 / 단위</label>
    <input type="text" id="fSpec" class="field" value="${item?esc(item.spec):''}" placeholder="예: 7.5 / BOX">
    <label class="field-label">적정재고 기준값</label>
    <input type="number" inputmode="numeric" id="fPar" class="field" min="0" value="${item?item.par:5}">
    ${isNew? `<label class="field-label">초기 재고</label><input type="number" inputmode="numeric" id="fStock" class="field" min="0" value="0">` : ''}
    <label class="field-label">메모</label>
    <input type="text" id="fMemo" class="field" value="${item?esc(item.memo||''):''}" placeholder="선택 입력">
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-ghost" id="cancelItem">취소</button>
      <button class="btn btn-primary" id="saveItem">저장</button>
    </div>`);
  $('cancelItem').addEventListener('click', close);
  $('saveItem').addEventListener('click', async ()=>{
    const name = $('fName').value.trim();
    if(!name){ toast('품목명을 입력해주세요'); return; }
    const dept = $('fDept').value.trim();
    const cat = $('fCat').value.trim() || '기타';
    const spec = $('fSpec').value.trim();
    const par = Math.max(0, parseInt($('fPar').value)||0);
    const memo = $('fMemo').value.trim();
    if(!dept){ toast('대분류(부서)를 입력해주세요'); return; }
    const saveBtn = $('saveItem');
    saveBtn.disabled = true;
    setSyncing(true);
    try{
      if(isNew){
        const stock = Math.max(0, parseInt($('fStock').value)||0);
        const result = await apiPost({ action:'itemAdd', dept, cat, name, spec, par, stock, memo });
        insertItemInOrder({ id: result.id, dept, cat, name, spec, par, stock, memo });
        toast('품목이 추가됐어요');
      } else {
        await apiPost({ action:'itemUpdate', id: item.id, dept, cat, name, spec, par, memo });
        Object.assign(item, { dept, cat, name, spec, par, memo });
        toast('품목이 수정됐어요');
      }
      close();
    }catch(e){
      console.error(e);
      toast(errMsg(e, '저장 실패 — 구글시트 연결을 확인해주세요'));
      saveBtn.disabled = false;
    }
    setSyncing(false);
    render();
  });
}
