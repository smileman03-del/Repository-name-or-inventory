# ============================================================
# Jekyll 블로그 설정 파일
# 아래 항목들을 본인 정보에 맞게 수정하세요
# ============================================================

title: "내 GitHub 블로그"
description: "Claude AI가 자동으로 작성하는 기술 블로그"
author: "Your Name"
email: your-email@example.com
url: "https://yourusername.github.io"
baseurl: ""  # 서브디렉토리 없으면 빈 문자열

# 언어 설정
lang: ko

# 테마 (기본 Minima 사용, 변경 가능)
theme: minima
minima:
  skin: dark  # dark, classic, solarized, solarized-dark

# 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# 페이지당 포스트 수
paginate: 10
paginate_path: "/page:num/"

# 퍼머링크 형식
permalink: /:year/:month/:day/:title/

# 빌드 설정
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# 제외 파일
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github

# SEO 설정
twitter:
  username: yourtwitterhandle

social:
  name: Your Name
  links:
    - https://github.com/yourusername

google_analytics: ""  # Google Analytics ID (선택사항)
