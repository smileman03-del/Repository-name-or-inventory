<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>본정형외과 처치실 보조기 카운트</title>
<style>
  :root{
    --bg:#F2F4F6;
    --panel:#FFFFFF;
    --border:#E2E6EA;
    --text:#221816;
    --text-soft:#726C66;
    --orange:#F59701;
    --blue:#2B71B9;
    --green:#8FB60A;
    --red:#E83344;
    --orange-tint:#FFF3E0;
    --blue-tint:#E9F1FA;
    --green-tint:#F3F8E4;
    --red-tint:#FDECEE;
    --radius:16px;
    --shadow:0 1px 2px rgba(34,24,22,0.04), 0 4px 14px rgba(34,24,22,0.05);
  }
  *{box-sizing:border-box;}
  html{font-size:17px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app{max-width:1180px;margin:0 auto;padding:14px 14px 40px;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .cross-mark{
    width:22px;height:22px;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    gap:2px;
    flex-shrink:0;
  }
  .cross-mark span{border-radius:3px;display:block;}
  .cross-mark span:nth-child(1){background:var(--orange);}
  .cross-mark span:nth-child(2){background:var(--green);}
  .cross-mark span:nth-child(3){background:var(--blue);}
  .cross-mark span:nth-child(4){background:var(--red);}
  .brand-text{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-titles{min-width:0;}
  .brand h1{
    font-size:1.32rem;
    line-height:1.25;
    margin:0;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .brand p.sub{
    margin:2px 0 0;
    font-size:0.92rem;
    color:var(--text-soft);
    font-weight:600;
  }
  .summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .total-badge{
    background:var(--orange-tint);
    border:1px solid #FBDDA8;
    border-radius:12px;
    padding:8px 16px;
    text-align:center;
    min-width:96px;
  }
  .total-badge .num{display:block;font-size:1.7rem;font-weight:800;color:var(--orange);line-height:1;}
  .total-badge .lbl{display:block;font-size:0.72rem;color:var(--text-soft);margin-top:3px;font-weight:700;}
  button.total-badge{font:inherit;appearance:none;}
  .low-badge{background:var(--red-tint);border-color:#F6C9CE;cursor:pointer;}
  .low-badge .num{color:var(--red);}
  .low-badge.active{outline:2px solid var(--red);outline-offset:1px;}
  .btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:10px 14px;
    border-radius:10px;
    font-size:0.92rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:#F7F7F5;}
  .btn:active{transform:translateY(1px);}
  .btn.danger{color:var(--red);border-color:#F6C9CE;}
  .btn.danger:hover{background:var(--red-tint);}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);}
  .btn.primary:hover{background:#DE8900;}
  .btn.active{background:var(--red);color:#fff;border-color:var(--red);}
  .btn.active:hover{background:#CE2938;}
  .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, .count-btn:focus-visible{
    outline:3px solid #2B71B9;outline-offset:2px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:14px;
  }
  .search-wrap{flex:1;min-width:220px;position:relative;}
  .search-wrap input{
    width:100%;
    padding:12px 14px 12px 40px;
    font-size:1rem;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
  }
  .search-wrap input:focus{outline:none;border-color:var(--blue);}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:0.45;}
  .date-line{
    font-size:0.85rem;color:var(--text-soft);font-weight:600;margin:2px 2px 12px;
  }

  /* ---------- Category grid ---------- */
  #categoryList{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(330px, 1fr));
    gap:14px;
  }
  .category{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;flex-direction:column;
    border-left:5px solid var(--accent, var(--orange));
  }
  .category-head{
    display:flex;align-items:center;gap:10px;
    padding:14px 14px 12px;
    border-bottom:1px solid var(--border);
  }
  .chip{
    width:34px;height:34px;border-radius:9px;
    background:var(--accent-tint, var(--orange-tint));
    color:var(--accent, var(--orange));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:0.95rem;flex-shrink:0;
  }
  .category-head h2{
    font-size:1.08rem;margin:0;flex:1;min-width:0;
    font-weight:800;
    overflow-wrap:anywhere;
  }
  .head-actions{display:flex;gap:2px;flex-shrink:0;}
  .icon-btn{
    border:none;background:transparent;cursor:pointer;
    width:32px;height:32px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-soft);font-size:1rem;
  }
  .icon-btn:hover{background:#F1F1EF;color:var(--text);}
  .icon-btn.del:hover{background:var(--red-tint);color:var(--red);}
  .collapse-btn{transition:transform .15s ease;}
  .category.collapsed .collapse-btn{transform:rotate(-90deg);}
  .category.collapsed .items{display:none;}

  .items{padding:6px 10px 10px;}
  .item-row{
    display:flex;flex-direction:column;
    gap:6px;
    padding:10px 6px;
    border-bottom:1px dashed var(--border);
  }
  .item-row:last-of-type{border-bottom:none;}
  .item-main{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .item-label{display:flex;align-items:center;gap:4px;min-width:0;flex:1;}
  .size-badge{
    font-size:1.08rem;font-weight:700;
    background:var(--accent-tint, var(--orange-tint));
    color:var(--accent, var(--orange));
    padding:5px 11px;border-radius:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;
  }
  .item-row .icon-btn{width:28px;height:28px;font-size:0.85rem;}

  .stock-line{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:0.92rem;color:var(--text-soft);}
  .stock-line .stock-label{font-weight:700;}
  .stock-value{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .stock-value.low{color:var(--red);}
  .low-tag{background:var(--red-tint);color:var(--red);font-size:0.7rem;font-weight:800;padding:2px 7px;border-radius:6px;}
  .threshold-note{font-size:0.78rem;color:var(--text-soft);background:#F1F1EF;padding:2px 8px;border-radius:6px;font-weight:600;}
  .stock-line .icon-btn{width:26px;height:26px;font-size:0.78rem;margin-left:auto;}

  .counter{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .count-btn{
    width:40px;height:40px;border-radius:10px;
    border:1px solid var(--border);background:var(--panel);
    font-size:1.35rem;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);line-height:1;
    user-select:none;
  }
  .count-btn.plus{background:var(--orange);border-color:var(--orange);color:#fff;}
  .count-btn.plus:hover{background:#DE8900;}
  .count-btn.minus:hover{background:var(--red-tint);color:var(--red);border-color:#F6C9CE;}
  .count-btn:active{transform:scale(0.94);}
  .count-value{
    min-width:2.2ch;text-align:center;
    font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;
  }

  .add-item-row{padding:10px 6px 4px;}
  .add-item-btn{
    width:100%;
    border:1.5px dashed var(--border);
    background:transparent;
    color:var(--text-soft);
    padding:9px;border-radius:10px;
    font-weight:700;font-size:0.9rem;cursor:pointer;
  }
  .add-item-btn:hover{border-color:var(--accent, var(--orange));color:var(--accent, var(--orange));background:var(--accent-tint, var(--orange-tint));}

  .add-category-card{
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    min-height:88px;
    background:transparent;
    color:var(--text-soft);
    font-weight:800;font-size:1rem;cursor:pointer;
  }
  .add-category-card:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-tint);}

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--text-soft);
    font-size:1rem;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(34,24,22,0.42);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{
    background:var(--panel);border-radius:18px;
    padding:22px;max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal.wide{max-width:640px;}
  .modal h3{margin:0 0 8px;font-size:1.15rem;font-weight:800;}
  .modal p{margin:0 0 16px;color:var(--text-soft);font-size:0.95rem;line-height:1.5;}
  .modal input{
    width:100%;padding:11px 13px;font-size:1.05rem;
    border-radius:10px;border:1px solid var(--border);margin-bottom:16px;
  }
  .modal input:focus{outline:none;border-color:var(--blue);}
  .modal .field-label{display:block;font-size:0.85rem;font-weight:700;color:var(--text-soft);margin:14px 0 6px;}
  .modal .field-label:first-of-type{margin-top:0;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}
  .modal-actions .btn{padding:10px 18px;}

  .history-list{max-height:340px;overflow-y:auto;margin:-4px 0 16px;}
  .history-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .history-row:hover{background:#F7F7F5;}
  .history-row .d{font-weight:700;}
  .history-row .t{color:var(--text-soft);font-size:0.88rem;}
  .history-detail{max-height:360px;overflow-y:auto;}
  .history-detail .row{display:flex;justify-content:space-between;padding:7px 2px;font-size:0.95rem;border-bottom:1px dashed var(--border);}
  .history-detail .cat{color:var(--text-soft);font-size:0.8rem;}

  .bulk-body{max-height:56vh;overflow-y:auto;margin:-2px -4px 16px 0;padding-right:6px;}
  .bulk-cat h4{margin:16px 0 6px;font-size:0.92rem;color:var(--text-soft);border-bottom:1px solid var(--border);padding-bottom:5px;font-weight:800;}
  .bulk-cat:first-child h4{margin-top:0;}
  .bulk-row{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;gap:10px;}
  .bulk-row span{font-weight:600;font-size:0.96rem;}
  .bulk-input{width:88px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:1rem;text-align:right;margin:0;}
  .bulk-input:focus{outline:none;border-color:var(--blue);}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#221816;color:#fff;padding:11px 20px;border-radius:10px;
    font-size:0.92rem;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:60;
    max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading-wrap{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-soft);
  }

  footer.note{
    text-align:center;color:var(--text-soft);font-size:0.8rem;margin-top:24px;line-height:1.6;
  }

  @media (max-width:560px){
    html{font-size:16px;}
    .brand h1{font-size:1.1rem;}
    .summary{width:100%;justify-content:space-between;}
    #categoryList{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-text">
        <div class="cross-mark"><span></span><span></span><span></span><span></span></div>
        <div class="brand-titles">
          <h1>처치실 보조기 일일 카운트</h1>
          <p class="sub">본정형외과 · 천안</p>
        </div>
      </div>
    </div>
    <div class="summary">
      <div class="total-badge">
        <span class="num" id="totalCount">0</span>
        <span class="lbl">오늘 총 사용</span>
      </div>
      <button class="total-badge low-badge" id="lowStockBadge" title="클릭하면 재고부족 품목만 볼 수 있어요">
        <span class="num" id="lowStockCount">0</span>
        <span class="lbl">재고부족</span>
      </button>
      <button class="icon-btn" id="thresholdBtn" aria-label="재고부족 기준 수정" title="재고부족 기준 수정" style="border:1px solid var(--border);">&#9881;</button>
      <button class="btn" id="historyBtn">지난 기록</button>
      <button class="btn" id="biweekBtn">2주 통계</button>
      <button class="btn danger" id="resetBtn">오늘 초기화</button>
    </div>
  </div>

  <div class="date-line" id="todayLabel"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="품목 검색 (예: wrist, 좌L, 깁스신발)">
    </div>
    <button class="btn" id="bulkStockBtn">재고 일괄 입력</button>
    <button class="btn" id="stockFilterBtn">재고부족만 보기</button>
    <button class="btn" id="expandAllBtn">전체 펼치기</button>
    <button class="btn" id="collapseAllBtn">전체 접기</button>
  </div>

  <div id="categoryList">
    <div class="loading-wrap">불러오는 중...</div>
  </div>

  <footer class="note">이 카운트와 재고는 처치실 전체 선생님이 함께 보고 기록하는 공용 데이터입니다 · 날짜가 바뀌면 사용 카운트는 자동으로 0부터 다시 시작되지만 재고 수량은 계속 이어집니다 · 사용(+) 시 재고가 자동으로 1개 줄어듭니다</footer>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
(function(){
  "use strict";

  var CATALOG = [["복대", [""]], ["팔걸이 (파랑)", [""]], ["팔걸이 (분홍)", [""]], ["깁스신발", ["S", "M", "L", "XL"]], ["M-splint (thumb)", ["좌 S", "좌 M", "좌 L", "우 S", "우 M", "우 L"]], ["M-splint (wrist)", ["좌 S", "좌 M", "좌 L", "좌 XL", "우 S", "우 M", "우 L", "우 XL"]], ["M-splint (finger)", ["S", "M", "L"]], ["M-splint Leg (ankle)", ["S", "M", "L", "XL", "XXL"]], ["M-splint (long leg)", ["M", "L", "XL"]], ["JS-Tap EB (elbow)", ["S", "M", "L", "XL"]], ["JS-Tap KB (knee)", ["S", "M", "L", "XL"]], ["Q-splint (Ulnar)", ["좌S", "좌M", "좌L", "우S", "우M", "우L"]], ["Q-splint (wrist)", ["좌S", "좌M", "좌L", "우S", "우M", "우L"]], ["Q-splint (thumb)", ["좌S", "좌M", "좌L", "우S", "우M", "우L"]], ["Q-splint (long arm)", ["좌S", "좌M", "좌L", "우S", "우M", "우L"]], ["Q-splint (short leg)", ["소", "플러스 소", "중", "대"]], ["Q-splint (cylinder)", ["좌M", "좌L", "우M", "우L"]], ["Q-splint (long leg)", ["소", "플러스 소", "중", "대"]]];
  var ACCENTS = [
    {c:'#F59701', t:'#FFF3E0'},
    {c:'#2B71B9', t:'#E9F1FA'},
    {c:'#8FB60A', t:'#F3F8E4'},
    {c:'#E83344', t:'#FDECEE'}
  ];

  var items = [];        // {id, category, size, stock}
  var counts = {};        // {itemId: number}
  var collapsedCats = {}; // {categoryName: bool}
  var todayKey = "";
  var settings = { lowStockThreshold: 5 };
  var stockFilterOn = false;

  /* ---------- 구글 시트 연동 (Apps Script 웹앱 API) ---------- */
  // ⚠️ 깃허브에 올라가는 실제 웹앱 주소입니다. Apps Script를 재배포해도 이 exec 주소는
  // 그대로 유지되니(같은 배포를 "새 버전"으로 갱신하는 경우) 보통 다시 바꿀 필요 없습니다.
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVvq5_RuAq6k5ArlQ6nJCTvpJrH9vWoNGyXjLFVkoEeEqMV6Z0HtYTRPLXvr5WdlwW/exec";

  window.storage = {
    get: async function(key){
      var res = await fetch(SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key));
      if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
      var data = await res.json();
      if (data.error) throw new Error(data.error);
      if (data.value === null || data.value === undefined) return null;
      return { key: data.key, value: data.value, shared: true };
    },
    set: async function(key, value){
      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'set', key: key, value: value })
      });
      if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
      var data = await res.json();
      if (data.error) throw new Error(data.error);
      return { key: data.key, value: data.value, shared: true };
    },
    list: async function(prefix){
      var res = await fetch(SCRIPT_URL + '?action=list&prefix=' + encodeURIComponent(prefix || ''));
      if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
      var data = await res.json();
      if (data.error) throw new Error(data.error);
      return { keys: data.keys || [] };
    },
    delete: async function(key){
      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', key: key })
      });
      if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
      return await res.json();
    }
  };

  /* ---------- 품목(Items) 전용 API — 구글 시트의 품목마스터 표를 행 단위로 조작 ---------- */
  async function apiGetItems(){
    var res = await fetch(SCRIPT_URL + '?action=getItems');
    if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.items || [];
  }
  async function apiPost(payload){
    var res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }
  async function apiAddItem(category, size, stock, threshold){
    var payload = { action: 'addItem', category: category, size: size, stock: stock || 0 };
    if (typeof threshold === 'number' && !isNaN(threshold)) payload.threshold = threshold;
    var data = await apiPost(payload);
    return data.item;
  }
  async function apiDeleteItem(id){
    return apiPost({ action: 'deleteItem', id: id });
  }
  async function apiUpdateItem(id, patch){
    var payload = Object.assign({ action: 'updateItem', id: id }, patch);
    return apiPost(payload);
  }
  async function apiBulkUpdateStock(updates){
    return apiPost({ action: 'bulkUpdateStock', updates: updates });
  }
  async function apiCountChange(id, delta){
    return apiPost({ action: 'countChange', id: id, delta: delta });
  }
  async function apiRenameCategory(oldName, newName){
    return apiPost({ action: 'renameCategory', oldName: oldName, newName: newName });
  }
  async function apiDeleteCategory(category){
    return apiPost({ action: 'deleteCategory', category: category });
  }

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function friendlyDate(dstr){
    var d = new Date(dstr+"T00:00:00");
    if (isNaN(d.getTime())) return dstr;
    var days = ['일','월','화','수','목','금','토'];
    return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+days[d.getDay()]+")";
  }
  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  async function getJSON(key, shared, fallback){
    try{
      var res = await window.storage.get(key, shared);
      if (!res || res.value === undefined || res.value === null) return fallback;
      return JSON.parse(res.value);
    }catch(e){
      return fallback;
    }
  }
  async function setJSON(key, shared, value){
    try{
      var res = await window.storage.set(key, JSON.stringify(value), shared);
      if (!res) showToast('저장에 실패했어요. 다시 시도해주세요.');
      return !!res;
    }catch(e){
      showToast('저장에 실패했어요. 인터넷 연결을 확인해주세요.');
      return false;
    }
  }
  async function listKeys(prefix, shared){
    try{
      var res = await window.storage.list(prefix, shared);
      if (!res || !res.keys) return [];
      return res.keys;
    }catch(e){
      return [];
    }
  }

  function buildDefaultItems(){
    var arr = [];
    CATALOG.forEach(function(cat){
      var name = cat[0], sizes = cat[1];
      sizes.forEach(function(sz){
        arr.push({ id: uid(), category: name, size: sz || "기본", stock: 0 });
      });
    });
    return arr;
  }

  function categoryOrder(){
    var seen = [], set = {};
    items.forEach(function(it){
      if (!set[it.category]){ set[it.category]=true; seen.push(it.category); }
    });
    return seen;
  }

  function accentFor(catName){
    var order = categoryOrder();
    var idx = order.indexOf(catName);
    if (idx < 0) idx = 0;
    return ACCENTS[idx % ACCENTS.length];
  }

  function totalToday(){
    var sum = 0;
    Object.keys(counts).forEach(function(k){ sum += (counts[k]||0); });
    return sum;
  }

  function updateTotalBadge(){
    document.getElementById('totalCount').textContent = totalToday();
  }

  function itemThreshold(it){
    return (it && typeof it.threshold === 'number' && !isNaN(it.threshold)) ? it.threshold : settings.lowStockThreshold;
  }

  function lowStockCount(){
    return items.filter(function(it){ return (it.stock||0) <= itemThreshold(it); }).length;
  }
  function updateHeaderLowBadge(){
    var el = document.getElementById('lowStockCount');
    if (el) el.textContent = lowStockCount();
  }

  async function persistCounts(){
    await setJSON('counts:'+todayKey, true, counts);
  }
  async function persistSettings(){
    await setJSON('settings', true, settings);
  }

  function updateStockDom(id){
    var it = items.find(function(x){ return x.id === id; });
    if (!it) return;
    var low = (it.stock||0) <= itemThreshold(it);
    var sv = document.getElementById('sv-'+id);
    if (sv){ sv.textContent = (it.stock||0)+'개'; sv.classList.toggle('low', low); }
    var lt = document.getElementById('lt-'+id);
    if (lt) lt.style.display = low ? 'inline-block' : 'none';
  }

  function changeCount(id, delta){
    var it = items.find(function(x){ return x.id === id; });
    if (!it) return;
    var cur = counts[id] || 0;
    var next = Math.max(0, cur + delta);
    var applied = next - cur;
    counts[id] = next;
    it.stock = (it.stock||0) - applied;
    var el = document.getElementById('cv-'+id);
    if (el) el.textContent = next;
    updateTotalBadge();
    persistCounts();
    if (applied !== 0){
      apiCountChange(id, -applied).catch(function(e){
        console.error('재고 저장 실패', e);
        showToast('재고 저장에 실패했어요. 인터넷 연결을 확인해주세요.');
      });
      updateHeaderLowBadge();
      if (stockFilterOn){ render(); } else { updateStockDom(id); }
      if ((it.stock||0) <= 0) showToast('"'+it.category+' · '+it.size+'" 재고가 부족해요.');
    }
  }

    var it = items.find(function(x){ return x.id === id; });

      '<p>'+esc(it.category+' · '+it.size)+'</p>'+

      '<input id="mThreshold" type="number" inputmode="numeric" min="0" placeholder="예: 5" value="'+currentThreshold+'">'+
      '<div class="modal-actions"><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mSave">저장</button></div>',
      function(){
        var stockInput = document.getElementById('mStock');

        stockInput.select();
        document.getElementById('mCancel').onclick = closeModal;
        document.getElementById('mSave').onclick = function(){
          var sv = parseInt(stockInput.value, 10);

          var patch = { stock: it.stock };

            delete it.threshold;

          } else {

            it.threshold = isNaN(tv) ? undefined : Math.max(0, tv);

          closeModal();

  /* ---------- Modal helpers ---------- */
  function openModal(html, onMount, extraClass){
    var root = document.getElementById('modalRoot');
    var cls = 'modal' + (extraClass ? ' '+extraClass : '');
    root.innerHTML = '<div class="modal-backdrop" id="mb"><div class="'+cls+'">'+html+'</div></div>';
    var bd = document.getElementById('mb');
    bd.addEventListener('click', function(e){ if (e.target === bd) closeModal(); });
    document.addEventListener('keydown', escHandler);
    if (onMount) onMount(root);
  }
  function escHandler(e){ if (e.key === 'Escape') closeModal(); }
  function closeModal(){
    document.getElementById('modalRoot').innerHTML = '';
    document.removeEventListener('keydown', escHandler);
  }

  function confirmModal(title, desc, confirmLabel, onConfirm){
    openModal(
      '<h3>'+title+'</h3><p>'+desc+'</p>'+
      '<div class="modal-actions">'+
        '<button class="btn" id="mCancel">취소</button>'+
        '<button class="btn danger" id="mOk">'+confirmLabel+'</button>'+
      '</div>',
      function(){
        document.getElementById('mCancel').onclick = closeModal;
        document.getElementById('mOk').onclick = function(){ closeModal(); onConfirm(); };
      }
    );
  }

  function promptModal(title, desc, placeholder, initial, confirmLabel, onConfirm, inputType){
    var type = inputType || 'text';
    var extraAttrs = type === 'number' ? ' inputmode="numeric" min="0"' : '';
    openModal(
      '<h3>'+title+'</h3>'+(desc ? '<p>'+desc+'</p>' : '')+
      '<input id="mInput" type="'+type+'"'+extraAttrs+' placeholder="'+placeholder+'" value="'+(initial||'').replace(/"/g,'&quot;')+'">'+
      '<div class="modal-actions">'+
        '<button class="btn" id="mCancel">취소</button>'+
        '<button class="btn primary" id="mOk">'+confirmLabel+'</button>'+
      '</div>',
      function(){
        var input = document.getElementById('mInput');
        input.focus();
        input.select();
        document.getElementById('mCancel').onclick = closeModal;
        document.getElementById('mOk').onclick = function(){
          var v = input.value.trim();
          if (!v) { input.focus(); return; }
          closeModal();
          onConfirm(v);
        };
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter') document.getElementById('mOk').click();
        });
      }
    );
  }

  /* ---------- 2주 단위 통계 ---------- */
  // 1970-01-05(월요일)를 기준점으로 14일씩 끊어서, 어떤 날짜든 항상 같은 2주 구간에
  // 속하도록 만듭니다. 이렇게 하면 나중에 다시 열어도 구간 경계가 흔들리지 않아요.
  function biweekBucketInfo(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    var epoch = new Date(1970,0,5); // 기준 월요일
    var diffDays = Math.floor((d - epoch)/86400000);
    var bucketIndex = Math.floor(diffDays/14);
    var bucketStart = new Date(epoch.getTime() + bucketIndex*14*86400000);
    var bucketEnd = new Date(bucketStart.getTime() + 13*86400000);
    function fmt(dt){ return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
    return { index: bucketIndex, startStr: fmt(bucketStart), endStr: fmt(bucketEnd) };
  }
  function friendlyRange(startStr, endStr){
    var s = new Date(startStr+'T00:00:00'), e = new Date(endStr+'T00:00:00');
    function short(dt){ return (dt.getMonth()+1)+'월 '+dt.getDate()+'일'; }
    return s.getFullYear()+'년 '+short(s)+' ~ '+short(e);
  }

  async function openBiweekStats(){
    openModal('<h3>2주 단위 통계</h3><p>불러오는 중...</p>', function(){});
    var keys = await listKeys('counts:', true);
    var buckets = {};
    for (var i=0;i<keys.length;i++){
      var k = keys[i];
      var dateStr = k.indexOf('counts:')===0 ? k.slice(7) : k;
      var info = biweekBucketInfo(dateStr);
      var d = await getJSON(k, true, {});
      if (!buckets[info.index]) buckets[info.index] = { startStr: info.startStr, endStr: info.endStr, total: 0, byItem: {} };
      var b = buckets[info.index];
      Object.keys(d).forEach(function(id){
        var v = d[id]||0;
        if (!v) return;
        b.total += v;
        b.byItem[id] = (b.byItem[id]||0) + v;
      });
    }
    var bucketList = Object.keys(buckets).map(function(idx){ return { idx: parseInt(idx,10), data: buckets[idx] }; });
    bucketList.sort(function(a,b){ return b.idx - a.idx; });

    if (bucketList.length === 0){
      openModal('<h3>2주 단위 통계</h3><p>아직 집계할 기록이 없어요.</p><div class="modal-actions"><button class="btn" id="mClose">닫기</button></div>', function(){
        document.getElementById('mClose').onclick = closeModal;
      });
      return;
    }

    var html = '<h3>2주 단위 통계</h3><p>14일씩 묶어서 품목 사용량을 합산했어요. 기간을 눌러 품목별 내역을 보세요.</p><div class="history-list">'+
      bucketList.map(function(b,i){
        return '<div class="history-row" data-idx="'+i+'"><span class="d">'+friendlyRange(b.data.startStr,b.data.endStr)+'</span><span class="t">총 '+b.data.total+'개</span></div>';
      }).join('')+
      '</div><div class="modal-actions"><button class="btn" id="mClose">닫기</button></div>';

    openModal(html, function(){
      document.getElementById('mClose').onclick = closeModal;
      document.querySelectorAll('.history-row').forEach(function(el){
        el.addEventListener('click', function(){
          var b = bucketList[parseInt(el.getAttribute('data-idx'),10)];
          showBiweekDetail(b, bucketList);
        });
      });
    });
  }

  function showBiweekDetail(b, bucketList){
    var entries = Object.keys(b.data.byItem).map(function(id){
      var it = items.find(function(x){ return x.id===id; });
      var label = it ? (it.category+' · '+it.size) : '(삭제된 품목)';
      return { label: label, v: b.data.byItem[id] };
    }).sort(function(a,c){ return c.v - a.v; });

    var rowsHtml = entries.length === 0
      ? '<p>이 기간엔 기록된 사용량이 없어요.</p>'
      : '<div class="history-detail">'+ entries.map(function(e){
          return '<div class="row"><span>'+esc(e.label)+'</span><span><b>'+e.v+'</b></span></div>';
        }).join('') + '</div>';

    openModal(
      '<h3>'+friendlyRange(b.data.startStr,b.data.endStr)+'</h3><p>총 '+b.data.total+'개 사용</p>'+rowsHtml+
      '<div class="modal-actions"><button class="btn" id="mBack">뒤로</button><button class="btn primary" id="mClose">닫기</button></div>',
      function(){
        document.getElementById('mClose').onclick = closeModal;
        document.getElementById('mBack').onclick = function(){ openBiweekStats(); };
      }
    );
  }

  /* ---------- History ---------- */
  async function openHistory(){
    openModal('<h3>지난 기록</h3><p>불러오는 중...</p>', function(){});
    var keys = await listKeys('counts:', true);
    keys = keys.filter(function(k){ return k !== todayKey; });
    keys.sort().reverse();
    keys = keys.slice(0, 30);

    if (keys.length === 0){
      openModal('<h3>지난 기록</h3><p>아직 지난 기록이 없어요.</p><div class="modal-actions"><button class="btn" id="mClose">닫기</button></div>', function(){
        document.getElementById('mClose').onclick = closeModal;
      });
      return;
    }

    var rows = [];
    for (var i=0;i<keys.length;i++){
      var k = keys[i];
      var d = await getJSON(k, true, {});
      var total = Object.keys(d).reduce(function(s,id){ return s + (d[id]||0); }, 0);
      var dateLabel = k.indexOf('counts:') === 0 ? k.slice(7) : k;
      rows.push({ key:k, date: dateLabel, total: total, data: d });
    }

    var html = '<h3>지난 기록</h3><div class="history-list">'+
      rows.map(function(r,i){
        return '<div class="history-row" data-idx="'+i+'"><span class="d">'+friendlyDate(r.date)+'</span><span class="t">총 '+r.total+'개</span></div>';
      }).join('')+
      '</div><div class="modal-actions"><button class="btn" id="mClose">닫기</button></div>';

    openModal(html, function(){
      document.getElementById('mClose').onclick = closeModal;
      document.querySelectorAll('.history-row').forEach(function(el){
        el.addEventListener('click', function(){
          var r = rows[parseInt(el.getAttribute('data-idx'),10)];
          showHistoryDetail(r);
        });
      });
    });
  }

  function showHistoryDetail(r){
    var nonzero = Object.keys(r.data).filter(function(id){ return (r.data[id]||0) > 0; });
    var rowsHtml;
    if (nonzero.length === 0){
      rowsHtml = '<p>이 날은 기록된 사용량이 없어요.</p>';
    } else {
      rowsHtml = '<div class="history-detail">'+ nonzero.map(function(id){
        var it = items.find(function(x){ return x.id === id; });
        var label = it ? (it.category+' · '+it.size) : '(삭제된 품목)';
        return '<div class="row"><span>'+label+'</span><span><b>'+r.data[id]+'</b></span></div>';
      }).join('') + '</div>';
    }
    openModal(
      '<h3>'+friendlyDate(r.date)+'</h3><p>총 '+r.total+'개 사용</p>'+rowsHtml+
      '<div class="modal-actions"><button class="btn" id="mBack">뒤로</button><button class="btn primary" id="mClose">닫기</button></div>',
      function(){
        document.getElementById('mClose').onclick = closeModal;
        document.getElementById('mBack').onclick = openHistory;
      }
    );
  }

  /* ---------- Render ---------- */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(){
    var listEl = document.getElementById('categoryList');
    var query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

    var order = categoryOrder();
    var htmlParts = [];
    var anyMatch = false;

    order.forEach(function(catName){
      var catItems = items.filter(function(x){ return x.category === catName; });
      var accent = accentFor(catName);
      var filteredItems = catItems.filter(function(it){
        var matchesQuery = !query || (it.category+' '+it.size).toLowerCase().indexOf(query) !== -1;
        var matchesStock = !stockFilterOn || (it.stock||0) <= itemThreshold(it);
        return matchesQuery && matchesStock;
      });
      if ((query || stockFilterOn) && filteredItems.length === 0) return;
      anyMatch = true;

      var collapsed = !!collapsedCats[catName];
      var chipChar = catName.trim().charAt(0).toUpperCase();

      var itemsHtml = filteredItems.map(function(it){
        var c = counts[it.id] || 0;
        var stock = it.stock||0;
        var low = stock <= itemThreshold(it);
        return (
          '<div class="item-row" data-id="'+it.id+'">'+
            '<div class="item-main">'+
              '<div class="item-label">'+
                '<span class="size-badge" style="--accent:'+accent.c+';--accent-tint:'+accent.t+'">'+esc(it.size)+'</span>'+
                '<button class="icon-btn edit-item" data-id="'+it.id+'" aria-label="수정" title="수정">&#9998;</button>'+
                '<button class="icon-btn del del-item" data-id="'+it.id+'" aria-label="삭제" title="삭제">&#128465;</button>'+
              '</div>'+
              '<div class="counter">'+
                '<button class="count-btn minus" data-id="'+it.id+'" data-d="-1" aria-label="'+esc(it.size)+' 감소">&minus;</button>'+
                '<span class="count-value" id="cv-'+it.id+'">'+c+'</span>'+
                '<button class="count-btn plus" data-id="'+it.id+'" data-d="1" aria-label="'+esc(it.size)+' 증가">+</button>'+
              '</div>'+
            '</div>'+
            '<div class="stock-line">'+
              '<span class="stock-label">재고</span>'+
              '<span class="stock-value'+(low?' low':'')+'" id="sv-'+it.id+'">'+stock+'개</span>'+
              '<span class="low-tag" id="lt-'+it.id+'" style="display:'+(low?'inline-block':'none')+'">부족</span>'+
              (typeof it.threshold==='number' ? '<span class="threshold-note">기준 '+it.threshold+'개</span>' : '')+
              '<button class="icon-btn edit-stock" data-id="'+it.id+'" aria-label="재고 수정" title="재고 수정">&#9998;</button>'+
            '</div>'+
          '</div>'
        );
      }).join('');

      htmlParts.push(
        '<section class="category'+(collapsed?' collapsed':'')+'" style="--accent:'+accent.c+';--accent-tint:'+accent.t+'" data-cat="'+esc(catName)+'">'+
          '<div class="category-head">'+
            '<span class="chip">'+esc(chipChar)+'</span>'+
            '<h2>'+esc(catName)+'</h2>'+
            '<div class="head-actions">'+
              '<button class="icon-btn edit-cat" data-cat="'+esc(catName)+'" aria-label="그룹명 수정" title="그룹명 수정">&#9998;</button>'+
              '<button class="icon-btn del del-cat" data-cat="'+esc(catName)+'" aria-label="그룹 삭제" title="그룹 삭제">&#128465;</button>'+
              '<button class="icon-btn collapse-btn" data-cat="'+esc(catName)+'" aria-label="접기/펼치기" title="접기/펼치기">&#9660;</button>'+
            '</div>'+
          '</div>'+
          '<div class="items">'+itemsHtml+
            '<div class="add-item-row"><button class="add-item-btn" data-cat="'+esc(catName)+'">+ 규격 추가</button></div>'+
          '</div>'+
        '</section>'
      );
    });

    if (!query && !stockFilterOn){
      htmlParts.push('<button class="add-category-card" id="addCatBtn">+ 새 그룹 추가</button>');
    }

    if ((query || stockFilterOn) && !anyMatch){
      var emptyMsg = query ? ('"'+esc(query)+'" 검색 결과가 없어요.') : '재고부족 품목이 없어요.';
      listEl.innerHTML = '<div class="empty-state">'+emptyMsg+'</div>';
    } else {
      listEl.innerHTML = htmlParts.join('');
    }

    // wire events
    listEl.querySelectorAll('.count-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        changeCount(btn.getAttribute('data-id'), parseInt(btn.getAttribute('data-d'),10));
      });
    });
    listEl.querySelectorAll('.edit-item').forEach(function(btn){
      btn.addEventListener('click', function(){ editItem(btn.getAttribute('data-id')); });
    });
    listEl.querySelectorAll('.del-item').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteItem(btn.getAttribute('data-id')); });
    });
    listEl.querySelectorAll('.edit-stock').forEach(function(btn){
      btn.addEventListener('click', function(){ editStock(btn.getAttribute('data-id')); });
    });
    listEl.querySelectorAll('.edit-cat').forEach(function(btn){
      btn.addEventListener('click', function(){ editCategory(btn.getAttribute('data-cat')); });
    });
    listEl.querySelectorAll('.del-cat').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteCategory(btn.getAttribute('data-cat')); });
    });
    listEl.querySelectorAll('.collapse-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cat = btn.getAttribute('data-cat');
        collapsedCats[cat] = !collapsedCats[cat];
        render();
      });
    });
    listEl.querySelectorAll('.add-item-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ addItemToCategory(btn.getAttribute('data-cat')); });
    });
    var addCatBtn = document.getElementById('addCatBtn');
    if (addCatBtn) addCatBtn.addEventListener('click', addCategory);

    updateTotalBadge();
  }

  function checkDateRollover(){
    var t = todayStr();
    if (t !== todayKey){
      todayKey = t;
      document.getElementById('todayLabel').textContent = friendlyDate(todayKey);
      getJSON('counts:'+todayKey, true, {}).then(function(c){
        counts = c || {};
        render();
      });
    }
  }

  var isSyncing = false;
  async function refreshFromServer(){
    if (isSyncing) return;
    if (document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim() !== '') return;
    isSyncing = true;
    try {
      var loadedItems = await apiGetItems();
      if (loadedItems && loadedItems.length){
        items = loadedItems;
      }
      var loadedCounts = await getJSON('counts:'+todayKey, true, {});
      counts = loadedCounts || {};
      render();
      updateHeaderLowBadge();
    } catch(e){
      console.error('자동 새로고침 실패', e);
    } finally {
      isSyncing = false;
    }
  }

  async function init(){
    todayKey = todayStr();
    document.getElementById('todayLabel').textContent = friendlyDate(todayKey);

    var loadedItems = await apiGetItems();
    if (!loadedItems || !loadedItems.length){
      items = [];
      var defaults = buildDefaultItems();
      var failed = [];
      for (var di = 0; di < defaults.length; di++){
        var d = defaults[di];
        try {
          var created = await apiAddItem(d.category, d.size, 0);
          items.push(created);
        } catch(e){
          console.error('기본 품목 생성 실패', d, e);
          failed.push(d);
        }
      }
      if (failed.length){
        var stillFailed = [];
        for (var fi = 0; fi < failed.length; fi++){
          var fd = failed[fi];
          try {
            var created2 = await apiAddItem(fd.category, fd.size, 0);
            items.push(created2);
          } catch(e2){
            stillFailed.push(fd);
          }
        }
        if (stillFailed.length){
          showToast(stillFailed.length+'개 품목을 만들지 못했어요. 새로고침 후 다시 시도해주세요.');
        }
      }
    } else {
      items = loadedItems;
    }

    var loadedSettings = await getJSON('settings', true, null);
    if (loadedSettings && typeof loadedSettings.lowStockThreshold === 'number'){
      settings = loadedSettings;
    } else {
      settings = { lowStockThreshold: 5 };
      await persistSettings();
    }

    counts = await getJSON('counts:'+todayKey, true, {});

    render();
    updateHeaderLowBadge();

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('resetBtn').addEventListener('click', resetToday);
    document.getElementById('historyBtn').addEventListener('click', openHistory);
    document.getElementById('biweekBtn').addEventListener('click', openBiweekStats);
    document.getElementById('bulkStockBtn').addEventListener('click', openBulkStock);
    document.getElementById('stockFilterBtn').addEventListener('click', toggleStockFilter);
    document.getElementById('lowStockBadge').addEventListener('click', toggleStockFilter);
    document.getElementById('thresholdBtn').addEventListener('click', editThreshold);
    document.getElementById('expandAllBtn').addEventListener('click', function(){
      collapsedCats = {}; render();
    });
    document.getElementById('collapseAllBtn').addEventListener('click', function(){
      categoryOrder().forEach(function(c){ collapsedCats[c] = true; });
      render();
    });

    setInterval(checkDateRollover, 60000);
    setInterval(refreshFromServer, 30000);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') refreshFromServer();
    });
  }

  init();
})();
</script>
</body>
</html>
